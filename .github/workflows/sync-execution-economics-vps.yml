name: Sync Execution Economics VPS Worktree

on:
  push:
    branches:
      - ops/sync-execution-economics-20261012

permissions:
  contents: read

concurrency:
  group: sync-execution-economics-vps-20261012
  cancel-in-progress: false

jobs:
  verify-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - name: Configure pinned SSH identity and host keys
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Verify, commit and push the isolated VPS worktree
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/irexpro_staging" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          WORKTREE=/home/lightworld/worktrees/irexpro-execution-economics-20261012
          TARGET_BRANCH=fix/execution-economics-20261012
          EXPECTED_BASE=c5f8619dc3dcbd208113279ced945cffd9a8ba9e
          cd "$WORKTREE"

          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"

          allowed='^(apps/api/src/modules/ai/ensemble-governance\.spec\.ts|apps/api/src/modules/ai/ensemble-governance\.ts|apps/api/src/modules/ai/vps-forex-signal-collector\.service\.spec\.ts|apps/api/src/modules/ai/vps-forex-signal-collector\.service\.ts|apps/api/src/modules/ai/paper-payoff-shadow-audit\.spec\.ts|apps/api/src/modules/ai/paper-payoff-shadow-audit\.ts|apps/api/src/modules/ai/paper-post-loss-entry-guard\.spec\.ts|apps/api/src/modules/ai/paper-post-loss-entry-guard\.ts|apps/api/src/modules/broker/services/live-paper-market-data\.service\.ts|apps/api/src/modules/broker/services/paper-market-spec\.ts)$'
          unexpected="$(git status --porcelain=v1 | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected worktree changes:\n%s\n' "$unexpected" >&2
            exit 3
          fi

          echo '== Fresh full API test suite =='
          NODE_OPTIONS=--max-old-space-size=3072 pnpm --filter @irexpro/api exec jest --runInBand --forceExit

          echo '== API production build =='
          pnpm --filter @irexpro/api build

          echo '== Changed-file lint =='
          pnpm --filter @irexpro/api exec eslint \
            src/modules/ai/ensemble-governance.ts \
            src/modules/ai/ensemble-governance.spec.ts \
            src/modules/ai/vps-forex-signal-collector.service.ts \
            src/modules/ai/vps-forex-signal-collector.service.spec.ts \
            src/modules/ai/paper-post-loss-entry-guard.ts \
            src/modules/ai/paper-post-loss-entry-guard.spec.ts \
            src/modules/ai/paper-payoff-shadow-audit.ts \
            src/modules/ai/paper-payoff-shadow-audit.spec.ts \
            src/modules/broker/services/live-paper-market-data.service.ts \
            src/modules/broker/services/paper-market-spec.ts

          echo '== Whitespace/diff integrity =='
          git diff --check

          git add \
            apps/api/src/modules/ai/ensemble-governance.spec.ts \
            apps/api/src/modules/ai/ensemble-governance.ts \
            apps/api/src/modules/ai/vps-forex-signal-collector.service.spec.ts \
            apps/api/src/modules/ai/vps-forex-signal-collector.service.ts \
            apps/api/src/modules/ai/paper-payoff-shadow-audit.spec.ts \
            apps/api/src/modules/ai/paper-payoff-shadow-audit.ts \
            apps/api/src/modules/ai/paper-post-loss-entry-guard.spec.ts \
            apps/api/src/modules/ai/paper-post-loss-entry-guard.ts \
            apps/api/src/modules/broker/services/live-paper-market-data.service.ts \
            apps/api/src/modules/broker/services/paper-market-spec.ts

          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'iRexPro Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Correct PAPER execution economics and post-loss re-entry'
          git push --set-upstream origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "SYNCED_SHA=$(git rev-parse HEAD)"
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
