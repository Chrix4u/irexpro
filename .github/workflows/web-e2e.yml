name: UI E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/api-client/**'
      - 'packages/types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/web-e2e.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/api-client/**'
      - 'packages/types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/web-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  changes:
    name: Detect affected UI app
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.scope.outputs.web }}
      admin: ${{ steps.scope.outputs.admin }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Detect affected app
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi

          web=false
          admin=false
          while IFS= read -r file; do
            case "$file" in
              apps/web/*) web=true ;;
              apps/admin/*) admin=true ;;
              packages/api-client/*|packages/types/*|pnpm-lock.yaml|pnpm-workspace.yaml|package.json)
                web=true
                admin=true
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "$base" "$CANDIDATE_SHA")

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "UI E2E scope: web=$web admin=$admin"

  web-e2e:
    name: Web Playwright (9 viewports)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3999/api/v1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web app (deterministic localhost API URL)
        working-directory: apps/web
        run: pnpm exec next build

      - name: Install Playwright Chromium and system dependencies
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Web Playwright E2E suite (all configured viewport projects)
        id: full_suite
        working-directory: apps/web
        run: pnpm exec playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OUTPUT_DIR: 'playwright-report/full-suite'

      - name: Upload Web full-suite HTML report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-playwright-full-suite-report
          path: apps/web/playwright-report/full-suite
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Web full-suite failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-playwright-full-suite-test-results
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Capture successful-run Web screenshot evidence
        id: evidence
        run: pnpm --filter @irexpro/web test:e2e:evidence
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OUTPUT_DIR: 'playwright-report/evidence'

      - name: Upload Web evidence HTML report
        if: always() && steps.evidence.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-playwright-evidence-report
          path: apps/web/playwright-report/evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Upload successful-run Web screenshot evidence
        if: always() && steps.evidence.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-playwright-evidence
          path: apps/web/test-results/evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Web evidence failure artifacts
        if: always() && steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-playwright-evidence-test-results
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

  admin-e2e:
    name: Admin Playwright (9 viewports)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3998/api/v1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build admin app (deterministic localhost API URL)
        working-directory: apps/admin
        run: pnpm exec next build

      - name: Install Playwright Chromium and system dependencies
        working-directory: apps/admin
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Admin Playwright E2E suite (all configured viewport projects)
        id: full_suite
        working-directory: apps/admin
        run: pnpm exec playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OUTPUT_DIR: 'playwright-report/full-suite'

      - name: Upload Admin full-suite HTML report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: admin-playwright-full-suite-report
          path: apps/admin/playwright-report/full-suite
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Admin full-suite failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: admin-playwright-full-suite-test-results
          path: apps/admin/test-results
          retention-days: 14
          if-no-files-found: ignore
