name: iRexPro DEMO exact provider-close order reconciliation
on:
  push:
    branches: ['fix/pepperstone-demo-closed-order-deal-convergence-20261123']
  pull_request:
    paths:
      - 'apps/api/src/modules/execution/reconciliation/closed-demo-order-deal-proof*'
      - 'apps/api/src/modules/execution/reconciliation/state-reconciliation.service.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-closed-deal-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install API dependencies
        run: pnpm install --frozen-lockfile --filter '@irexpro/api...'
      - name: Full API TypeScript safety check
        run: pnpm --filter @irexpro/api exec tsc --noEmit --incremental false -p tsconfig.build.json
      - name: Verify exact deal proof, reconciliation and preserved domain fill contracts
        run: pnpm --filter @irexpro/api exec jest src/modules/execution/reconciliation/closed-demo-order-deal-proof.spec.ts src/modules/execution/reconciliation/state-reconciliation.service.spec.ts src/modules/execution/orders/order.service.spec.ts src/modules/execution/reconciliation/closed-demo-settlement-proof.spec.ts --runInBand --silent --no-coverage
