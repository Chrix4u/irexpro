name: Temporary Cost Fallback Diagnostic

on:
  push:
    branches:
      - feature/cost-aware-trade-reporting-20261103

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '10.34.5'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch only fallback calculation and regression test
        shell: python
        run: |
          from pathlib import Path

          def once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path_str}: target count={text.count(old)}')
              path.write_text(text.replace(old, new, 1))

          trader = 'apps/web/src/lib/trader-execution.ts'
          once(trader,
              'function divideDecimalString(\n',
              "function costAdjustedRealisedPnl(trade: TradeExecutionView): string | null {\n  if (trade.realisedPnl === null) return null;\n  const rawCommission = trade.commission?.trim() || '0';\n  const rawSwap = trade.swap?.trim() || '0';\n  const commissionMagnitude = rawCommission.replace(/^[+-]/, '');\n  const commissionDebit = /^0(?:\\.0+)?$/.test(commissionMagnitude) ? '0' : `-${commissionMagnitude}`;\n  return sumExactDecimalStrings([trade.realisedPnl, commissionDebit, rawSwap]);\n}\n\nfunction divideDecimalString(\n")
          once(trader,
              "  const pnlValues = realisedTrades.map((trade) => trade.realisedPnl!).filter(Boolean);\n  const netRealisedPnl =\n    realisedTrades.length === 0 || (accountCurrency && pnlValues.length === realisedTrades.length)\n      ? sumExactDecimalStrings(pnlValues)\n      : null;",
              "  const netPnlValues = realisedTrades.map((trade) => costAdjustedRealisedPnl(trade));\n  const netRealisedPnl =\n    realisedTrades.length === 0\n      ? '0'\n      : accountCurrency && netPnlValues.every((value) => value !== null)\n        ? sumExactDecimalStrings(netPnlValues as string[])\n        : null;")
          once(trader,
              "  const netRealisedPnl = sumExactDecimalStrings(\n    realised.map((trade) => trade.realisedPnl!).filter(Boolean),\n  );",
              "  const netPnlValues = realised.map((trade) => costAdjustedRealisedPnl(trade));\n  const netRealisedPnl = netPnlValues.every((value) => value !== null)\n    ? sumExactDecimalStrings(netPnlValues as string[])\n    : null;")

          spec = 'apps/web/src/lib/trader-execution.spec.ts'
          once(spec,
              "  it('uses close time for trailing 24-hour realised P&L even when the trade opened earlier', () => {",
              "  it('reports fallback net P&L after commission magnitude and signed financing costs', () => {\n    const referenceTime = new Date('2026-10-15T15:16:00.000Z');\n    const trades = [\n      { ...CLOSED_TRADE, id: 'ctrader-costs', realisedPnl: '10.00', commission: '1.00', swap: '-0.50', openedAt: '2026-10-15T13:00:00.000Z', closedAt: '2026-10-15T14:00:00.000Z', createdAt: '2026-10-15T13:00:00.000Z' },\n      { ...CLOSED_TRADE, id: 'mt5-signed-commission', realisedPnl: '5.00', commission: '-1.00', swap: '0.25', openedAt: '2026-10-15T13:30:00.000Z', closedAt: '2026-10-15T14:30:00.000Z', createdAt: '2026-10-15T13:30:00.000Z' },\n    ];\n    const summary = summarizeRecentExecutionActivity(trades as any, referenceTime);\n    expect(summary.grossProfit).toBe('15');\n    expect(summary.netRealisedPnl).toBe('12.75');\n    expect(summary.expectancyPerTrade).toBe('6.38');\n    expect(summarizeRealisedExecutionWindow(trades as any, 20).netRealisedPnl).toBe('12.75');\n  });\n\n  it('uses close time for trailing 24-hour realised P&L even when the trade opened earlier', () => {")
      - name: Capture focused Jest output
        shell: bash
        run: |
          set +e
          pnpm --filter @irexpro/web exec jest src/lib/trader-execution.spec.ts --runInBand > cost-fallback-diagnostic.txt 2>&1
          status=$?
          echo >> cost-fallback-diagnostic.txt
          echo "EXIT_STATUS=$status" >> cost-fallback-diagnostic.txt
          cat cost-fallback-diagnostic.txt
          exit 0
      - name: Commit diagnostic output
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cost-fallback-diagnostic.txt
          git commit -m 'chore: capture cost fallback diagnostic output'
          git push
