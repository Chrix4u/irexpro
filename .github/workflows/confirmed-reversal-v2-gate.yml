name: Confirmed Reversal v2 Gate

on:
  push:
    branches:
      - feat/confirmed-reversal-v2-github-20261031
    paths:
      - 'apps/api/src/modules/ai/m1-tactical-evidence.service.ts'
      - 'apps/api/src/modules/ai/m1-tactical-evidence.confirmed-reversal-v2.spec.ts'
      - '.github/workflows/confirmed-reversal-v2-gate.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '10.34.5'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Apply minimal confirmed-reversal v2 policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/ai/m1-tactical-evidence.service.ts')
          source = path.read_text()

          old_constants = """export const M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MIN_TRADES = 8;
          export const M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MAX_PROFIT_FACTOR = 0.65;
          export const M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MAX_AGE_HOURS = 96;
          """
          new_constants = """export const M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MIN_TRADES = 8;
          export const M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MAX_PROFIT_FACTOR = 0.65;
          export const M1_MULTIMODEL_CONFIRMED_REVERSAL_PERSISTENT_NEGATIVE_PAYOFF_MIN_TRADES = 4;
          export const M1_MULTIMODEL_CONFIRMED_REVERSAL_PERSISTENT_NEGATIVE_PAYOFF_MAX_PROFIT_FACTOR =
            0.5;
          export const M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MAX_AGE_HOURS = 96;
          """
          if old_constants not in source:
              raise SystemExit('expected persistent-payoff constants block not found')
          source = source.replace(old_constants, new_constants, 1)

          old_policy = """    const persistentNegativePayoff =
                payoffRows.length >= M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MIN_TRADES &&
                payoffCumulativeRealisedPnl < 0 &&
                profitFactor !== null &&
                profitFactor < M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MAX_PROFIT_FACTOR &&
                persistentEvidenceAgeHours <= M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MAX_AGE_HOURS;
          """
          new_policy = """    const persistentNegativePayoffMinTrades =
                input.strategyRoute === 'CONFIRMED_REVERSAL'
                  ? M1_MULTIMODEL_CONFIRMED_REVERSAL_PERSISTENT_NEGATIVE_PAYOFF_MIN_TRADES
                  : M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MIN_TRADES;
              const persistentNegativePayoffMaxProfitFactor =
                input.strategyRoute === 'CONFIRMED_REVERSAL'
                  ? M1_MULTIMODEL_CONFIRMED_REVERSAL_PERSISTENT_NEGATIVE_PAYOFF_MAX_PROFIT_FACTOR
                  : M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MAX_PROFIT_FACTOR;
              const persistentNegativePayoff =
                payoffRows.length >= persistentNegativePayoffMinTrades &&
                payoffCumulativeRealisedPnl < 0 &&
                profitFactor !== null &&
                profitFactor < persistentNegativePayoffMaxProfitFactor &&
                persistentEvidenceAgeHours <= M1_MULTIMODEL_PERSISTENT_NEGATIVE_PAYOFF_MAX_AGE_HOURS;
          """
          if old_policy not in source:
              raise SystemExit('expected persistent-payoff policy block not found')
          source = source.replace(old_policy, new_policy, 1)
          path.write_text(source)
          PY

      - name: Focused and regression tests
        working-directory: apps/api
        run: |
          pnpm exec jest --runInBand \
            src/modules/ai/m1-tactical-evidence.confirmed-reversal-v2.spec.ts \
            src/modules/ai/m1-tactical-evidence.service.spec.ts \
            src/modules/ai/m1-tactical-scheduler.service.spec.ts \
            src/modules/execution/reconciliation/live-demo-profit-protection.service.spec.ts \
            src/modules/ai/post-entry-demo-drawdown-guard.service.spec.ts \
            src/modules/ai/profit-protection-counterfactual.service.spec.ts
      - name: TypeScript
        working-directory: apps/api
        run: ./node_modules/.bin/tsc --noEmit
      - name: Build
        working-directory: apps/api
        run: pnpm build
      - name: Diff safety
        run: git diff --check

      - name: Persist verified service change
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$(git status --porcelain -- apps/api/src/modules/ai/m1-tactical-evidence.service.ts)"
          git config user.name 'iRexPro Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/api/src/modules/ai/m1-tactical-evidence.service.ts
          git commit -m 'feat(ai): quarantine catastrophic reversal sleeves'
          git push origin HEAD:feat/confirmed-reversal-v2-github-20261031
