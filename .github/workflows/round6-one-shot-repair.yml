name: Round 6 One-Shot Repair

on:
  push:
    branches:
      - ci/github-round6-verification

permissions:
  contents: write

concurrency:
  group: round6-one-shot-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ci/github-round6-verification
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact candidate dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Repair verified semantic lint and E2E drift
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'apps/api/src/modules/execution/execution.service.ts': [
                  (
                      "import {\n  FinalDispatchAuthorization,\n  FinalDispatchBoundary,\n} from './orchestration/final-dispatch-boundary';",
                      "import { FinalDispatchBoundary } from './orchestration/final-dispatch-boundary';",
                  ),
              ],
              'apps/api/src/modules/broker/services/broker-account-snapshot.service.spec.ts': [
                  (
                      "const OTHER_CONN = '44444444-4444-4444-8444-444444444444';\n",
                      "",
                  ),
              ],
              'apps/web/e2e/trader-terminal.spec.ts': [
                  (
                      ".getByRole('heading', { level: 2, name: 'AI Trading Session' })",
                      ".getByRole('heading', { level: 2, name: 'Trading Session — Execution Authority' })",
                  ),
                  (
                      "await expect(sessionCard.getByText(/not exposed to this browser contract/i)).toBeVisible();",
                      "await expect(\n      sessionCard.getByText(/Paper only — new exposure routes to the simulator path/i),\n    ).toBeVisible();",
                  ),
              ],
              'apps/admin/e2e/live-ops.spec.ts': [
                  (
                      "test('provider registry renders brokers, environments, capability chips and +N more'",
                      "test('provider capability matrix renders brokers, environments, capability chips and +N more'",
                  ),
                  (
                      "const registry = page.locator('table[aria-label=\"Provider registry\"]');",
                      "const registry = page.locator('table[aria-label=\"Provider capability matrix\"]');",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one match, found {count}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Auto-fix API formatting and verify lint
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @irexpro/api lint
          pnpm api:lint

      - name: Format changed E2E specs
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @irexpro/web exec prettier --write e2e/trader-terminal.spec.ts
          pnpm --filter @irexpro/admin exec prettier --write e2e/live-ops.spec.ts

      - name: Upgrade vulnerable Nodemailer and regenerate lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @irexpro/api add 'nodemailer@^10.0.10' --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify API build and production dependency audit
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm api:build
          mkdir -p security-artifacts
          set +e
          pnpm audit --prod --json > security-artifacts/pnpm-audit-full.json
          set -e
          node scripts/security/filter-vps-production-audit.mjs \
            security-artifacts/pnpm-audit-full.json \
            security-artifacts/vps-pnpm-audit.json

      - name: Commit verified repairs and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/round6-one-shot-repair.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: clear Round 6 CI blockers'
          git push origin HEAD:ci/github-round6-verification
