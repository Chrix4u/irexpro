name: Temporary account appeal pagination formatter

on:
  push:
    branches:
      - security/account-appeal-pagination

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/account-appeal-pagination
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: pnpm exec prettier --write apps/api/src/modules/users/account-governance.service.ts

      - name: Verify API lint
        run: pnpm api:lint

      - name: Commit formatted permanent change
        run: |
          git rm .github/workflows/tmp-format-account-appeal-pagination.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/users/account-governance.service.ts
          git commit -m "Security: format account appeal pagination service"
          git push origin HEAD:security/account-appeal-pagination
