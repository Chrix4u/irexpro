name: Mobile APK Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - 'packages/types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/mobile-apk.yml'
  push:
    branches:
      - main
      - 'deploy/daily-loss-reset-20261028'
    tags:
      - 'irexpro-mobile-v*'
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - 'packages/types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/mobile-apk.yml'

permissions:
  contents: read

concurrency:
  group: mobile-apk-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_BASE_URL: 'https://irexpro.lightworldtech.com/api/v1'

jobs:
  build-apk:
    name: Build installable Android preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Select Java 17 and verify Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -n "${ANDROID_HOME:-}"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/java" -version
          test -d "$ANDROID_HOME"

      - name: Install pinned Android native toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"

          install_cmake_version() {
            version="$1"
            cmake_dir="$ANDROID_HOME/cmake/$version"
            if test -x "$cmake_dir/bin/cmake" && "$cmake_dir/bin/cmake" --version; then
              echo "CMake $version is already available."
              return 0
            fi

            for attempt in 1 2 3; do
              rm -rf "$cmake_dir"
              if "$sdkmanager" --install "cmake;$version"; then
                if test -x "$cmake_dir/bin/cmake" && "$cmake_dir/bin/cmake" --version; then
                  return 0
                fi
              fi
              echo "::warning::CMake $version install attempt ${attempt}/3 failed; retrying serially."
              sleep $((attempt * 3))
            done
            return 1
          }

          # Expo modules and React Native currently request different CMake
          # versions. Install both serially before Gradle so parallel native
          # configuration tasks never race Android SDK auto-installation.
          install_cmake_version '3.22.1'
          install_cmake_version '3.30.5'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile source
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @irexpro/mobile typecheck
          pnpm --filter @irexpro/mobile test
          pnpm --filter @irexpro/mobile validate:release-config
          pnpm --filter @irexpro/mobile exec expo install --check

      - name: Generate Android native project
        run: >-
          pnpm --filter @irexpro/mobile exec expo prebuild
          --platform android
          --clean
          --no-install

      - name: Build standalone release APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare preview artifact
        id: artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          src='apps/mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$src"
          out="apps/mobile/iRexPro-Android-Preview.apk"
          checksum="apps/mobile/SHA256SUMS.txt"
          cp "$src" "$out"
          (cd apps/mobile && sha256sum iRexPro-Android-Preview.apk > SHA256SUMS.txt)
          cat "$checksum"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: irexpro-android-preview-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.apk }}
            ${{ steps.artifact.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  release-android:
    name: Publish durable Android preview release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/irexpro-mobile-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download validated APK artifact
        uses: actions/download-artifact@v4
        with:
          name: irexpro-android-preview-${{ github.sha }}
          path: release

      - name: Verify release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s release/iRexPro-Android-Preview.apk
          test -s release/SHA256SUMS.txt
          (cd release && sha256sum -c SHA256SUMS.txt)

      - name: Publish GitHub prerelease assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            release/iRexPro-Android-Preview.apk
            release/SHA256SUMS.txt
