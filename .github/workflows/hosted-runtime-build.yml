name: Hosted Runtime Build Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/ai-engine/**'
      - 'scripts/deployment/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/hosted-runtime-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-runtime-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile runtime components off VPS (candidate only)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_TELEMETRY_DISABLED: '1'
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies on hosted runner
        run: pnpm install --frozen-lockfile
      - name: Compile server and browser applications
        run: |
          pnpm --filter @irexpro/api build
          pnpm --filter @irexpro/web build
          pnpm --filter @irexpro/admin build
      - name: Test API and web
        run: |
          pnpm --filter @irexpro/api test --runInBand
          pnpm --filter @irexpro/web test --runInBand
      - name: Archive compiled intermediates
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/irexpro-compiled"
          mkdir -m 700 "$out"
          test -f apps/api/dist/main.js
          test -f apps/web/.next/BUILD_ID
          test -f apps/admin/.next/BUILD_ID
          tar -C apps/api -czf "$out/api-dist.tar.gz" dist
          tar -C apps/web --exclude=.next/cache --exclude=.next/diagnostics -czf "$out/web-build.tar.gz" .next
          tar -C apps/admin --exclude=.next/cache --exclude=.next/diagnostics -czf "$out/admin-build.tar.gz" .next
          printf '%s\n' "$CANDIDATE_SHA" > "$out/SOURCE_SHA"
          printf '%s\n' 'compiled-intermediates-not-deployable' > "$out/STATUS"
          (cd "$out" && sha256sum api-dist.tar.gz web-build.tar.gz admin-build.tar.gz SOURCE_SHA STATUS > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Retain hosted build intermediates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: irexpro-compiled-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/irexpro-compiled/
          if-no-files-found: error
          retention-days: 14
