name: Deployment Script Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/deployment/**'
      - 'docs/operations/staging-deployment.md'
      - 'package.json'
      - '.github/workflows/deployment-script-safety.yml'
      - '.github/workflows/main-staging-release-gate.yml'
      - '.github/workflows/staging-deploy.yml'
      - '.github/workflows/uat-runtime-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/deployment/**'
      - 'docs/operations/staging-deployment.md'
      - 'package.json'
      - '.github/workflows/deployment-script-safety.yml'
      - '.github/workflows/main-staging-release-gate.yml'
      - '.github/workflows/staging-deploy.yml'
      - '.github/workflows/uat-runtime-smoke.yml'

permissions:
  contents: read

concurrency:
  group: deployment-script-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Validate fail-closed deployment scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact workflow candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify checkout matches exact candidate SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Check shell syntax
        run: bash -n scripts/deployment/*.sh

      - name: Run ShellCheck
        run: shellcheck scripts/deployment/*.sh

      - name: Run deployment safety regression tests
        run: |
          bash scripts/deployment/test-deployment-scripts.sh
          bash scripts/deployment/test-rollback-origin-provenance.sh
          bash scripts/deployment/test-health-contract.sh
          bash scripts/deployment/test-staging-cd-bootstrap.sh

      - name: Test exact-main staging release gate policy
        run: node scripts/deployment/main-staging-release-gate.mjs --self-test
