name: iRexPro DEMO drift research
on:
  push:
    branches: ["research/demo-drift-outcome-audit-20261119", "fix/planb-clock-neutral-telemetry-20261111"]
  pull_request:
    paths:
      - "apps/api/scripts/audit-owner-demo-drift-outcomes.cjs"
      - "apps/api/scripts/audit-owner-demo-drift-outcomes.test.cjs"
      - "apps/api/scripts/owner-demo-drift-cohort-comparison.cjs"
      - "apps/api/scripts/owner-demo-drift-cohort-comparison.test.cjs"
      - "apps/api/scripts/owner-demo-rejected-drift-counterfactual.cjs"
      - "apps/api/scripts/owner-demo-rejected-drift-counterfactual.test.cjs"
      - ".github/workflows/irexpro-demo-drift-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-shadow-audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate read-only research script
        run: node --check apps/api/scripts/audit-owner-demo-drift-outcomes.cjs
      - name: Test as-of, outcome coverage and M1 episode separation
        run: node --test apps/api/scripts/audit-owner-demo-drift-outcomes.test.cjs apps/api/scripts/owner-demo-drift-cohort-comparison.test.cjs apps/api/scripts/owner-demo-rejected-drift-counterfactual.test.cjs
