name: PAPER Cohort Evidence

on:
  push:
    branches:
      - 'ops/paper-cohort-evidence-20261009'
    paths:
      - '.github/workflows/paper-cohort-evidence.yml'

permissions:
  contents: read

concurrency:
  group: paper-cohort-evidence-20261009
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read-only prospective PAPER cohort evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging

    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - name: Validate SSH configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_HOST"
          test -n "$STAGING_SSH_PORT"
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]+$ ]]

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Collect aggregate prospective cohort evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/irexpro_staging" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          if command -v psql >/dev/null 2>&1; then
            PSQL="$(command -v psql)"
          elif [[ -x /usr/pgsql-18/bin/psql ]]; then
            PSQL=/usr/pgsql-18/bin/psql
          else
            echo 'ERROR: psql not found' >&2
            exit 2
          fi

          target_db=''
          while IFS= read -r db; do
            [[ -n "$db" ]] || continue
            has_table="$(sudo -u postgres "$PSQL" -X -d "$db" -Atqc \
              "SELECT CASE WHEN to_regclass('trading.ensemble_shadow_decisions') IS NULL THEN 'f' ELSE 't' END;" \
              2>/dev/null || true)"
            if [[ "$has_table" == 't' ]]; then
              target_db="$db"
              break
            fi
          done < <(sudo -u postgres "$PSQL" -X -d postgres -Atqc \
            "SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate ORDER BY datname;")

          if [[ -z "$target_db" ]]; then
            echo 'ERROR: application decision ledger was not found in any local connectable database' >&2
            exit 3
          fi

          echo '=== iRexPro prospective PAPER cohort evidence ==='
          printf 'observed_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo 'database=application-ledger-located'
          echo 'engine=irexpro-multimodel-ensemble-v1'
          echo 'policy=plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
          echo 'deployment_cutoff_utc=2026-10-09T02:30:14Z'
          echo

          sudo -u postgres "$PSQL" -X -v ON_ERROR_STOP=1 -d "$target_db" -At -F '|' <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '20s';

          SELECT 'post_deploy_rows=' || COUNT(*)
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00';

          SELECT 'old_policy_rows_post_deploy=' || COUNT(*)
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v2-directional-momentum-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00';

          SELECT 'latest_evaluated_at_utc=' || COALESCE(to_char(MAX(evaluated_at) AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS"Z"'), 'NONE')
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00';

          SELECT 'latest_market_bar_utc=' || COALESCE(to_char(MAX(market_bar_time) AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS"Z"'), 'NONE')
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00';

          SELECT 'freshness_seconds=' || COALESCE(EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - MAX(evaluated_at)))::bigint::text, 'NONE')
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00';

          SELECT 'distinct_instruments=' || COUNT(DISTINCT instrument)
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00';

          SELECT 'momentum_present=' || COUNT(*)
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00'
            AND components ? 'shortHorizonMomentumAtr'
            AND components->>'shortHorizonMomentumAtr' IS NOT NULL;

          SELECT 'paper_admitted=' || COUNT(*) FILTER (WHERE COALESCE((components->>'paperAdmitted')::boolean, false))
                 || '|promotable_admitted=' || COUNT(*) FILTER (WHERE admitted)
                 || '|paper_execution_eligible=' || COUNT(*) FILTER (
                      WHERE COALESCE((components->'governance'->>'paperExecutionEligible')::boolean, false)
                    )
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00';

          SELECT 'regime=' || COALESCE(regime, 'NULL') || '|count=' || COUNT(*)
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00'
          GROUP BY regime
          ORDER BY COUNT(*) DESC, regime;

          SELECT 'instrument=' || instrument || '|count=' || COUNT(*)
                 || '|buy=' || COUNT(*) FILTER (WHERE direction = 'BUY')
                 || '|sell=' || COUNT(*) FILTER (WHERE direction = 'SELL')
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00'
          GROUP BY instrument
          ORDER BY instrument;

          SELECT 'direction=' || direction || '|count=' || COUNT(*)
                 || '|avg_directional_momentum_atr=' || ROUND(AVG(
                      CASE
                        WHEN direction = 'SELL' THEN -(components->>'shortHorizonMomentumAtr')::numeric
                        ELSE (components->>'shortHorizonMomentumAtr')::numeric
                      END
                    ), 4)
          FROM trading.ensemble_shadow_decisions
          WHERE engine_code = 'irexpro-multimodel-ensemble-v1'
            AND model_version = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
            AND evaluated_at >= TIMESTAMPTZ '2026-10-09 02:30:14+00'
            AND components ? 'shortHorizonMomentumAtr'
            AND components->>'shortHorizonMomentumAtr' IS NOT NULL
          GROUP BY direction
          ORDER BY direction;

          COMMIT;
          SQL
          REMOTE

      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
