name: PAPER Cohort Evidence

on:
  push:
    branches:
      - 'ops/paper-cohort-evidence-20261009'
    paths:
      - '.github/workflows/paper-cohort-evidence.yml'

permissions:
  contents: read

concurrency:
  group: paper-cohort-evidence-20261009
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read-only prospective PAPER cohort evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging

    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - name: Validate SSH configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_HOST"
          test -n "$STAGING_SSH_PORT"
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]+$ ]]

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Collect aggregate prospective cohort evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/irexpro_staging" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          readonly API_ROOT=/home/lightworld/webapps/irexpro-staging/apps/api
          [[ -d "$API_ROOT" ]] || { echo 'ERROR: staging API root missing' >&2; exit 2; }
          [[ -f "$API_ROOT/.env" ]] || { echo 'ERROR: staging API environment missing' >&2; exit 3; }
          cd "$API_ROOT"

          DOTENV_CONFIG_PATH="$API_ROOT/.env" node -r dotenv/config <<'NODE'
          const { Client } = require('pg');

          const engine = 'irexpro-multimodel-ensemble-v1';
          const policy = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1';
          const oldPolicy = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v2-directional-momentum-v1';
          const cutoff = '2026-10-09T02:42:29Z';

          const required = ['DB_HOST', 'DB_NAME', 'DB_USER', 'DB_PASSWORD'];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`Missing required staging database configuration: ${key}`);
          }

          const client = new Client({
            host: process.env.DB_HOST,
            port: Number(process.env.DB_PORT || 5432),
            database: process.env.DB_NAME,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            ssl: process.env.DB_SSL === 'true' ? { rejectUnauthorized: false } : false,
            connectionTimeoutMillis: 10000,
            statement_timeout: 20000,
            application_name: 'irexpro-paper-cohort-readonly-diagnostic',
          });

          function iso(value) {
            return value ? new Date(value).toISOString() : 'NONE';
          }

          function formatNumber(value) {
            if (value == null) return 'NONE';
            const n = Number(value);
            return Number.isFinite(n) ? n.toFixed(4) : 'NONE';
          }

          async function main() {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            try {
              const params = [engine, policy, cutoff];
              const summary = await client.query(
                `SELECT
                   COUNT(*)::int AS post_deploy_rows,
                   MAX(evaluated_at) AS latest_evaluated_at,
                   MAX(market_bar_time) AS latest_market_bar,
                   COUNT(DISTINCT instrument)::int AS distinct_instruments,
                   COUNT(*) FILTER (
                     WHERE components ? 'shortHorizonMomentumAtr'
                       AND components->>'shortHorizonMomentumAtr' IS NOT NULL
                   )::int AS momentum_present,
                   COUNT(*) FILTER (
                     WHERE lower(COALESCE(components->>'paperAdmitted', 'false')) = 'true'
                   )::int AS paper_admitted,
                   COUNT(*) FILTER (WHERE admitted)::int AS promotable_admitted,
                   COUNT(*) FILTER (
                     WHERE lower(COALESCE(components->'governance'->>'paperExecutionEligible', 'false')) = 'true'
                   )::int AS paper_execution_eligible
                 FROM trading.ensemble_shadow_decisions
                 WHERE engine_code = $1
                   AND model_version = $2
                   AND evaluated_at >= $3::timestamptz`,
                params,
              );

              const oldRows = await client.query(
                `SELECT COUNT(*)::int AS count
                 FROM trading.ensemble_shadow_decisions
                 WHERE engine_code = $1
                   AND model_version = $2
                   AND evaluated_at >= $3::timestamptz`,
                [engine, oldPolicy, cutoff],
              );

              const regimes = await client.query(
                `SELECT COALESCE(regime, 'NULL') AS regime, COUNT(*)::int AS count
                 FROM trading.ensemble_shadow_decisions
                 WHERE engine_code = $1
                   AND model_version = $2
                   AND evaluated_at >= $3::timestamptz
                 GROUP BY regime
                 ORDER BY COUNT(*) DESC, regime`,
                params,
              );

              const routes = await client.query(
                `SELECT COALESCE(components->>'strategyRoute', 'NULL') AS route, COUNT(*)::int AS count
                 FROM trading.ensemble_shadow_decisions
                 WHERE engine_code = $1
                   AND model_version = $2
                   AND evaluated_at >= $3::timestamptz
                 GROUP BY components->>'strategyRoute'
                 ORDER BY COUNT(*) DESC, route`,
                params,
              );

              const instruments = await client.query(
                `SELECT instrument,
                        COUNT(*)::int AS count,
                        COUNT(*) FILTER (WHERE direction = 'BUY')::int AS buy,
                        COUNT(*) FILTER (WHERE direction = 'SELL')::int AS sell
                 FROM trading.ensemble_shadow_decisions
                 WHERE engine_code = $1
                   AND model_version = $2
                   AND evaluated_at >= $3::timestamptz
                 GROUP BY instrument
                 ORDER BY instrument`,
                params,
              );

              const directions = await client.query(
                `SELECT direction,
                        COUNT(*)::int AS count,
                        ROUND(AVG(
                          CASE
                            WHEN (components->>'shortHorizonMomentumAtr') ~ '^-?[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$'
                            THEN CASE
                              WHEN direction = 'SELL' THEN -(components->>'shortHorizonMomentumAtr')::numeric
                              ELSE (components->>'shortHorizonMomentumAtr')::numeric
                            END
                            ELSE NULL
                          END
                        ), 4) AS avg_directional_momentum_atr
                 FROM trading.ensemble_shadow_decisions
                 WHERE engine_code = $1
                   AND model_version = $2
                   AND evaluated_at >= $3::timestamptz
                 GROUP BY direction
                 ORDER BY direction`,
                params,
              );

              const ensembleReasons = await client.query(
                `SELECT reason, COUNT(*)::int AS count
                 FROM trading.ensemble_shadow_decisions d
                 CROSS JOIN LATERAL jsonb_array_elements_text(
                   CASE
                     WHEN jsonb_typeof(d.reasons::jsonb) = 'array' THEN d.reasons::jsonb
                     ELSE '[]'::jsonb
                   END
                 ) AS reason
                 WHERE d.engine_code = $1
                   AND d.model_version = $2
                   AND d.evaluated_at >= $3::timestamptz
                 GROUP BY reason
                 ORDER BY COUNT(*) DESC, reason`,
                params,
              );

              const governanceBlockers = await client.query(
                `SELECT blocker, COUNT(*)::int AS count
                 FROM trading.ensemble_shadow_decisions d
                 CROSS JOIN LATERAL jsonb_array_elements_text(
                   CASE
                     WHEN jsonb_typeof(d.components->'governance'->'paperExecutionBlockers') = 'array'
                     THEN d.components->'governance'->'paperExecutionBlockers'
                     ELSE '[]'::jsonb
                   END
                 ) AS blocker
                 WHERE d.engine_code = $1
                   AND d.model_version = $2
                   AND d.evaluated_at >= $3::timestamptz
                 GROUP BY blocker
                 ORDER BY COUNT(*) DESC, blocker`,
                params,
              );

              const governanceGates = await client.query(
                `SELECT
                   COUNT(*) FILTER (
                     WHERE lower(COALESCE(components->'governance'->>'executionSpreadEvidenceValid', 'false')) = 'true'
                   )::int AS spread_valid,
                   COUNT(*) FILTER (
                     WHERE lower(COALESCE(components->'governance'->>'paperNetExpectedRPassed', 'false')) = 'true'
                   )::int AS paper_net_expected_r_passed,
                   COUNT(*) FILTER (
                     WHERE lower(COALESCE(components->'governance'->>'paperDriftPassed', 'false')) = 'true'
                   )::int AS paper_drift_passed,
                   COUNT(*) FILTER (
                     WHERE COALESCE(components->'governance'->>'eventRisk', 'UNVERIFIED') = 'CLEAR'
                   )::int AS event_risk_clear,
                   COUNT(*) FILTER (
                     WHERE COALESCE(components->'governance'->>'sleeveState', 'NULL') = 'COLLECTING'
                   )::int AS sleeve_collecting,
                   COUNT(*) FILTER (
                     WHERE COALESCE(components->'governance'->>'sleeveState', 'NULL') = 'CORE'
                   )::int AS sleeve_core,
                   MIN((components->'governance'->>'netExpectedR')::numeric) AS min_net_expected_r,
                   AVG((components->'governance'->>'netExpectedR')::numeric) AS avg_net_expected_r,
                   MAX((components->'governance'->>'netExpectedR')::numeric) AS max_net_expected_r
                 FROM trading.ensemble_shadow_decisions
                 WHERE engine_code = $1
                   AND model_version = $2
                   AND evaluated_at >= $3::timestamptz`,
                params,
              );

              const ensembleGates = await client.query(
                `SELECT
                   COUNT(*) FILTER (WHERE (components->>'directionQuality')::numeric >= 0.55)::int AS direction_passed,
                   COUNT(*) FILTER (WHERE (components->>'tradeQuality')::numeric >= 0.48)::int AS trade_passed,
                   COUNT(*) FILTER (WHERE (components->>'exitQuality')::numeric >= 0.48)::int AS exit_passed,
                   COUNT(*) FILTER (WHERE (components->>'sessionQuality')::numeric >= 0.50)::int AS session_passed,
                   COUNT(*) FILTER (WHERE (components->>'portfolioQuality')::numeric >= 0.35)::int AS portfolio_passed,
                   MIN((components->>'directionQuality')::numeric) AS min_direction_quality,
                   AVG((components->>'directionQuality')::numeric) AS avg_direction_quality,
                   MAX((components->>'directionQuality')::numeric) AS max_direction_quality,
                   MIN((components->>'tradeQuality')::numeric) AS min_trade_quality,
                   AVG((components->>'tradeQuality')::numeric) AS avg_trade_quality,
                   MAX((components->>'tradeQuality')::numeric) AS max_trade_quality,
                   MIN((components->>'exitQuality')::numeric) AS min_exit_quality,
                   AVG((components->>'exitQuality')::numeric) AS avg_exit_quality,
                   MAX((components->>'exitQuality')::numeric) AS max_exit_quality
                 FROM trading.ensemble_shadow_decisions
                 WHERE engine_code = $1
                   AND model_version = $2
                   AND evaluated_at >= $3::timestamptz`,
                params,
              );

              const row = summary.rows[0];
              const governance = governanceGates.rows[0];
              const ensemble = ensembleGates.rows[0];
              const latest = row.latest_evaluated_at ? new Date(row.latest_evaluated_at) : null;
              const freshnessSeconds = latest ? Math.max(0, Math.round((Date.now() - latest.getTime()) / 1000)) : null;

              console.log('=== iRexPro prospective PAPER cohort evidence ===');
              console.log(`observed_at_utc=${new Date().toISOString()}`);
              console.log(`engine=${engine}`);
              console.log(`policy=${policy}`);
              console.log(`deployment_cutoff_utc=${cutoff}`);
              console.log(`post_deploy_rows=${row.post_deploy_rows}`);
              console.log(`old_policy_rows_post_deploy=${oldRows.rows[0].count}`);
              console.log(`latest_evaluated_at_utc=${iso(row.latest_evaluated_at)}`);
              console.log(`latest_market_bar_utc=${iso(row.latest_market_bar)}`);
              console.log(`freshness_seconds=${freshnessSeconds ?? 'NONE'}`);
              console.log(`distinct_instruments=${row.distinct_instruments}`);
              console.log(`momentum_present=${row.momentum_present}`);
              console.log(`paper_admitted=${row.paper_admitted}|promotable_admitted=${row.promotable_admitted}|paper_execution_eligible=${row.paper_execution_eligible}`);
              console.log(`ensemble_gate_passes=direction:${ensemble.direction_passed}|trade:${ensemble.trade_passed}|exit:${ensemble.exit_passed}|session:${ensemble.session_passed}|portfolio:${ensemble.portfolio_passed}`);
              console.log(`direction_quality=min:${formatNumber(ensemble.min_direction_quality)}|avg:${formatNumber(ensemble.avg_direction_quality)}|max:${formatNumber(ensemble.max_direction_quality)}`);
              console.log(`trade_quality=min:${formatNumber(ensemble.min_trade_quality)}|avg:${formatNumber(ensemble.avg_trade_quality)}|max:${formatNumber(ensemble.max_trade_quality)}`);
              console.log(`exit_quality=min:${formatNumber(ensemble.min_exit_quality)}|avg:${formatNumber(ensemble.avg_exit_quality)}|max:${formatNumber(ensemble.max_exit_quality)}`);
              console.log(`governance_gate_passes=spread_valid:${governance.spread_valid}|paper_net_expected_r:${governance.paper_net_expected_r_passed}|paper_drift:${governance.paper_drift_passed}|event_risk_clear:${governance.event_risk_clear}|sleeve_collecting:${governance.sleeve_collecting}|sleeve_core:${governance.sleeve_core}`);
              console.log(`net_expected_r=min:${formatNumber(governance.min_net_expected_r)}|avg:${formatNumber(governance.avg_net_expected_r)}|max:${formatNumber(governance.max_net_expected_r)}`);
              for (const item of ensembleReasons.rows) {
                console.log(`ensemble_reason=${item.reason}|count=${item.count}`);
              }
              for (const item of governanceBlockers.rows) {
                console.log(`governance_blocker=${item.blocker}|count=${item.count}`);
              }
              for (const item of regimes.rows) {
                console.log(`regime=${item.regime}|count=${item.count}`);
              }
              for (const item of routes.rows) {
                console.log(`strategy_route=${item.route}|count=${item.count}`);
              }
              for (const item of instruments.rows) {
                console.log(`instrument=${item.instrument}|count=${item.count}|buy=${item.buy}|sell=${item.sell}`);
              }
              for (const item of directions.rows) {
                console.log(`direction=${item.direction}|count=${item.count}|avg_directional_momentum_atr=${item.avg_directional_momentum_atr ?? 'NONE'}`);
              }

              await client.query('COMMIT');
            } catch (error) {
              await client.query('ROLLBACK').catch(() => {});
              throw error;
            }
          }

          main()
            .catch((error) => {
              console.error(`ERROR: ${error instanceof Error ? error.message : String(error)}`);
              process.exitCode = 1;
            })
            .finally(async () => {
              await client.end().catch(() => {});
            });
          NODE
          REMOTE

      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
