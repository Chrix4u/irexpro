name: One-shot PR280 full API validation

on:
  push:
    branches:
      - fix/multi-pair-paper-opportunity-eval-20261005
    paths:
      - .github/workflows/one-shot-pr280-api-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint every API TypeScript file changed by stacked PR280
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin fix/trade-read-resilience-20261005 --depth=1
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR origin/fix/trade-read-resilience-20261005...HEAD -- apps/api |
              grep -E '\.ts$' || true
          )
          if (( ${#files[@]} == 0 )); then
            echo 'No changed API TypeScript files.'
            exit 0
          fi
          rel=()
          for file in "${files[@]}"; do rel+=("${file#apps/api/}"); done
          cd apps/api
          pnpm exec eslint "${rel[@]}"

      - name: Run full API Jest suite
        run: pnpm --filter @irexpro/api exec jest --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: irexpro_test
          DB_USER: irexpro
          DB_PASSWORD: test_password
          COOKIE_SECRET: test_cookie_secret_min_16

      - name: Build API
        run: pnpm api:build
