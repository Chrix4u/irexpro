name: Release Security

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  PYTHON_VERSION: '3.11'
  PIP_AUDIT_VERSION: '2.10.1'
  PIP_TOOLS_VERSION: '7.6.1'
  SYFT_VERSION: 'v1.51.0'
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  tracked-secret-scan:
    name: Tracked Source Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Enforce exact-head workflow provenance policy
        run: node scripts/security/check-workflow-candidate-provenance.mjs

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Test required CI gate path policy
        run: node scripts/security/required-ci-gate.mjs --self-test

      - name: Test required CI trigger drift guard
        run: node scripts/security/check-required-ci-trigger-drift.mjs --self-test

      - name: Enforce required CI trigger/path consistency
        run: node scripts/security/check-required-ci-trigger-drift.mjs

      - name: Test GitHub Actions supply-chain policy
        run: node scripts/security/check-workflow-supply-chain.mjs --self-test

      - name: Enforce GitHub Actions supply-chain policy
        run: node scripts/security/check-workflow-supply-chain.mjs

      - name: Test release dependency-audit install safety
        run: node scripts/security/check-release-audit-install-safety.mjs --self-test

      - name: Enforce release dependency-audit install safety
        run: node scripts/security/check-release-audit-install-safety.mjs

      - name: Test Python lock integrity workflow policy
        run: node scripts/security/check-python-lock-integrity-workflow.mjs --self-test

      - name: Enforce Python lock integrity workflow policy
        run: node scripts/security/check-python-lock-integrity-workflow.mjs

      - name: Test tracked-source secret scanner
        run: node scripts/security/test-scan-tracked-secrets.mjs

      - name: Scan tracked source without printing secret values
        run: node scripts/security/scan-tracked-secrets.mjs

      - name: Test tracked-artifact hygiene policy
        run: node scripts/security/test-tracked-artifacts.mjs

      - name: Reject tracked generated and secret-bearing artifacts
        run: node scripts/security/check-tracked-artifacts.mjs

  node-dependency-audit:
    name: VPS Production Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies from frozen lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Capture full production dependency audit
        shell: bash
        run: |
          mkdir -p security-artifacts
          set +e
          pnpm audit --prod --json > security-artifacts/pnpm-audit-full.json
          audit_status=$?
          set -e
          if [ ! -s security-artifacts/pnpm-audit-full.json ]; then
            echo "pnpm audit did not produce machine-readable evidence."
            exit 2
          fi
          echo "pnpm audit exit status: ${audit_status}; VPS scope is evaluated in the next step."

      - name: Enforce high/critical policy for VPS deployables
        run: >-
          node scripts/security/filter-vps-production-audit.mjs
          security-artifacts/pnpm-audit-full.json
          security-artifacts/vps-pnpm-audit.json

      - name: Upload deployable dependency audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vps-production-dependency-audit
          path: |
            security-artifacts/vps-pnpm-audit.json
            security-artifacts/pnpm-audit-full.json
          if-no-files-found: warn
          retention-days: 30

  python-lock-and-audit:
    name: Python Lock Integrity & Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pinned dependency security tooling
        run: |
          python -m pip install --disable-pip-version-check \
            "pip-audit==${PIP_AUDIT_VERSION}" \
            "pip-tools==${PIP_TOOLS_VERSION}"

      - name: Compile deterministic Python runtime lock
        shell: bash
        env:
          CUSTOM_COMPILE_COMMAND: "python -m piptools compile services/ai-engine/pyproject.toml --generate-hashes"
        run: |
          mkdir -p security-artifacts
          cp services/ai-engine/requirements.lock security-artifacts/ai-engine-requirements.lock
          python -m piptools compile \
            services/ai-engine/pyproject.toml \
            --generate-hashes \
            --strip-extras \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file security-artifacts/ai-engine-requirements.lock

      - name: Verify committed Python lock is current
        id: lock_check
        shell: bash
        run: |
          if [ ! -f services/ai-engine/requirements.lock ]; then
            echo "services/ai-engine/requirements.lock is missing."
            exit 1
          fi
          cmp services/ai-engine/requirements.lock security-artifacts/ai-engine-requirements.lock

      - name: Audit locked Python runtime dependencies
        if: always() && steps.lock_check.outcome == 'success'
        shell: bash
        run: |
          set +e
          python -m pip_audit \
            --requirement services/ai-engine/requirements.lock \
            --format json \
            --output security-artifacts/pip-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            echo "Python dependency audit found known vulnerabilities or could not complete."
            exit "$audit_status"
          fi

      - name: Upload Python lock and audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-lock-and-audit
          path: |
            security-artifacts/ai-engine-requirements.lock
            security-artifacts/pip-audit.json
          if-no-files-found: warn
          retention-days: 30

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Create artifact directory
        run: mkdir -p security-artifacts

      - name: Generate repository SBOM with pinned Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: security-artifacts/irexpro-sbom.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: irexpro-sbom
          path: security-artifacts/irexpro-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript,python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
