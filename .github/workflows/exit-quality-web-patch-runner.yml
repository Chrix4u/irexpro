name: Exit Quality Web Patch Runner

on:
  push:
    branches:
      - feat/profit-protection-exit-quality-report-20261031
    paths:
      - '.github/workflows/exit-quality-web-patch-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply isolated web integration patch
        run: node scripts/temporary-patch-exit-quality-web.mjs
      - name: Verify and persist patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'iRexPro Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web/src/app/trade/history/profit-protection/page.tsx apps/web/src/app/trade/history/profit-protection/page.spec.tsx apps/web/src/app/trade/history/page.tsx
          if git diff --cached --quiet; then
            echo 'No application patch required.'
          else
            git commit -m 'fix(web): integrate exit quality with authenticated reports'
            git push origin HEAD:feat/profit-protection-exit-quality-report-20261031
          fi
