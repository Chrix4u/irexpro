name: Round 6 Integration PG Repair

on:
  push:
    branches:
      - ci/github-round6-verification

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: irexpro_risk_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irexpro_risk_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ci/github-round6-verification
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact candidate dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch PG fixture drift and migration metadata
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'expected patch anchor missing: {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          def ensure_name(path, cls):
              p = Path(path)
              s = p.read_text()
              line = f"  name = '{cls}';"
              if line in s:
                  return
              anchor = f"export class {cls} implements MigrationInterface {{\n"
              if anchor not in s:
                  raise SystemExit(f'class anchor missing: {path}: {cls}')
              p.write_text(s.replace(anchor, anchor + line + "\n", 1))

          ensure_name('apps/api/src/database/migrations/1754400000000-AddTradeAuthorityLinkage.ts', 'AddTradeAuthorityLinkage1754400000000')
          ensure_name('apps/api/src/database/migrations/1754400000000-TradeIntentRound6LiveCompletion.ts', 'TradeIntentRound6LiveCompletion1754400000000')
          ensure_name('apps/api/src/database/migrations/1754500000000-PortfolioAllocationRound6LiveCompletion.ts', 'PortfolioAllocationRound6LiveCompletion1754500000000')

          edit(
              'apps/api/src/modules/execution/execution.pg-integration.spec.ts',
              '      opening_balance NUMERIC(15,2),\n      peak_equity NUMERIC(15,2),',
              '      opening_balance NUMERIC(15,2),\n      account_currency VARCHAR(3),\n      opening_snapshot_id UUID,\n      opening_snapshot_generation INTEGER,\n      peak_equity NUMERIC(15,2),',
          )
          edit(
              'apps/api/src/modules/execution/execution.pg-integration.spec.ts',
              "    const adapterRegistry = {\n      getAdapter: jest.fn().mockReturnValue(adapter),\n    } as unknown as BrokerAdapterRegistry;",
              "    const adapterRegistry = {\n      getAdapter: jest.fn().mockReturnValue(adapter),\n      getAdapterForConnection: jest.fn().mockReturnValue(adapter),\n    } as unknown as BrokerAdapterRegistry;",
          )

          edit(
              'apps/api/src/modules/execution/execution-session.pg-integration.spec.ts',
              '      opening_balance numeric(15,2),\n      peak_equity numeric(15,2),',
              '      opening_balance numeric(15,2),\n      account_currency varchar(3),\n      opening_snapshot_id uuid,\n      opening_snapshot_generation integer,\n      peak_equity numeric(15,2),',
          )
          edit(
              'apps/api/src/modules/execution/execution-session.pg-integration.spec.ts',
              '      broker_connection_id uuid NOT NULL,\n      authority_generation integer NOT NULL,',
              '      broker_connection_id uuid NOT NULL,\n      credential_generation integer,\n      provider_broker_identity varchar(100),\n      provider_verification_fingerprint varchar(128),\n      risk_profile_id uuid,\n      risk_profile_version integer,\n      risk_profile_hash varchar(64),\n      account_snapshot_id uuid,\n      account_snapshot_generation integer,\n      account_snapshot_observed_at timestamptz,\n      authority_generation integer NOT NULL,\n      kill_switch_generation integer,\n      execution_control_revision integer,\n      authority_binding_digest varchar(64),\n      trading_policy_revision integer,\n      provider_verification_revision integer,',
          )
          edit(
              'apps/api/src/modules/execution/execution-session.pg-integration.spec.ts',
              '      order_payload jsonb NOT NULL,\n      issued_at timestamptz NOT NULL DEFAULT NOW(),',
              '      order_payload jsonb NOT NULL,\n      quote_ref jsonb,\n      issued_at timestamptz NOT NULL DEFAULT NOW(),',
          )
          edit(
              'apps/api/src/modules/execution/execution-session.pg-integration.spec.ts',
              '      expires_at timestamptz NOT NULL,\n      invalidated_at timestamptz,',
              '      expires_at timestamptz NOT NULL,\n      consumed_at timestamptz,\n      invalidated_at timestamptz,',
          )
          edit(
              'apps/api/src/modules/execution/execution-session.pg-integration.spec.ts',
              '      broker_connection_id uuid NOT NULL,\n      order_payload_digest varchar(64) NOT NULL,',
              '      broker_connection_id uuid NOT NULL,\n      risk_grant_id uuid,\n      order_payload_digest varchar(64) NOT NULL,',
          )
          edit(
              'apps/api/src/modules/execution/execution-session.pg-integration.spec.ts',
              '      quantity numeric(18,8) NOT NULL,\n      expires_at timestamptz NOT NULL,',
              '      quantity numeric(18,8) NOT NULL,\n      stop_loss numeric(18,8),\n      take_profit numeric(18,8),\n      expires_at timestamptz NOT NULL,\n      consumed_at timestamptz,',
          )

          edit(
              'apps/api/src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts',
              '        "account_id" varchar(100) NULL,\n        "account_type" varchar(10) NOT NULL DEFAULT \'DEMO\',',
              '        "account_id" varchar(100) NULL,\n        "provider_broker_identity" varchar(100) NULL,\n        "logical_account_key" varchar(255) NULL,\n        "account_type" varchar(10) NOT NULL DEFAULT \'DEMO\',',
          )
          edit(
              'apps/api/src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts',
              '        "credential_status" varchar(20) NOT NULL DEFAULT \'CREATED\',\n        "authorized_at" timestamptz NULL,',
              '        "credential_status" varchar(20) NOT NULL DEFAULT \'CREATED\',\n        "credential_generation" integer NOT NULL DEFAULT 0,\n        "credential_refresh_lease_expires_at" timestamptz NULL,\n        "credential_refresh_lease_owner" varchar(64) NULL,\n        "authorized_at" timestamptz NULL,',
          )
          edit(
              'apps/api/src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts',
              "    const adapterRegistry = {\n      getAdapter: jest.fn().mockReturnValue(adapter),\n      isSupported: jest.fn().mockReturnValue(true),\n    } as unknown as BrokerAdapterRegistry;",
              "    const adapterRegistry = {\n      getAdapter: jest.fn().mockReturnValue(adapter),\n      getAdapterForConnection: jest.fn().mockReturnValue(adapter),\n      releaseAdapterForConnection: jest.fn(),\n      isSupported: jest.fn().mockReturnValue(true),\n    } as unknown as BrokerAdapterRegistry;",
          )
          auth = Path('apps/api/src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts')
          s = auth.read_text()
          authority_block = """    const tradingAuthority = {\n      bumpGeneration: jest.fn().mockResolvedValue(2),\n    };\n    const grantInvalidation = {\n      invalidateUserNewExposureAuthority: jest.fn().mockResolvedValue({\n        invalidatedGrants: 0,\n        revokedConfirmations: 0,\n      }),\n    };\n"""
          if 'const tradingAuthority = {' not in s:
              anchor = '    service = new BrokerService(\n'
              if anchor not in s:
                  raise SystemExit('BrokerService constructor anchor missing')
              s = s.replace(anchor, authority_block + anchor, 1)
          old_args = """      tokenLifecycle,\n      // Sprint 56 correction round 5 (#332): link outbox — unused by the\n      // authorization-transition paths under test.\n      // Round 6 (#300): the unified authority seams — unused by the\n      // authorization-transition paths under test (CI-gated suite).\n      {} as never,\n      {} as never,\n      // Round 6 live-execution completion (§1a): snapshot authority seam —\n      // unused by the authorization-transition paths under test.\n      {} as never,\n      {} as never,\n"""
          new_args = """      tokenLifecycle,\n      // Sprint 56 correction round 5 (#332): link outbox — unused by the\n      // authorization-transition paths under test.\n      {} as never,\n      tradingAuthority as never,\n      grantInvalidation as never,\n      // Round 6 live-execution completion (§1a): snapshot authority seam —\n      // unused by the authorization-transition paths under test.\n      {} as never,\n"""
          if new_args not in s:
              if old_args not in s:
                  raise SystemExit('BrokerService seam argument anchor missing')
              s = s.replace(old_args, new_args, 1)
          auth.write_text(s)
          PY

      - name: Format repaired files
        working-directory: apps/api
        run: >-
          pnpm exec prettier --write
          src/database/migrations/1754400000000-AddTradeAuthorityLinkage.ts
          src/database/migrations/1754400000000-TradeIntentRound6LiveCompletion.ts
          src/database/migrations/1754500000000-PortfolioAllocationRound6LiveCompletion.ts
          src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts
          src/modules/execution/execution.pg-integration.spec.ts
          src/modules/execution/execution-session.pg-integration.spec.ts

      - name: Create isolated migration validation database
        env:
          PGPASSWORD: ci_disposable_password
        run: createdb -h localhost -U postgres irexpro_migration_repair

      - name: Validate fresh migration chain
        working-directory: apps/api
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: ci_disposable_password
          PG_DB: irexpro_migration_repair
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_disposable_password
          DB_NAME: irexpro_migration_repair
        run: pnpm exec ts-node scripts/validate-migration-scenario-d.ts

      - name: Validate affected real PostgreSQL suites
        working-directory: apps/api
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_disposable_password
          DB_NAME: irexpro_risk_concurrency
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          COOKIE_SECRET: test_cookie_secret_min_16
        run: >-
          pnpm exec jest --config ./test/jest-pg.json --runInBand
          src/modules/execution/execution.pg-integration.spec.ts
          src/modules/execution/execution-session.pg-integration.spec.ts
          src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts

      - name: Validate API lint and build
        run: |
          pnpm --filter @irexpro/api lint
          pnpm --filter @irexpro/api build
          git diff --check

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/round6-integration-pg-repair.yml
          git add apps/api/src/database/migrations/1754400000000-AddTradeAuthorityLinkage.ts \
                  apps/api/src/database/migrations/1754400000000-TradeIntentRound6LiveCompletion.ts \
                  apps/api/src/database/migrations/1754500000000-PortfolioAllocationRound6LiveCompletion.ts \
                  apps/api/src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts \
                  apps/api/src/modules/execution/execution.pg-integration.spec.ts \
                  apps/api/src/modules/execution/execution-session.pg-integration.spec.ts
          git diff --cached --check
          git commit -m 'test: reconcile Round 6 PostgreSQL fixtures after integration'
          git push origin HEAD:ci/github-round6-verification
