name: Temporary realtime ingress runbook sync

on:
  push:
    branches:
      - security/realtime-ingress-runbook-sync
    paths:
      - '.github/workflows/tmp-realtime-runbook-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: security/realtime-ingress-runbook-sync
          persist-credentials: true
          fetch-depth: 1

      - name: Synchronize production runbook and drift guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          runbook_path = Path('docs/runbooks/production-deployment-vps-webuzo.md')
          checker_path = Path('scripts/security/check-nginx-security-headers.mjs')

          runbook = runbook_path.read_text()

          key_rule = (
              '- Use `location ^~ /api/v1/` (with `^~`) for the NestJS API so it takes\n'
              '  precedence over the frontend `location /` catch-all.\n'
          )
          if runbook.count(key_rule) != 1:
              raise SystemExit('expected one API key-rule anchor in production runbook')
          runbook = runbook.replace(
              key_rule,
              key_rule
              + '- Route the default Socket.IO / Engine.IO transport path with an explicit\n'
                '  `location ^~ /socket.io/` block to the NestJS API. `/realtime` is the\n'
                '  application namespace; it is not the HTTP/WebSocket transport path.\n'
              + '- For every public NestJS location, overwrite `X-Forwarded-For` with\n'
                '  server-observed `$remote_addr`; never preserve caller-supplied forwarding\n'
                '  chains with `$proxy_add_x_forwarded_for` at the application identity boundary.\n',
              1,
          )

          upstream_anchor = '# Upstreams — match the ports in apps/api/.env (APP_PORT) and\n'
          if runbook.count(upstream_anchor) != 1:
              raise SystemExit('expected one Nginx upstream anchor in production runbook')
          zones = (
              '# Socket.IO single-VPS safety zones. These are deliberately server-wide until\n'
              '# trusted real-IP processing is configured; do not key active limits directly\n'
              '# to unverified forwarding headers.\n'
              'limit_req_zone $server_name zone=irexpro_realtime_requests:1m rate=200r/s;\n'
              'limit_conn_zone $server_name zone=irexpro_realtime_connections:1m;\n\n'
          )
          runbook = runbook.replace(upstream_anchor, zones + upstream_anchor, 1)

          api_comment = '    # ── NestJS API (public) — takes precedence over the frontend catch-all ──\n'
          if runbook.count(api_comment) != 1:
              raise SystemExit('expected one API location comment in production runbook')
          realtime_block = (
              '    # ── Socket.IO / Engine.IO transport — NestJS realtime gateway ──\n'
              '    # `/realtime` is the Socket.IO namespace; `/socket.io/` is the default\n'
              '    # Engine.IO transport path and must not fall through to Next.js.\n'
              '    location ^~ /socket.io/ {\n'
              '        client_max_body_size 64k;\n\n'
              '        limit_req zone=irexpro_realtime_requests burst=400 nodelay;\n'
              '        limit_conn irexpro_realtime_connections 1000;\n'
              '        limit_req_status 429;\n'
              '        limit_conn_status 429;\n\n'
              '        proxy_pass http://irexpro_api;\n'
              '        proxy_http_version 1.1;\n'
              '        proxy_set_header Host $host;\n'
              '        proxy_set_header X-Real-IP $remote_addr;\n'
              '        proxy_set_header X-Forwarded-For $remote_addr;\n'
              '        proxy_set_header X-Forwarded-Proto $scheme;\n'
              '        proxy_set_header Upgrade $http_upgrade;\n'
              '        proxy_set_header Connection "upgrade";\n'
              '        proxy_read_timeout 75s;\n'
              '        proxy_send_timeout 75s;\n'
              '        proxy_buffering off;\n'
              '    }\n\n'
          )
          runbook = runbook.replace(api_comment, realtime_block + api_comment, 1)

          section_start = runbook.index('## 8. Nginx reverse proxy + TLS')
          section_end = runbook.index('\n---\n\n## 9.', section_start)
          section = runbook[section_start:section_end]
          api_start = section.index('    location ^~ /api/v1/ {')
          api_end = section.index('\n    }', api_start) + len('\n    }')
          api_block = section[api_start:api_end]
          stale_xff = 'proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
          strict_xff = 'proxy_set_header X-Forwarded-For $remote_addr;'
          if api_block.count(stale_xff) != 1:
              raise SystemExit('expected one stale API X-Forwarded-For directive in section 8')
          api_block = api_block.replace(stale_xff, strict_xff, 1)
          section = section[:api_start] + api_block + section[api_end:]
          runbook = runbook[:section_start] + section + runbook[section_end:]

          route_row = (
              '| `location ^~ /api/v1/` | `http://127.0.0.1:3010` (NestJS API) | Public API — takes precedence |\n'
          )
          if runbook.count(route_row) != 1:
              raise SystemExit('expected one main-domain API route-table row')
          runbook = runbook.replace(
              route_row,
              route_row
              + '| `location ^~ /socket.io/` | `http://127.0.0.1:3010` (NestJS realtime transport) | Engine.IO handshake, polling, and WebSocket upgrade; `/realtime` remains the Socket.IO namespace |\n',
              1,
          )

          runbook_path.write_text(runbook)

          checker = checker_path.read_text()
          source_anchor = "const canonicalSource = readFileSync(nginxPath, 'utf8');\n"
          if checker.count(source_anchor) != 1:
              raise SystemExit('expected canonicalSource anchor in Nginx checker')
          checker = checker.replace(
              source_anchor,
              source_anchor
              + "const productionRunbookPath = fileURLToPath(\n"
                "  new URL('../../docs/runbooks/production-deployment-vps-webuzo.md', import.meta.url),\n"
                ");\n"
                "const productionRunbookSource = readFileSync(productionRunbookPath, 'utf8');\n",
              1,
          )

          validate_anchor = 'export function validateNginxPolicy(source) {\n'
          if checker.count(validate_anchor) != 1:
              raise SystemExit('expected validateNginxPolicy anchor')
          runbook_validator = r'''export function validateProductionRunbookRealtimePolicy(source) {
  const errors = [];
  const sectionStart = source.indexOf('## 8. Nginx reverse proxy + TLS');
  const sectionEnd = source.indexOf('\n---\n\n## 9.', sectionStart);
  if (sectionStart === -1 || sectionEnd === -1) {
    return ['production deployment runbook must retain the section 8 Nginx boundary'];
  }

  const section = source.slice(sectionStart, sectionEnd);
  for (const directive of [REALTIME_REQUEST_ZONE, REALTIME_CONNECTION_ZONE]) {
    if (!section.includes(directive)) {
      errors.push(`production runbook is missing realtime safety-zone directive: ${directive}`);
    }
  }

  const apiLocations = extractBlocks(section, 'location ^~ /api/v1/ {', errors);
  if (apiLocations.length !== 1) {
    errors.push(`production runbook must show exactly 1 public API location, found ${apiLocations.length}`);
  } else {
    const apiLocation = apiLocations[0];
    if (!apiLocation.includes('proxy_set_header X-Forwarded-For $remote_addr;')) {
      errors.push('production runbook API location must use server-observed $remote_addr');
    }
    if (apiLocation.includes('$proxy_add_x_forwarded_for')) {
      errors.push('production runbook API location must not preserve caller forwarding chains');
    }
  }

  const realtimeLocations = extractBlocks(section, 'location ^~ /socket.io/ {', errors);
  if (realtimeLocations.length !== 1) {
    errors.push(
      `production runbook must show exactly 1 Socket.IO transport location, found ${realtimeLocations.length}`,
    );
  } else {
    const realtimeLocation = realtimeLocations[0];
    for (const directive of REQUIRED_REALTIME_DIRECTIVES) {
      if (!realtimeLocation.includes(directive)) {
        errors.push(`production runbook Socket.IO location is missing: ${directive}`);
      }
    }
    if (realtimeLocation.includes('$proxy_add_x_forwarded_for')) {
      errors.push('production runbook Socket.IO location must not preserve caller forwarding chains');
    }
    if (/\bCF-Connecting-IP\b/i.test(realtimeLocation)) {
      errors.push('production runbook Socket.IO location must not trust CF-Connecting-IP directly');
    }
  }

  if (!/\|\s*`location \^~ \/socket\.io\/`\s*\|/.test(section)) {
    errors.push('production runbook route table must document the /socket.io/ NestJS transport');
  }

  return errors;
}

'''
          checker = checker.replace(validate_anchor, runbook_validator + validate_anchor, 1)

          helper_anchor = 'function runSelfTest() {\n'
          if checker.count(helper_anchor) != 1:
              raise SystemExit('expected runSelfTest anchor')
          helper = r'''function expectRunbookRejected(label, source) {
  const errors = validateProductionRunbookRealtimePolicy(source);
  if (errors.length === 0) {
    throw new Error(`self-test failed: production-runbook ${label} mutation was incorrectly accepted`);
  }
}

'''
          checker = checker.replace(helper_anchor, helper + helper_anchor, 1)

          baseline_anchor = (
              "  const baselineErrors = validateNginxPolicy(canonicalSource);\n"
              "  if (baselineErrors.length > 0) {\n"
              "    throw new Error(`canonical fixture failed before adversarial tests: ${baselineErrors.join('; ')}`);\n"
              "  }\n"
          )
          if checker.count(baseline_anchor) != 1:
              raise SystemExit('expected checker baseline self-test anchor')
          checker = checker.replace(
              baseline_anchor,
              baseline_anchor
              + "\n  const runbookBaselineErrors = validateProductionRunbookRealtimePolicy(productionRunbookSource);\n"
                "  if (runbookBaselineErrors.length > 0) {\n"
                "    throw new Error(\n"
                "      `production runbook failed before adversarial tests: ${runbookBaselineErrors.join('; ')}`,\n"
                "    );\n"
                "  }\n",
              1,
          )

          selftest_end_anchor = (
              "  expectRejected(\n"
              "    'direct Cloudflare identity trust',\n"
              "    canonicalSource.replace(\n"
              "      'proxy_set_header X-Real-IP $remote_addr;',\n"
              "      'real_ip_header CF-Connecting-IP;\\n        proxy_set_header X-Real-IP $remote_addr;',\n"
              "    ),\n"
              "  );\n\n"
              "  console.log('Nginx security-policy adversarial self-tests passed.');\n"
          )
          if checker.count(selftest_end_anchor) != 1:
              raise SystemExit('expected checker self-test ending anchor')
          checker = checker.replace(
              selftest_end_anchor,
              selftest_end_anchor.replace(
                  "\n  console.log('Nginx security-policy adversarial self-tests passed.');\n",
                  "\n  expectRunbookRejected(\n"
                  "    'missing Socket.IO route',\n"
                  "    productionRunbookSource.replace('location ^~ /socket.io/ {', 'location ^~ /socket-disabled/ {'),\n"
                  "  );\n"
                  "  expectRunbookRejected(\n"
                  "    'forwarded-chain preservation',\n"
                  "    productionRunbookSource.replaceAll(\n"
                  "      'proxy_set_header X-Forwarded-For $remote_addr;',\n"
                  "      'proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;',\n"
                  "    ),\n"
                  "  );\n"
                  "  expectRunbookRejected(\n"
                  "    'missing realtime request cap',\n"
                  "    productionRunbookSource.replace(\n"
                  "      'limit_req zone=irexpro_realtime_requests burst=400 nodelay;',\n"
                  "      '# removed by adversarial self-test',\n"
                  "    ),\n"
                  "  );\n\n"
                  "  console.log('Nginx security-policy adversarial self-tests passed.');\n",
              ),
              1,
          )

          main_anchor = '  const errors = validateNginxPolicy(canonicalSource);\n'
          if checker.count(main_anchor) != 1:
              raise SystemExit('expected checker main validation anchor')
          checker = checker.replace(
              main_anchor,
              "  const errors = [\n"
              "    ...validateNginxPolicy(canonicalSource),\n"
              "    ...validateProductionRunbookRealtimePolicy(productionRunbookSource),\n"
              "  ];\n",
              1,
          )

          checker_path.write_text(checker)
          PY

          node scripts/security/check-nginx-security-headers.mjs --self-test
          node scripts/security/check-nginx-security-headers.mjs
          git diff --check

      - name: Commit synchronized policy and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/tmp-realtime-runbook-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runbooks/production-deployment-vps-webuzo.md scripts/security/check-nginx-security-headers.mjs
          git commit -m 'Align production realtime ingress runbook with enforced policy'
          git push origin HEAD:security/realtime-ingress-runbook-sync
