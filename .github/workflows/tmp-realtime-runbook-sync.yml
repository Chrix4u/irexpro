name: Temporary realtime ingress runbook sync

on:
  push:
    branches:
      - security/realtime-ingress-runbook-sync
    paths:
      - '.github/workflows/tmp-realtime-runbook-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: security/realtime-ingress-runbook-sync
          persist-credentials: true
          fetch-depth: 1

      - name: Synchronize production runbook and drift guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/tmp-realtime-runbook-sync.py
          node scripts/security/check-nginx-security-headers.mjs --self-test
          node scripts/security/check-nginx-security-headers.mjs
          git diff --check

      - name: Commit synchronized policy and remove temporary helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/tmp-realtime-runbook-sync.yml scripts/tmp-realtime-runbook-sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runbooks/production-deployment-vps-webuzo.md scripts/security/check-nginx-security-headers.mjs
          git commit -m 'Align production realtime ingress runbook with enforced policy'
          git push origin HEAD:security/realtime-ingress-runbook-sync
