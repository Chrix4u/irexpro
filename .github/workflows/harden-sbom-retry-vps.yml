name: Harden SBOM Retry VPS

on:
  push:
    branches:
      - ops/harden-sbom-retry-20261012

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  patch-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Add bounded SBOM retries and push PR branch
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          wt='/home/lightworld/worktrees/irexpro-nonblocking-prime-20261012'
          branch='fix/nonblocking-paper-market-prime-20261012'
          expected='09601dfdde8c96c93b6fcaa9ae9ac77f8cdd152b'
          cd "$wt"
          test "$(git branch --show-current)" = "$branch"
          test "$(git rev-parse HEAD)" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/release-security.yml')
          s=p.read_text()
          old="""      - name: Generate repository SBOM with pinned Syft\n        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0\n        with:\n          path: .\n          format: cyclonedx-json\n          output-file: security-artifacts/irexpro-sbom.cdx.json\n          syft-version: ${{ env.SYFT_VERSION }}\n          upload-artifact: false\n          upload-release-assets: false\n          dependency-snapshot: false\n\n      - name: Upload SBOM evidence\n"""
          action="""        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0\n        with:\n          path: .\n          format: cyclonedx-json\n          output-file: security-artifacts/irexpro-sbom.cdx.json\n          syft-version: ${{ env.SYFT_VERSION }}\n          upload-artifact: false\n          upload-release-assets: false\n          dependency-snapshot: false\n"""
          new=("""      - name: Generate repository SBOM with pinned Syft\n        id: sbom_primary\n        continue-on-error: true\n""" + action + """\n      - name: Back off before first SBOM retry\n        if: ${{ steps.sbom_primary.outcome == 'failure' }}\n        shell: bash\n        run: sleep 10\n\n      - name: Retry repository SBOM generation (1/2)\n        id: sbom_retry_1\n        if: ${{ steps.sbom_primary.outcome == 'failure' }}\n        continue-on-error: true\n""" + action + """\n      - name: Back off before final SBOM retry\n        if: ${{ steps.sbom_primary.outcome == 'failure' && steps.sbom_retry_1.outcome == 'failure' }}\n        shell: bash\n        run: sleep 20\n\n      - name: Retry repository SBOM generation (2/2)\n        id: sbom_retry_2\n        if: ${{ steps.sbom_primary.outcome == 'failure' && steps.sbom_retry_1.outcome == 'failure' }}\n        continue-on-error: true\n""" + action + """\n      - name: Verify SBOM generation succeeded\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          test -s security-artifacts/irexpro-sbom.cdx.json\n\n      - name: Upload SBOM evidence\n""")
          if old not in s:
              raise SystemExit('SBOM block not found')
          p.write_text(s.replace(old,new,1))
          PY

          node scripts/security/check-workflow-supply-chain.mjs --self-test
          node scripts/security/check-workflow-supply-chain.mjs
          node scripts/security/check-required-ci-trigger-drift.mjs --self-test
          node scripts/security/check-required-ci-trigger-drift.mjs
          node scripts/security/check-workflow-candidate-provenance.mjs
          git diff --check
          git status --short
          git add .github/workflows/release-security.yml
          git diff --cached --check
          test "$(git diff --cached --name-only)" = '.github/workflows/release-security.yml'
          git config user.name 'iRexPro Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Retry transient pinned Syft SBOM downloads'
          git push origin "HEAD:refs/heads/$branch"
          echo "SYNCED_SHA=$(git rev-parse HEAD)"
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
