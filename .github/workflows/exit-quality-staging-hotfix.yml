name: Exit Quality Staging Hotfix

on:
  push:
    branches:
      - deploy/daily-loss-reset-20261028
    paths:
      - '.github/workflows/exit-quality-staging-hotfix.yml'

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: staging
      url: https://irexpro.lightworldtech.com/trade/history/profit-protection
    env:
      CANDIDATE_SHA: a1cf823cf54427bd2b54e77d62ea1fe685cb5e0c
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - name: Checkout deployment control commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet --no-tags origin deploy/daily-loss-reset-20261028
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/deploy/daily-loss-reset-20261028

      - name: Validate staging SSH configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]+$ ]]

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Build and deploy exact API plus web candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- $CANDIDATE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          candidate_sha="$1"
          root='/home/lightworld/webapps/irexpro-staging'
          pnpm_version='10.34.5'
          cd "$root"
          test "$(git rev-parse --show-toplevel)" = "$root"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin deploy/daily-loss-reset-20261028
          git cat-file -e "${candidate_sha}^{commit}"
          git merge-base --is-ancestor "$candidate_sha" origin/deploy/daily-loss-reset-20261028
          git switch --quiet --detach "$candidate_sha"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test -z "$(git status --porcelain)"

          node_major="$(node -p "process.versions.node.split('.')[0]")"
          test "$node_major" = '22'
          test "$(node -p "require('./package.json').packageManager || ''")" = "pnpm@${pnpm_version}"
          corepack pnpm@"$pnpm_version" install --frozen-lockfile
          corepack pnpm@"$pnpm_version" --filter @irexpro/api build
          corepack pnpm@"$pnpm_version" --filter @irexpro/web build

          pm2 restart irexpro-api-staging --update-env
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3010/api/v1/health/live | grep -q '"status":"alive"'; then break; fi
            test "$attempt" -lt 60
            sleep 2
          done
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3010/api/v1/health/ready | grep -q '"status":"ready"'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3010/api/v1/health | grep -q '"status":"ok"'

          pm2 restart irexpro-web-staging --update-env
          for attempt in $(seq 1 60); do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1:3005/login || true)"
            if test "$code" = '200'; then break; fi
            test "$attempt" -lt 60
            sleep 2
          done

          pm2_json="$(mktemp)"
          trap 'rm -f "$pm2_json"' EXIT
          pm2 jlist > "$pm2_json"
          PM2_JSON_FILE="$pm2_json" node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.env.PM2_JSON_FILE, 'utf8'));
          for (const name of ['irexpro-api-staging', 'irexpro-web-staging']) {
            const proc = rows.find((row) => row.name === name);
            if (!proc || proc.pm2_env?.status !== 'online') throw new Error(`${name} is not online`);
            const unstable = Number(proc.pm2_env?.unstable_restarts ?? 0);
            if (!Number.isFinite(unstable) || unstable !== 0) throw new Error(`${name} has unstable restarts=${unstable}`);
          }
NODE
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          REMOTE

      - name: Verify public staging health and report route
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 15 https://irexpro.lightworldtech.com/api/v1/health/live | grep -q '"status":"alive"'
          curl --fail --silent --show-error --max-time 15 https://irexpro.lightworldtech.com/api/v1/health/ready | grep -q '"status":"ready"'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://irexpro.lightworldtech.com/login)" = '200'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://irexpro.lightworldtech.com/trade/history/profit-protection)" = '200'

      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
