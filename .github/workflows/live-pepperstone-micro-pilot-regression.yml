name: iRexPro LIVE micro sizing safety
on:
  push:
    branches: ['fix/live-pepperstone-micro-lot-risk-20261123', 'release/pepperstone-live-micro-only-20261123']
  pull_request:
    paths:
      - 'apps/api/src/modules/execution/services/position-sizing.service.ts'
      - 'apps/api/src/modules/execution/services/pepperstone-live-micro-risk.ts'
      - 'apps/api/src/modules/execution/services/pepperstone-live-micro-risk.spec.ts'
      - 'apps/api/src/modules/execution/services/allocation.service.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-api-and-live-micro-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install API dependencies only
        run: pnpm install --frozen-lockfile --filter '@irexpro/api...'
      - name: Compile-check full API (no deployment or broker calls)
        run: pnpm --filter @irexpro/api exec tsc --noEmit --incremental false -p tsconfig.build.json
      - name: Validate LIVE micro and existing DEMO/PAPER sizing regressions
        run: pnpm --filter @irexpro/api exec jest src/modules/execution/services/pepperstone-live-micro-risk.spec.ts src/modules/execution/services/position-sizing.service.spec.ts src/modules/execution/services/position-sizing.paper-allocation.spec.ts src/modules/execution/services/position-sizing.dynamic-small-account.spec.ts src/modules/execution/services/allocation.service.spec.ts src/modules/strategy/strategy-orchestrator.service.spec.ts --runInBand --silent --no-coverage
