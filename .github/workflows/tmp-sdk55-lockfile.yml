name: Temporary SDK55 Lockfile Regeneration

on:
  push:
    branches:
      - feat/mobile-broker-live-account-sdk55
    paths:
      - 'apps/mobile/package.json'
      - 'packages/api-client/package.json'
      - 'packages/types/package.json'
      - '.github/workflows/tmp-sdk55-lockfile.yml'

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate pnpm lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Regenerate lockfile from manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm install --lockfile-only --ignore-scripts
          git diff --check

      - name: Commit lockfile only
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          test "$(git diff --cached --name-only)" = 'pnpm-lock.yaml'
          git commit -m 'Regenerate lockfile for SDK55 broker mobile rebuild'
          git push origin HEAD:feat/mobile-broker-live-account-sdk55
