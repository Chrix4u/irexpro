name: iRexPro DEMO provider position CAS hotfix
on:
  push:
    branches: ['fix/demo-stop-provider-position-cas-20261123']
  pull_request:
    paths:
      - 'apps/api/src/modules/execution/reconciliation/demo-profit-stop-authority-sync.service.ts'
      - 'apps/api/src/modules/execution/reconciliation/demo-profit-stop-authority-sync.service.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  position-cas-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install API graph
        run: pnpm install --frozen-lockfile --filter '@irexpro/api...'
      - name: Full API TypeScript
        run: pnpm --filter @irexpro/api exec tsc --noEmit --incremental false -p tsconfig.build.json
      - name: Demo stop sync and five-second protection tests
        run: pnpm --filter @irexpro/api exec jest src/modules/execution/reconciliation/demo-profit-stop-authority-sync.service.spec.ts src/modules/execution/reconciliation/demo-five-second-protected-runner.integration.spec.ts src/modules/execution/reconciliation/live-demo-profit-protection.service.spec.ts src/modules/execution/reconciliation/demo-protected-profit-runner-orchestrator.service.spec.ts src/modules/broker/broker-demo-profit-stop-gateway.spec.ts --runInBand --silent --no-coverage
