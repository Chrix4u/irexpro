name: AI Engine CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/ai-engine/**'
      - '.github/workflows/ai-engine-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/ai-engine/**'
      - '.github/workflows/ai-engine-ci.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Python AI Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: services/ai-engine/pyproject.toml

      - name: Install AI engine with verification tools
        working-directory: services/ai-engine
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile exact candidate
        working-directory: services/ai-engine
        run: python -m compileall -q app

      - name: Lint
        working-directory: services/ai-engine
        run: python -m ruff check app tests

      - name: Test
        working-directory: services/ai-engine
        run: python -m pytest -q
