name: Plan B live momentum wiring fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/plan-b-live-momentum-wiring-20261009
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove RED then apply the minimal fix when still missing
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > apps/api/src/modules/ai/vps-forex-signal-collector.momentum-wiring.spec.ts <<'EOF'
          import { readFileSync } from 'node:fs';

          describe('Plan B live momentum wiring', () => {
            it('forwards candidate short-horizon momentum into the Plan B scorer input', () => {
              const source = readFileSync(
                require.resolve('./vps-forex-signal-collector.service'),
                'utf8',
              );
              const scorerCall = source.match(
                /scorePlanBMultimodelShadow\(\s*\{([\s\S]*?)\},\s*portfolioPositions,\s*\)/,
              );

              expect(scorerCall).not.toBeNull();
              expect(scorerCall?.[1]).toContain(
                'shortHorizonMomentumAtr: best.shortHorizonMomentumAtr',
              );
            });
          });
          EOF

          if python - <<'PY'
          from pathlib import Path
          import re
          source = Path('apps/api/src/modules/ai/vps-forex-signal-collector.service.ts').read_text()
          match = re.search(r'scorePlanBMultimodelShadow\(\s*\{([\s\S]*?)\},\s*portfolioPositions,\s*\)', source)
          raise SystemExit(0 if match and 'shortHorizonMomentumAtr: best.shortHorizonMomentumAtr' in match.group(1) else 1)
          PY
          then
            echo 'Scorer momentum wiring is already present; skipping mutation and keeping verification only.'
          else
            set +e
            pnpm --filter @irexpro/api exec jest vps-forex-signal-collector.momentum-wiring.spec.ts --runInBand > /tmp/momentum-red.log 2>&1
            status=$?
            set -e
            cat /tmp/momentum-red.log
            if [ "$status" -eq 0 ]; then
              echo 'Regression test unexpectedly passed before implementation.' >&2
              exit 1
            fi
            grep -q 'shortHorizonMomentumAtr: best.shortHorizonMomentumAtr' /tmp/momentum-red.log
            echo 'RED confirmed: live Plan B scorer input omits short-horizon momentum.'

            python - <<'PY'
          from pathlib import Path

          collector = Path('apps/api/src/modules/ai/vps-forex-signal-collector.service.ts')
          text = collector.read_text()
          old = '''              rsi14: best.rsi14,\n              scanTime: new Date(best.barTime.getTime() + BAR_MS),'''
          new = '''              rsi14: best.rsi14,\n              shortHorizonMomentumAtr: best.shortHorizonMomentumAtr,\n              scanTime: new Date(best.barTime.getTime() + BAR_MS),'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one scorer wiring anchor, found {text.count(old)}')
          collector.write_text(text.replace(old, new, 1))

          root = Path('apps/api/src/modules/ai')
          old_policy = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v2-directional-momentum-v1'
          new_policy = 'plan-b-multimodel-shadow-v4-bidirectional-v2-early-transition-v2-neutral-meta-v2-hard-portfolio-v3-directional-momentum-wiring-v1'
          replacements = 0
          for path in root.rglob('*.ts'):
              body = path.read_text()
              count = body.count(old_policy)
              if count:
                  path.write_text(body.replace(old_policy, new_policy))
                  replacements += count
          if replacements < 4:
              raise SystemExit(f'Policy cohort replacement count unexpectedly low: {replacements}')
          print(f'Updated {replacements} active-policy references to the clean momentum-wiring cohort.')
          PY
          fi

          pnpm --filter @irexpro/api exec prettier --write \
            src/modules/ai/vps-forex-signal-collector.service.ts \
            src/modules/ai/vps-forex-signal-collector.momentum-wiring.spec.ts \
            src/modules/ai/plan-b-multimodel-shadow.ts \
            src/modules/ai/vps-forex-signal-collector.service.spec.ts \
            src/modules/ai/ensemble-post-entry-protection-shadow.service.spec.ts

      - name: Verify GREEN focused suite
        run: |
          pnpm --filter @irexpro/api exec jest \
            vps-forex-signal-collector.momentum-wiring.spec.ts \
            vps-forex-signal-collector.service.spec.ts \
            plan-b-multimodel-shadow.spec.ts \
            ensemble-governance.spec.ts \
            ensemble-post-entry-protection-shadow.service.spec.ts \
            --runInBand

      - name: Verify API lint, full tests and production build
        run: |
          pnpm --filter @irexpro/api run lint:check
          pnpm --filter @irexpro/api exec jest --runInBand
          pnpm api:build
          git diff --check

      - name: Commit verified code changes when needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- apps/api/src/modules/ai; then
            echo 'No uncommitted API changes remain.'
            exit 0
          fi
          git config user.name 'iRexPro Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/api/src/modules/ai
          git status --short
          git commit -m 'Fix live Plan B momentum scorer wiring'
          git push origin HEAD:fix/plan-b-live-momentum-wiring-20261009
