name: VPS Ops Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: irexpro-staging-vps-ops
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.number == 366 &&
      github.actor == 'Chrix4u' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/vps ')
    runs-on: [self-hosted, linux, x64, lightworld-vps, staging, irexpro-staging]
    timeout-minutes: 5
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}

    steps:
      - name: Run allow-listed read-only operation
        shell: bash
        run: |
          set -Eeuo pipefail
          output_file="$RUNNER_TEMP/vps-ops-output.txt"
          : > "$output_file"

          case "$COMMENT_BODY" in
            "/vps status")
              {
                printf 'staging_path=/home/lightworld/webapps/irexpro-staging\n'
                stat -c 'type=%F owner=%U group=%G mode=%a' /home/lightworld/webapps/irexpro-staging
                printf 'resolved_path='; readlink -f /home/lightworld/webapps/irexpro-staging
                printf 'api_health='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:3010/api/v1/health
                printf 'web_login='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:3005/login
                printf 'ai_health='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:8011/api/v1/health
              } > "$output_file" 2>&1
              ;;
            "/vps health")
              {
                printf 'api_live='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:3010/api/v1/health/live
                printf 'api_ready='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:3010/api/v1/health/ready
                printf 'api_health='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:3010/api/v1/health
                printf 'web_login='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:3005/login
                printf 'admin_root='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:3006/
                printf 'ai_health='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:8011/api/v1/health
                printf 'public_api_live='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 15 https://irexpro.lightworldtech.com/api/v1/health/live
                printf 'public_api_ready='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 15 https://irexpro.lightworldtech.com/api/v1/health/ready
                printf 'public_web='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 15 https://irexpro.lightworldtech.com/login
                printf 'public_admin='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 15 https://irexproadmin.lightworldtech.com/
              } > "$output_file" 2>&1
              ;;
            "/vps disk")
              {
                df -h /
                free -h
              } > "$output_file" 2>&1
              ;;
            "/vps runner-status")
              {
                printf 'runner_user='; whoami
                printf 'host='; hostname
                uptime
                systemctl --no-pager --plain --type=service --state=running 'actions.runner.*irexpro*' 2>/dev/null || true
              } > "$output_file" 2>&1
              ;;
            "/vps no-trade-diagnostics")
              {
                staging=/home/lightworld/webapps/irexpro-staging
                printf 'staging_sha='; git -C "$staging" rev-parse HEAD 2>/dev/null || printf 'UNKNOWN\n'
                printf 'utc_now='; date -u '+%Y-%m-%dT%H:%M:%SZ'
                printf '%s\n' 'pm2_services:'
                pm2 jlist 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{for(const p of JSON.parse(s||'[]')){if((p.name||'').includes('irexpro')) console.log(p.name+' status='+(p.pm2_env?.status||'unknown')+' restarts='+(p.pm2_env?.restart_time??'unknown'))}})" || true

                ai_log="$RUNNER_TEMP/irexpro-ai-diagnostics.log"
                api_log="$RUNNER_TEMP/irexpro-api-diagnostics.log"
                pm2 logs irexpro-ai-staging --lines 6000 --nostream --raw > "$ai_log" 2>&1 || true
                pm2 logs irexpro-api-staging --lines 6000 --nostream --raw > "$api_log" 2>&1 || true

                python3 - "$ai_log" "$api_log" <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          ai = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          api = Path(sys.argv[2]).read_text(encoding='utf-8', errors='replace')
          combined = ai + '\n' + api

          print(f'ai_log_lines={len(ai.splitlines())}')
          print(f'api_log_lines={len(api.splitlines())}')

          reason_counts = Counter(re.findall(r'\breason=([A-Z][A-Z0-9_]+)', combined))
          blocker_counts = Counter(re.findall(r'\b(?:blocker|code)=([A-Z][A-Z0-9_]+)', combined))
          print('top_reason_counts:')
          for key, value in reason_counts.most_common(25):
              print(f'  {key}={value}')
          print('top_blocker_counts:')
          for key, value in blocker_counts.most_common(20):
              print(f'  {key}={value}')

          checks = [
              'execution=SHADOW_ONLY',
              'PAPER research-throughput',
              'PAIRED_REVERSAL_RESEARCH',
              'REJECTED_EDGE_CANARY',
              'Counterfactual',
              'SPREAD_EVIDENCE_INVALID',
              'NET_EXPECTED_R_TOO_LOW',
              'UNSAFE_BLOCKER',
              'DIRECTION_QUALITY_TOO_LOW',
              'TRADE_QUALITY_TOO_LOW',
              'EXIT_QUALITY_TOO_LOW',
              'EVENT_RISK_NOT_CLEAR',
              'EPISODE_COOLDOWN',
              'ACTIVE_RESEARCH_SAMPLE',
              'POST_LOSS',
              'No new market data revision',
              'PAPER_PRE_INTENT_RETRY_SAFE',
              'RISK REJECTED',
              'order placed',
              'signal submitted',
              'execution failed',
          ]
          print('keyword_counts:')
          for needle in checks:
              print(f'  {needle}={combined.count(needle)}')

          interesting = []
          needles_lower = [needle.lower() for needle in checks] + [
              'multi-model ensemble',
              'paperadmitted=',
              'netexpectedr=',
              'scanner',
              'market data',
              'allocation',
              'risk rejected',
              'submitted',
              'executed',
          ]
          for line in combined.splitlines():
              lower = line.lower()
              if any(needle in lower for needle in needles_lower):
                  interesting.append(line)

          print('recent_relevant_events:')
          for line in interesting[-100:]:
              print(line[:900])
          PY
              } > "$output_file" 2>&1
              ;;
            *)
              printf 'Rejected: command is not in the read-only allow-list.\n' > "$output_file"
              exit 64
              ;;
          esac

          python3 - "$output_file" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          text = re.sub(
              r'(?i)(token|password|secret|api[_-]?key)=\S+',
              r'\1=[REDACTED]',
              text,
          )
          text = re.sub(
              r'\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b',
              '[UUID_REDACTED]',
              text,
          )
          text = re.sub(
              r'(?i)\b(user(?:Id)?|account(?:Id)?|connection(?:Id)?|brokerConnectionId)=\S+',
              lambda m: f'{m.group(1)}=[REDACTED]',
              text,
          )
          text = text.replace('```', "'''")
          if len(text) > 12000:
              text = text[:12000] + '\n[output truncated]\n'
          path.write_text(text, encoding='utf-8')
          PY

          printf '%s\n' '--- sanitized VPS result ---'
          cat "$output_file"
