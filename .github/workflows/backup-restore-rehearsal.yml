name: Backup Restore Rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/database/**'
      - '.github/workflows/backup-restore-rehearsal.yml'
      - 'docs/runbooks/sprint-48-operational-security-readiness.md'

permissions:
  contents: read

env:
  POSTGRES_CONTAINER_IMAGE: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55 # Docker Official Image
  POSTGRES_PASSWORD: ci_disposable_restore_password
  SOURCE_DB: irexpro_backup_source
  RESTORE_DB: irexpro_backup_restore
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  TRIGGER_SHA: ${{ github.sha }}

jobs:
  synthetic-postgres-restore:
    name: Synthetic PostgreSQL 16 Restore Rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55 # Docker Official Image
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_disposable_restore_password
          POSTGRES_DB: irexpro_backup_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irexpro_backup_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "CHECKED_OUT_SHA=$actual" >> "$GITHUB_ENV"

      - name: Create sanitized evidence directory
        run: mkdir -p security-artifacts

      - name: Seed disposable source database
        run: |
          set -euo pipefail
          # -i is required so the heredoc reaches psql inside the client
          # container; without it Docker closes stdin and creates an empty dump.
          docker run --rm -i --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_CONTAINER_IMAGE" \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "$SOURCE_DB" <<'SQL'
          CREATE TABLE rehearsal_parent (
            id integer PRIMARY KEY,
            label text NOT NULL UNIQUE
          );
          CREATE TABLE rehearsal_child (
            id integer PRIMARY KEY,
            parent_id integer NOT NULL REFERENCES rehearsal_parent(id),
            amount integer NOT NULL CHECK (amount > 0)
          );
          INSERT INTO rehearsal_parent (id, label) VALUES
            (1, 'alpha'),
            (2, 'beta');
          INSERT INTO rehearsal_child (id, parent_id, amount) VALUES
            (10, 1, 100),
            (11, 1, 200),
            (12, 2, 300);
          SQL

      - name: Create backup and integrity digest
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -v "$PWD/security-artifacts:/evidence" \
            "$POSTGRES_CONTAINER_IMAGE" \
            pg_dump -h 127.0.0.1 -U postgres -d "$SOURCE_DB" \
              --format=custom --no-owner --no-privileges \
              --file=/evidence/synthetic-restore.dump

          sha256sum security-artifacts/synthetic-restore.dump \
            | awk '{print $1}' > security-artifacts/synthetic-restore.sha256

      - name: Restore into isolated database
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_CONTAINER_IMAGE" \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
              -c "CREATE DATABASE $RESTORE_DB"

          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -v "$PWD/security-artifacts:/evidence" \
            "$POSTGRES_CONTAINER_IMAGE" \
            pg_restore -h 127.0.0.1 -U postgres -d "$RESTORE_DB" \
              --no-owner --no-privileges --exit-on-error \
              /evidence/synthetic-restore.dump

      - name: Verify restored data and constraints
        run: |
          set -euo pipefail
          parent_count="$(docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_CONTAINER_IMAGE" \
            psql -At -h 127.0.0.1 -U postgres -d "$RESTORE_DB" \
              -c 'SELECT count(*) FROM rehearsal_parent')"
          child_count="$(docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_CONTAINER_IMAGE" \
            psql -At -h 127.0.0.1 -U postgres -d "$RESTORE_DB" \
              -c 'SELECT count(*) FROM rehearsal_child')"

          test "$parent_count" = '2'
          test "$child_count" = '3'

          if docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_CONTAINER_IMAGE" \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "$RESTORE_DB" \
              -c 'INSERT INTO rehearsal_child (id, parent_id, amount) VALUES (99, 999, 1)'; then
            echo 'Foreign-key verification unexpectedly succeeded' >&2
            exit 1
          fi

          if docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_CONTAINER_IMAGE" \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "$RESTORE_DB" \
              -c 'INSERT INTO rehearsal_child (id, parent_id, amount) VALUES (98, 1, 0)'; then
            echo 'CHECK-constraint verification unexpectedly succeeded' >&2
            exit 1
          fi

          digest="$(cat security-artifacts/synthetic-restore.sha256)"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "checked_out_sha=$CHECKED_OUT_SHA"
            echo "trigger_sha=$TRIGGER_SHA"
            echo 'database_version=PostgreSQL 16'
            echo 'source=disposable_ci_fixture'
            echo "backup_sha256=$digest"
            echo "parent_rows=$parent_count"
            echo "child_rows=$child_count"
            echo 'foreign_key_enforced=true'
            echo 'check_constraint_enforced=true'
            echo 'external_integrations=not_configured'
            echo 'result=PASS'
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > security-artifacts/synthetic-restore-evidence.txt

      - name: Destroy restored database and raw dump
        if: always()
        run: |
          set +e
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$POSTGRES_CONTAINER_IMAGE" \
            psql -h 127.0.0.1 -U postgres -d postgres \
              -c "DROP DATABASE IF EXISTS $RESTORE_DB WITH (FORCE)"
          rm -f security-artifacts/synthetic-restore.dump

      - name: Assert raw backup is not retained
        run: |
          set -euo pipefail
          test ! -e security-artifacts/synthetic-restore.dump
          test -s security-artifacts/synthetic-restore-evidence.txt
          test -s security-artifacts/synthetic-restore.sha256
          grep -Fx "candidate_sha=$CANDIDATE_SHA" security-artifacts/synthetic-restore-evidence.txt
          grep -Fx "checked_out_sha=$CANDIDATE_SHA" security-artifacts/synthetic-restore-evidence.txt

      - name: Upload sanitized rehearsal evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: synthetic-postgres-restore-evidence
          path: |
            security-artifacts/synthetic-restore-evidence.txt
            security-artifacts/synthetic-restore.sha256
          if-no-files-found: error
          retention-days: 14
