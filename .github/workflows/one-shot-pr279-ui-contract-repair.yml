name: One-shot PR279 UI contract repair

on:
  push:
    branches:
      - fix/trade-read-resilience-20261005
    paths:
      - .github/workflows/one-shot-pr279-ui-contract-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-read-resilience-20261005
          fetch-depth: 0
      - name: Repair stale Playwright assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/dynamic-trader-cockpit.spec.ts')
          text = path.read_text()

          old = '    await expect(page.getByText(/EURUSD.*GBPUSD.*USDJPY/i)).toBeVisible();'
          new = '''    const watchedInstruments = page.getByLabel("Watched instruments");
    await expect(watchedInstruments).toBeVisible();
    for (const instrument of [
      "EURUSD",
      "GBPUSD",
      "USDJPY",
      "AUDUSD",
      "USDCAD",
      "USDCHF",
    ]) {
      await expect(watchedInstruments).toContainText(instrument);
    }'''
          if old not in text:
              raise SystemExit('watched instruments assertion not found')
          text = text.replace(old, new, 1)

          old = '''    const rows = metrics.locator(":scope > div");
    await expect(rows).toHaveCount(6);

    const boxes = await Promise.all(
      Array.from({ length: 6 }, (_, index) => rows.nth(index).boundingBox()),
    );'''
          new = '''    const rows = metrics.locator(":scope > div");
    const expectedMetricRowCount = 9;
    await expect(rows).toHaveCount(expectedMetricRowCount);

    const boxes = await Promise.all(
      Array.from({ length: expectedMetricRowCount }, (_, index) =>
        rows.nth(index).boundingBox(),
      ),
    );'''
          if old not in text:
              raise SystemExit('desktop metric row assertion not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git rm .github/workflows/one-shot-pr279-ui-contract-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/dynamic-trader-cockpit.spec.ts
          git commit -m "test(web): align trader cockpit assertions with current UI"
          git push origin HEAD:fix/trade-read-resilience-20261005
