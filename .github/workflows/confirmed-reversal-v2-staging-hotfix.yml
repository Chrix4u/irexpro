name: Confirmed Reversal v2 Staging Hotfix

on:
  push:
    branches:
      - deploy/daily-loss-reset-20261028
    paths:
      - '.github/workflows/confirmed-reversal-v2-staging-hotfix.yml'

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://irexpro.lightworldtech.com/login
    env:
      VERIFIED_CODE_SHA: 98621c894d6539a10fc302ea000da40e1cd981f9
      DEPLOY_BRANCH: deploy/daily-loss-reset-20261028
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove trigger contains no application drift after verified SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$VERIFIED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet --no-tags origin "$DEPLOY_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$DEPLOY_BRANCH")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$VERIFIED_CODE_SHA" "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only "$VERIFIED_CODE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/confirmed-reversal-v2-staging-hotfix.yml'

      - name: Validate pinned SSH configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_HOST"
          test -n "$STAGING_SSH_PORT"
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]+$ ]]

      - name: Configure pinned SSH identity and host keys
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging_hotfix"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging_hotfix" "$HOME/.ssh/known_hosts"

      - name: Deploy exact verified API SHA to staging
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/irexpro_staging_hotfix" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- '$VERIFIED_CODE_SHA' '$GITHUB_SHA' '$DEPLOY_BRANCH'" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          target_sha="$1"
          trigger_sha="$2"
          deploy_branch="$3"
          root='/home/lightworld/webapps/irexpro-staging'
          api_pm2='irexpro-api-staging'
          health='http://127.0.0.1:3010/api/v1/health'
          pm2_json_file="$(mktemp)"
          trap 'rm -f "$pm2_json_file"' EXIT

          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$trigger_sha" =~ ^[0-9a-f]{40}$ ]]
          cd "$root"
          test "$(git rev-parse --show-toplevel)" = "$root"
          test -z "$(git status --porcelain)"

          origin_url="$(git config --get remote.origin.url || true)"
          case "$origin_url" in
            https://github.com/Chrix4u/irexpro.git|git@github.com:Chrix4u/irexpro.git|ssh://git@github.com/Chrix4u/irexpro.git) ;;
            *) printf 'HOTFIX HOLD: unexpected origin.\n' >&2; exit 21 ;;
          esac

          previous_sha="$(git rev-parse HEAD)"
          git fetch --quiet origin "$deploy_branch"
          test "$(git rev-parse "origin/$deploy_branch")" = "$trigger_sha"
          git cat-file -e "${target_sha}^{commit}"
          git merge-base --is-ancestor "$target_sha" "origin/$deploy_branch"

          git switch --quiet --detach "$target_sha"
          test "$(git rev-parse HEAD)" = "$target_sha"
          test -z "$(git status --porcelain)"

          cd apps/api
          pnpm build
          pm2 restart "$api_pm2" --update-env

          ok=0
          for attempt in $(seq 1 60); do
            if payload="$(curl --fail --silent --show-error --max-time 10 "$health" 2>/dev/null)"; then
              if HEALTH_PAYLOAD="$payload" node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.HEALTH_PAYLOAD || '{}');
          if (payload.status !== 'ok') process.exit(1);
          NODE
              then
                ok=1
                break
              fi
            fi
            sleep 2
          done
          test "$ok" -eq 1

          pm2 jlist > "$pm2_json_file"
          node --input-type=module - "$pm2_json_file" <<'NODE'
          import fs from 'node:fs';
          const path = process.argv[2];
          const rows = JSON.parse(fs.readFileSync(path, 'utf8'));
          const p = rows.find((row) => row.name === 'irexpro-api-staging');
          if (!p || p.pm2_env?.status !== 'online') process.exit(1);
          if ((p.pm2_env?.unstable_restarts ?? 0) > 0) process.exit(2);
          console.log(`pm2_status=${p.pm2_env.status}`);
          console.log(`pm2_historical_restarts=${p.pm2_env.restart_time ?? 'unknown'}`);
          console.log(`pm2_unstable_restarts=${p.pm2_env.unstable_restarts ?? 'unknown'}`);
          NODE

          test "$(git -C "$root" rev-parse HEAD)" = "$target_sha"
          printf 'HOTFIX DEPLOYMENT VERIFIED\n'
          printf 'previous_sha=%s\n' "$previous_sha"
          printf 'candidate_sha=%s\n' "$target_sha"
          REMOTE

      - name: Verify public API health
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(curl --fail --silent --show-error --max-time 15 https://irexpro.lightworldtech.com/api/v1/health)"
          HEALTH_PAYLOAD="$payload" node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.HEALTH_PAYLOAD || '{}');
          if (payload.status !== 'ok') process.exit(1);
          console.log('public_api_health=ok');
          NODE

      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging_hotfix" "$HOME/.ssh/known_hosts"
