name: One-shot M5 cadence repair

on:
  push:
    branches:
      - fix/multi-pair-paper-opportunity-eval-20261005
    paths:
      - .github/workflows/one-shot-m5-cadence-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align scanner cadence with M5 bars
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/modules/ai/vps-forex-signal-collector.service.ts')
          text = service.read_text()
          replacements = [
              (
                  'const BAR_MS = 5 * 60_000;\nconst FRESH_BREAKOUT_ATR = 0.5;',
                  'const BAR_MS = 5 * 60_000;\nconst COLLECTION_CADENCE_MINUTES = 5;\nconst FRESH_BREAKOUT_ATR = 0.5;',
              ),
              (
                  "        'cadence=10m timeframe=M5 marketHours=FX_24X5_SUN21_FRI21_UTC',",
                  "        `cadence=${COLLECTION_CADENCE_MINUTES}m timeframe=M5 marketHours=FX_24X5_SUN21_FRI21_UTC`,",
              ),
              ('      cadenceMinutes: 10,', '      cadenceMinutes: COLLECTION_CADENCE_MINUTES,'),
              ('      skippedUtcHours: [21, 22, 23],', '      skippedUtcHours: [],'),
              (
                  '    const remainder = candidate.getUTCMinutes() % 10;\n    candidate.setUTCMinutes(candidate.getUTCMinutes() + (remainder === 0 ? 10 : 10 - remainder));',
                  '    const remainder = candidate.getUTCMinutes() % COLLECTION_CADENCE_MINUTES;\n    candidate.setUTCMinutes(\n      candidate.getUTCMinutes() +\n        (remainder === 0\n          ? COLLECTION_CADENCE_MINUTES\n          : COLLECTION_CADENCE_MINUTES - remainder),\n    );',
              ),
              (
                  '      candidate.setUTCMinutes(candidate.getUTCMinutes() + 10);',
                  '      candidate.setUTCMinutes(\n        candidate.getUTCMinutes() + COLLECTION_CADENCE_MINUTES,\n      );',
              ),
              (
                  '    return now.getUTCMinutes() % 10 === 0;',
                  '    return now.getUTCMinutes() % COLLECTION_CADENCE_MINUTES === 0;',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'service replacement expected 1 match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          service.write_text(text)

          spec = Path('apps/api/src/modules/ai/vps-forex-signal-collector.service.spec.ts')
          text = spec.read_text()
          marker = "describe('VpsForexSignalCollectorService', () => {\n"
          test = '''describe('VpsForexSignalCollectorService', () => {\n  it('collects every closed M5 slot across the FX 24x5 market week', async () => {\n    const collector = new VpsForexSignalCollectorService(\n      config({}),\n      { receiveSignal: jest.fn() } as unknown as AiSignalService,\n      {} as unknown as ExecutionService,\n      {} as unknown as BrokerService,\n      new LivePaperMarketDataService(),\n      aiEngineClientMock(),\n    );\n    const isCollectionSlot = (value: string) =>\n      (collector as any).isCollectionSlot(new Date(value)) as boolean;\n    const nextEligible = (value: string) =>\n      ((collector as any).nextEligibleScanAt(new Date(value)) as Date).toISOString();\n\n    expect(isCollectionSlot('2026-10-05T10:00:00.000Z')).toBe(true);\n    expect(isCollectionSlot('2026-10-05T10:05:00.000Z')).toBe(true);\n    expect(isCollectionSlot('2026-10-05T10:10:00.000Z')).toBe(true);\n    expect(isCollectionSlot('2026-10-05T10:03:00.000Z')).toBe(false);\n\n    expect(isCollectionSlot('2026-10-10T12:00:00.000Z')).toBe(false);\n    expect(isCollectionSlot('2026-10-11T20:55:00.000Z')).toBe(false);\n    expect(isCollectionSlot('2026-10-11T21:00:00.000Z')).toBe(true);\n    expect(isCollectionSlot('2026-10-09T20:55:00.000Z')).toBe(true);\n    expect(isCollectionSlot('2026-10-09T21:00:00.000Z')).toBe(false);\n\n    expect(nextEligible('2026-10-05T10:03:00.000Z')).toBe('2026-10-05T10:05:00.000Z');\n    expect(nextEligible('2026-10-05T10:05:00.000Z')).toBe('2026-10-05T10:10:00.000Z');\n    expect(nextEligible('2026-10-11T20:58:00.000Z')).toBe('2026-10-11T21:00:00.000Z');\n    expect(nextEligible('2026-10-09T20:58:00.000Z')).toBe('2026-10-11T21:00:00.000Z');\n\n    const status = await collector.getStatus('user-1');\n    expect(status.cadenceMinutes).toBe(5);\n    expect(status.timeframe).toBe('M5');\n    expect(status.skippedUtcHours).toEqual([]);\n  });\n\n'''
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'spec marker expected 1 match, got {count}')
          spec.write_text(text.replace(marker, test, 1))
          PY

          git diff --check
          git diff -- apps/api/src/modules/ai/vps-forex-signal-collector.service.ts apps/api/src/modules/ai/vps-forex-signal-collector.service.spec.ts

      - name: Run focused scanner tests
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @irexpro/api test -- --runInBand vps-forex-signal-collector.service.spec.ts

      - name: Commit M5 cadence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "irexpro-ci-repair"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/modules/ai/vps-forex-signal-collector.service.ts apps/api/src/modules/ai/vps-forex-signal-collector.service.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(ai): evaluate every closed M5 scanner bar"
          git push origin "HEAD:${GITHUB_REF_NAME}"
