name: Six Pair Research Run

on:
  workflow_run:
    workflows: ['Staging Deploy']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: irexpro-six-pair-research
  cancel-in-progress: false

jobs:
  research:
    name: Run secured six-pair XGBoost pilot on staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: staging

    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet --no-tags origin main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Run real-data six-pair pilot
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/irexpro_staging" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- $CANDIDATE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          candidate_sha="$1"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'RESEARCH HOLD: invalid candidate SHA.\n' >&2
            exit 2
          }

          readonly STAGING_ROOT='/home/lightworld/webapps/irexpro-staging'
          readonly API_ENV="$STAGING_ROOT/apps/api/.env"
          readonly AI_ENV="$STAGING_ROOT/services/ai-engine/.env"
          readonly OUTPUT_ROOT="/home/lightworld/research/irexpro-six-pair/$candidate_sha"
          readonly TARGET_ROWS=25000

          read_dotenv_value() {
            local file="$1"
            local key="$2"
            local line
            [[ -f "$file" ]] || return 1
            line="$(grep -E "^${key}=[^[:space:]]+$" "$file" | tail -n 1 || true)"
            [[ -n "$line" ]] || return 1
            printf '%s' "${line#*=}"
          }

          cd "$STAGING_ROOT"
          test "$(git rev-parse --show-toplevel)" = "$STAGING_ROOT"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test -z "$(git status --porcelain)"

          available_kb="$(df -Pk "$STAGING_ROOT" | awk 'NR==2 {print $4}')"
          [[ "$available_kb" =~ ^[0-9]+$ ]]
          if (( available_kb < 2097152 )); then
            printf 'RESEARCH HOLD: less than 2 GiB free disk space on staging.\n' >&2
            exit 3
          fi

          internal_api_key="$(read_dotenv_value "$AI_ENV" NESTJS_INTERNAL_API_KEY)" || {
            printf 'RESEARCH HOLD: AI internal API key is missing.\n' >&2
            exit 4
          }
          api_internal_key="$(read_dotenv_value "$API_ENV" NESTJS_INTERNAL_API_KEY)" || {
            printf 'RESEARCH HOLD: API internal API key is missing.\n' >&2
            exit 5
          }
          [[ "$internal_api_key" == "$api_internal_key" ]] || {
            printf 'RESEARCH HOLD: API/AI internal API keys do not match.\n' >&2
            exit 6
          }
          export NESTJS_INTERNAL_API_KEY="$internal_api_key"
          unset api_internal_key internal_api_key

          selection="$(
            cd "$STAGING_ROOT/apps/api"
            node <<'NODE'
          const dotenv = require('dotenv');
          const { Client } = require('pg');

          dotenv.config({ path: '.env', quiet: true });

          const client = new Client({
            host: process.env.DB_HOST || 'localhost',
            port: Number(process.env.DB_PORT || 5432),
            database: process.env.DB_NAME || 'irexpro_dev',
            user: process.env.DB_USER || 'irexpro',
            password: process.env.DB_PASSWORD,
            ssl: process.env.DB_SSL === 'true' ? { rejectUnauthorized: false } : false,
          });

          (async () => {
            await client.connect();
            try {
              const result = await client.query(
                `SELECT user_id::text AS user_id, id::text AS connection_id
                   FROM broker.broker_connections
                  WHERE deleted_at IS NULL
                    AND broker_id = 'metatrader5'
                    AND account_type = 'DEMO'
                    AND status = 'CONNECTED'
                    AND credential_status IN ('CREATED', 'VERIFIED', 'ROTATED')
                    AND encrypted_credentials IS NOT NULL
                    AND credential_iv IS NOT NULL
                    AND credential_tag IS NOT NULL
                  ORDER BY updated_at DESC
                  LIMIT 2`,
              );

              if (result.rows.length !== 1) {
                process.stderr.write(
                  `RESEARCH HOLD: expected exactly one eligible connected MetaTrader5 DEMO account; found ${result.rows.length}.\n`,
                );
                process.exitCode = 12;
                return;
              }

              process.stdout.write(
                `${result.rows[0].user_id}|${result.rows[0].connection_id}`,
              );
            } finally {
              await client.end();
            }
          })().catch((error) => {
            process.stderr.write(
              `RESEARCH HOLD: broker selector failed (${error.name || 'Error'}).\n`,
            );
            process.exitCode = 13;
          });
          NODE
          )"

          IFS='|' read -r research_user_id research_connection_id <<< "$selection"
          [[ "$research_user_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$research_connection_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          unset selection

          ai_health="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8011/api/v1/health)"
          AI_HEALTH="$ai_health" node <<'NODE'
          const payload = JSON.parse(process.env.AI_HEALTH);
          const paper = [
            payload.signal_mode,
            payload.execution_mode,
            payload.mode,
            payload.paper_mode,
            payload.paperMode,
          ].some((value) =>
            value === true ||
            String(value).toLowerCase() === 'paper' ||
            String(value).toLowerCase() === 'paper-only'
          );
          if (!paper) {
            process.stderr.write('RESEARCH HOLD: AI staging runtime is not verified paper-only.\n');
            process.exit(14);
          }
          NODE
          unset ai_health

          python_bin=''
          for candidate in \
            "$STAGING_ROOT/services/ai-engine/.venv/bin/python" \
            "$STAGING_ROOT/services/ai-engine/venv/bin/python"; do
            if [[ -x "$candidate" ]]; then
              python_bin="$candidate"
              break
            fi
          done
          [[ -n "$python_bin" ]] || {
            printf 'RESEARCH HOLD: AI Python virtual environment was not found.\n' >&2
            exit 15
          }

          rm -rf "$OUTPUT_ROOT"
          install -d -m 700 "$OUTPUT_ROOT"

          cd "$STAGING_ROOT/services/ai-engine"
          export PYTHONPATH="$PWD"

          "$python_bin" -m app.domain.training.run_first_six_pair \
            --api-base-url http://127.0.0.1:3010/api/v1 \
            --user-id "$research_user_id" \
            --broker-connection-id "$research_connection_id" \
            --output-dir "$OUTPUT_ROOT" \
            --target-rows "$TARGET_ROWS" \
            --horizons 1,5,10 \
            --confidence-threshold 0.60 \
            --commission-bps 0 \
            --slippage-bps 0 \
            --max-splits 5 \
            > "$OUTPUT_ROOT/run-result.json"

          unset research_user_id research_connection_id NESTJS_INTERNAL_API_KEY

          summary="$OUTPUT_ROOT/reports/six_pair_walkforward_summary.json"
          test -s "$summary"

          SUMMARY_PATH="$summary" node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH, 'utf8'));
          console.log('SIX_PAIR_RESEARCH_COMPLETED');
          console.log(`instruments=${report.instruments.join(',')}`);
          console.log(`target_rows_per_pair=${report.target_m1_rows_per_instrument}`);
          for (const horizon of ['1m', '5m', '10m']) {
            const block = report.horizon_reports[horizon];
            if (!block) continue;
            const c = block.overall.classification;
            const t = block.overall.trading;
            const g = block.research_gate;
            console.log(
              [
                `horizon=${horizon}`,
                `balanced_accuracy=${Number(c.balanced_accuracy).toFixed(6)}`,
                `precision=${Number(c.precision).toFixed(6)}`,
                `sharpe=${t.sharpe_ratio == null ? 'null' : Number(t.sharpe_ratio).toFixed(6)}`,
                `profit_factor=${t.profit_factor == null ? 'null' : Number(t.profit_factor).toFixed(6)}`,
                `max_drawdown=${Number(t.max_drawdown).toFixed(6)}`,
                `trades=${t.trade_or_period_count}`,
                `gate=${g.research_gate_passed ? 'PASS' : 'HOLD'}`,
              ].join(' ')
            );
          }
          NODE

          printf 'report_path=%s\n' "$summary"
          REMOTE

      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
