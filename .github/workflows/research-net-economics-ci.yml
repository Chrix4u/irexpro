name: Research - Pepperstone DEMO Net Economics

on:
  push:
    branches:
      - fix/planb-clock-neutral-telemetry-20261111
    paths:
      - apps/api/scripts/research-owner-demo-net-economics-review.cjs
      - apps/api/scripts/research-owner-demo-net-economics-review.test.cjs
      - apps/api/scripts/research-owner-demo-commission-routing-shadow.cjs
      - apps/api/scripts/research-owner-demo-commission-routing-shadow.test.cjs
      - apps/api/scripts/run-owner-demo-commission-routing-shadow.cjs
      - apps/api/scripts/run-owner-demo-commission-routing-shadow.test.cjs
      - apps/api/scripts/audit-commission-r-calibration-gap.cjs
      - apps/api/scripts/audit-commission-r-calibration-gap.test.cjs
      - .github/workflows/research-net-economics-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Check read-only audit source
        run: |
          node --check apps/api/scripts/audit-commission-r-calibration-gap.cjs
          node --check apps/api/scripts/research-owner-demo-net-economics-review.cjs
          node --check apps/api/scripts/research-owner-demo-commission-routing-shadow.cjs
          node --check apps/api/scripts/run-owner-demo-commission-routing-shadow.cjs
      - name: Validate broker-scope, after-cost decomposition, and no order authority
        run: |
          node --test apps/api/scripts/audit-commission-r-calibration-gap.test.cjs
          node --test apps/api/scripts/research-owner-demo-net-economics-review.test.cjs
          node --test apps/api/scripts/research-owner-demo-commission-routing-shadow.test.cjs
          node --test apps/api/scripts/run-owner-demo-commission-routing-shadow.test.cjs
