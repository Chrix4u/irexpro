name: Apply spread telemetry core once

on:
  push:
    branches:
      - feature/execution-spread-telemetry-20261103
    paths:
      - '.github/workflows/apply-spread-core-once.yml'

permissions:
  contents: write

jobs:
  apply-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/execution-spread-telemetry-20261103
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: '10.34.5'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch quote provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gate = Path('apps/api/src/modules/execution/orchestration/market-safety-gate.service.ts')
          s = gate.read_text()
          imp = "import type { BrokerPrice } from '../../broker/interfaces/broker-adapter.interface';\n"
          if imp not in s:
              anchor = "import { BrokerService } from '../../broker/broker.service';\n"
              if anchor not in s:
                  raise SystemExit('market gate import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          old = "): Promise<void> {\n    // 1. The provable current quote (§18 — no invention on gaps)."
          new = "): Promise<BrokerPrice> {\n    // 1. The provable current quote (§18 — no invention on gaps)."
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('market gate return type anchor missing')
          marker = "\n  /** Terminally reject the order + audit, then surface the typed error. */"
          if "\n    return quote;\n  }\n" not in s:
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('market gate method end marker missing')
              before = s[:idx]
              pos = before.rfind("\n  }\n")
              if pos < 0:
                  raise SystemExit('market gate closing brace missing')
              before = before[:pos] + "\n\n    return quote;" + before[pos:]
              s = before + s[idx:]
          gate.write_text(s)

          spec = Path('apps/api/src/modules/execution/orchestration/market-safety-gate.spec.ts')
          s = spec.read_text()
          s = s.replace(
              ").resolves.toBeUndefined();",
              ").resolves.toEqual(expect.objectContaining({ instrument: 'EURUSD' }));",
          )
          spec.write_text(s)

          contract = Path('apps/api/src/modules/execution/orchestration/execution-intent.interface.ts')
          s = contract.read_text()
          imp = "import type { BrokerPrice } from '../../broker/interfaces/broker-adapter.interface';\n"
          if imp not in s:
              anchor = "import { ProviderDispatchCertainty } from '../../broker/interfaces/provider-dispatch-certainty';\n"
              if anchor not in s:
                  raise SystemExit('outcome contract import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          if 'executionQuote?: BrokerPrice;' not in s:
              anchor = "      swap?: string;\n"
              if anchor not in s:
                  raise SystemExit('FILLED contract anchor missing')
              s = s.replace(
                  anchor,
                  anchor + "      /** Exact fresh quote already proven by the final market-safety gate. */\n      executionQuote?: BrokerPrice;\n",
                  1,
              )
          contract.write_text(s)

          orch = Path('apps/api/src/modules/execution/orchestration/execution-orchestrator.service.ts')
          s = orch.read_text()
          if '  BrokerPrice,\n' not in s:
              anchor = "  BrokerOrderResult,\n"
              if anchor not in s:
                  raise SystemExit('orchestrator import anchor missing')
              s = s.replace(anchor, anchor + "  BrokerPrice,\n", 1)
          old = "    if (\n      operationClass === ProviderOperationClass.NEW_EXPOSURE &&\n      intent.providerAction === 'PLACE'\n    ) {\n      await this.marketSafetyGate.assertMarketSafeForDispatch(intent, connection, order.id);\n    }"
          new = "    let executionQuote: BrokerPrice | undefined;\n    if (\n      operationClass === ProviderOperationClass.NEW_EXPOSURE &&\n      intent.providerAction === 'PLACE'\n    ) {\n      executionQuote = await this.marketSafetyGate.assertMarketSafeForDispatch(\n        intent,\n        connection,\n        order.id,\n      );\n    }"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('orchestrator market-safety anchor missing')
          if '            executionQuote,\n' not in s:
              anchor = "            swap: action.swap,\n"
              if anchor not in s:
                  raise SystemExit('FILLED outcome return anchor missing')
              s = s.replace(anchor, anchor + "            executionQuote,\n", 1)
          orch.write_text(s)
          PY
      - name: Focused GREEN tests
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: irexpro_test
          DB_USER: irexpro
          DB_PASSWORD: test_password
          COOKIE_SECRET: test_cookie_secret_min_16
        run: |
          pnpm --filter @irexpro/api exec jest --runInBand --forceExit \
            src/modules/execution/orchestration/market-safety-gate.quote-return.spec.ts \
            src/modules/execution/orchestration/market-safety-gate.spec.ts \
            src/modules/execution/orchestration/execution-orchestrator.spec.ts \
            src/modules/execution/services/trade-spread-telemetry.service.spec.ts
      - name: API build
        run: pnpm --filter @irexpro/api build
      - name: Commit verified quote propagation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/apply-spread-core-once.yml
          git config user.name 'Christian'
          git config user.email '72771310+Chrix4u@users.noreply.github.com'
          git add apps/api/src/modules/execution/orchestration/market-safety-gate.service.ts \
                  apps/api/src/modules/execution/orchestration/market-safety-gate.spec.ts \
                  apps/api/src/modules/execution/orchestration/execution-intent.interface.ts \
                  apps/api/src/modules/execution/orchestration/execution-orchestrator.service.ts \
                  .github/workflows/apply-spread-core-once.yml
          git commit -m 'feat(execution): carry proven quote into spread telemetry'
          git push origin HEAD:feature/execution-spread-telemetry-20261103
