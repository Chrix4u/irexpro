name: DC Emergency Recovery

on:
  push:
    branches:
      - ops/dc-recovery-20261013

permissions:
  contents: read

concurrency:
  group: dc-emergency-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Repair Desktop Commander
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - name: Validate recovery inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_HOST"
          test -n "$STAGING_SSH_PORT"
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]+$ ]]

      - name: Configure pinned SSH identity and host keys
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Repair Desktop Commander agent
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/irexpro_staging" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "if [ \"\$(id -u)\" -eq 0 ]; then exec /usr/local/sbin/dc-recovery repair; else exec sudo -n /usr/local/sbin/dc-recovery repair; fi"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
