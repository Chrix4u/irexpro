name: Strategy Promotion Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategy-artifacts/**'
      - 'scripts/strategy/**'
      - 'apps/api/src/modules/ai/vps-forex-signal-collector.service.ts'
      - 'apps/api/src/modules/ai/v8-shadow-meta-scorer.ts'
      - '.github/workflows/strategy-promotion-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'strategy-artifacts/**'
      - 'scripts/strategy/**'
      - 'apps/api/src/modules/ai/vps-forex-signal-collector.service.ts'
      - 'apps/api/src/modules/ai/v8-shadow-meta-scorer.ts'
      - '.github/workflows/strategy-promotion-integrity.yml'

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Strategy Promotion Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Self-test artifact freezer
        run: node scripts/strategy/frozen-artifact.mjs --self-test

      - name: Verify all committed frozen artifacts
        run: node scripts/strategy/frozen-artifact.mjs
