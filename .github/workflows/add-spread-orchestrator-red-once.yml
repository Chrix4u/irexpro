name: Add spread orchestrator RED once

on:
  push:
    branches: [feature/execution-spread-telemetry-20261103]
    paths:
      - '.github/workflows/add-spread-orchestrator-red-once.yml'

permissions:
  contents: write

env:
  BRANCH: feature/execution-spread-telemetry-20261103

jobs:
  add-red-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Add missing orchestrator quote-provenance regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/modules/execution/orchestration/execution-orchestrator.spec.ts')
          s = p.read_text()
          old = "  let boundaryMock: { commitProviderDispatch: jest.Mock };\n"
          new = old + "  let marketSafetyGate: { assertMarketSafeForDispatch: jest.Mock };\n"
          if 'let marketSafetyGate:' not in s:
              if old not in s: raise SystemExit('boundary declaration anchor missing')
              s = s.replace(old, new, 1)

          old = "    orchestrator = new ExecutionOrchestrator(\n"
          setup = "    marketSafetyGate = {\n      assertMarketSafeForDispatch: jest.fn().mockResolvedValue(undefined),\n    };\n\n"
          if 'marketSafetyGate = {' not in s:
              if old not in s: raise SystemExit('constructor anchor missing')
              s = s.replace(old, setup + old, 1)

          old = "      {\n        assertMarketSafeForDispatch: jest.fn().mockResolvedValue(undefined),\n      } as unknown as MarketSafetyGateService,\n"
          new = "      marketSafetyGate as unknown as MarketSafetyGateService,\n"
          if old in s:
              s = s.replace(old, new, 1)

          anchor = "    it('a SUCCESSFUL commitment proceeds to the provider dispatch as before', async () => {\n"
          test = "    it('carries the exact market-safety quote on a FILLED new-exposure outcome without another quote read', async () => {\n      const executionQuote = {\n        instrument: 'EURUSD',\n        bid: '1.08490',\n        ask: '1.08510',\n        spread: '0.00020',\n        timestamp: new Date('2026-11-03T10:00:00.000Z'),\n      };\n      marketSafetyGate.assertMarketSafeForDispatch.mockResolvedValueOnce(executionQuote);\n\n      const outcome = await orchestrator.dispatchOrder(intent, connection, {\n        grantId: 'grant-spread-quote',\n        origin: 'PIPELINE',\n      });\n\n      expect(marketSafetyGate.assertMarketSafeForDispatch).toHaveBeenCalledTimes(1);\n      expect(outcome.outcome).toBe('FILLED');\n      if (outcome.outcome === 'FILLED') {\n        expect(outcome.executionQuote).toBe(executionQuote);\n      }\n      expect(adapter.placeOrder).toHaveBeenCalledTimes(1);\n    });\n\n"
          if "carries the exact market-safety quote" not in s:
              if anchor not in s: raise SystemExit('test insertion anchor missing')
              s = s.replace(anchor, test + anchor, 1)
          p.write_text(s)
          PY

          rm .github/workflows/add-spread-orchestrator-red-once.yml
          git config user.name 'Christian'
          git config user.email '72771310+Chrix4u@users.noreply.github.com'
          git add apps/api/src/modules/execution/orchestration/execution-orchestrator.spec.ts .github/workflows/add-spread-orchestrator-red-once.yml
          git commit -m 'test: require filled outcome spread quote provenance'
          git push origin HEAD:${BRANCH}
