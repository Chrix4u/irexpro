name: Staging Allocation Diagnostic

on:
  push:
    branches:
      - diagnostic/staging-allocation-read

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Inspect allocation state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/irexpro_staging" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/lightworld/webapps/irexpro-staging
          echo 'stage=connected'

          api_id="$(pm2 jlist | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const xs=JSON.parse(s);
              const p=xs.find(x=>x.name==="irexpro-api-staging");
              if(!p) process.exit(2);
              process.stdout.write(String(p.pm_id));
            });
          ')"
          echo "stage=pm2 api_id=$api_id"

          test -f apps/api/.env
          echo 'stage=api-env-found'
          cd apps/api

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dotenv = require('dotenv');
          const { Client } = require('pg');
          const env = dotenv.parse(fs.readFileSync(path.join(process.cwd(), '.env')));

          (async () => {
            const client = new Client({
              host: env.DB_HOST || 'localhost',
              port: Number(env.DB_PORT || 5432),
              database: env.DB_NAME || 'irexpro_dev',
              user: env.DB_USER || 'irexpro',
              password: env.DB_PASSWORD,
              ssl: env.DB_SSL === 'true' ? { rejectUnauthorized: false } : false,
            });
            await client.connect();

            const sql = [
              "SELECT",
              "  left(c.id::text,8) AS connection,",
              "  left(c.user_id::text,8) AS user_ref,",
              "  c.broker_id,",
              "  c.status,",
              "  c.account_type,",
              "  CASE WHEN c.logical_account_key IS NULL THEN 'MISSING' ELSE 'PRESENT' END AS logical_key,",
              "  COALESCE(a.balance::text,'NULL') AS legacy_balance,",
              "  COALESCE(a.equity::text,'NULL') AS legacy_equity,",
              "  COALESCE(a.currency,'NULL') AS legacy_currency,",
              "  COALESCE(b.total_capital::text,'NULL') AS budget,",
              "  COALESCE(b.account_currency,'NULL') AS budget_currency,",
              "  COALESCE(s.balance::text,'NULL') AS snapshot_balance,",
              "  COALESCE(s.equity::text,'NULL') AS snapshot_equity,",
              "  COALESCE(s.currency,'NULL') AS snapshot_currency,",
              "  COALESCE(s.generation::text,'NULL') AS snapshot_generation,",
              "  CASE WHEN ts.id IS NULL THEN 'NO' ELSE 'YES' END AS active_session,",
              "  CASE",
              "    WHEN c.logical_account_key IS NULL THEN 'FAIL_LOGICAL_KEY'",
              "    WHEN COALESCE(s.equity, a.equity) IS NULL OR COALESCE(s.equity, a.equity) <= 0 THEN 'FAIL_EQUITY'",
              "    WHEN COALESCE(s.currency, a.currency) IS NULL OR length(COALESCE(s.currency, a.currency)) <> 3 THEN 'FAIL_CURRENCY'",
              "    WHEN b.id IS NOT NULL AND b.account_currency <> COALESCE(s.currency, a.currency) THEN 'FAIL_BUDGET_CURRENCY'",
              "    ELSE 'PRECONDITIONS_OK'",
              "  END AS allocation_precondition",
              "FROM broker.broker_connections c",
              "LEFT JOIN broker.broker_accounts a ON a.broker_connection_id = c.id",
              "LEFT JOIN trading.capital_budgets b",
              "  ON b.user_id = c.user_id",
              " AND b.logical_account_key = c.logical_account_key",
              "LEFT JOIN LATERAL (",
              "  SELECT balance,equity,currency,generation",
              "  FROM broker.broker_account_snapshots s",
              "  WHERE s.connection_id = c.id",
              "  ORDER BY generation DESC",
              "  LIMIT 1",
              ") s ON true",
              "LEFT JOIN trading.trading_sessions ts",
              "  ON ts.broker_connection_id = c.id",
              " AND ts.status = 'ACTIVE'",
              "WHERE c.status = 'CONNECTED'",
              "ORDER BY CASE WHEN ts.id IS NULL THEN 1 ELSE 0 END, c.created_at DESC",
              "LIMIT 25"
            ].join("\n");

            const result = await client.query(sql);
            console.log('=== CONNECTED ACCOUNTS / ACTIVE SESSION ===');
            for (const r of result.rows) {
              console.log(Object.entries(r).map(([k,v]) => String(k)+'='+String(v)).join(' | '));
            }

            const detailSql = [
              "WITH active AS (",
              "  SELECT c.user_id, c.logical_account_key, c.id AS connection_id",
              "  FROM trading.trading_sessions ts",
              "  JOIN broker.broker_connections c ON c.id = ts.broker_connection_id",
              "  WHERE ts.status = 'ACTIVE'",
              "  ORDER BY ts.started_at DESC",
              "  LIMIT 1",
              "), rows AS (",
              "  SELECT a.allocated_capital, a.allocated_lots, a.instrument, a.direction,",
              "         a.strategy_code, i.status AS intent_status, t.status AS trade_status",
              "  FROM trading.capital_allocations a",
              "  JOIN active x ON x.user_id = a.user_id AND x.logical_account_key = a.logical_account_key",
              "  LEFT JOIN trading.trade_intents i ON i.id = a.trade_intent_id",
              "  LEFT JOIN trading.trades t ON t.trade_intent_id = a.trade_intent_id",
              "  WHERE a.status = 'ACTIVE'",
              ")",
              "SELECT",
              "  COALESCE(SUM(CASE WHEN trade_status IS NULL AND intent_status='CREATED' THEN allocated_capital ELSE 0 END),0)::text AS inflight,",
              "  COALESCE(SUM(CASE WHEN trade_status='PENDING' THEN allocated_capital ELSE 0 END),0)::text AS pending,",
              "  COALESCE(SUM(CASE WHEN trade_status IN ('OPEN','RECONCILIATION_PENDING') THEN allocated_capital ELSE 0 END),0)::text AS open,",
              "  COUNT(*)::text AS active_allocation_rows",
              "FROM rows"
            ].join("\n");
            const detail = await client.query(detailSql);
            console.log('=== ACTIVE SESSION COMMITMENTS ===');
            console.log(Object.entries(detail.rows[0] || {}).map(([k,v]) => String(k)+'='+String(v)).join(' | '));

            const budgetDetail = await client.query([
              "SELECT",
              "  b.total_capital::text AS budget,",
              "  b.account_currency,",
              "  length(b.account_currency)::text AS currency_len,",
              "  octet_length(b.account_currency)::text AS currency_bytes",
              "FROM trading.capital_budgets b",
              "JOIN trading.trading_sessions ts ON ts.status='ACTIVE'",
              "JOIN broker.broker_connections c ON c.id=ts.broker_connection_id",
              "WHERE b.user_id=c.user_id AND b.logical_account_key=c.logical_account_key",
              "ORDER BY ts.started_at DESC LIMIT 1"
            ].join("\n"));
            console.log('=== ACTIVE SESSION BUDGET DETAIL ===');
            console.log(Object.entries(budgetDetail.rows[0] || {}).map(([k,v]) => String(k)+'='+String(v)).join(' | '));

            await client.end();
          })().catch(err => {
            console.error(
              'diagnostic_db_error=' +
              (err?.message || String(err)).replace(/[A-Za-z0-9]{20,}/g,'[redacted]')
            );
            process.exit(1);
          });
          NODE

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dotenv = require('dotenv');
          const jwt = require('jsonwebtoken');
          const { Client } = require('pg');
          const env = dotenv.parse(fs.readFileSync(path.join(process.cwd(), '.env')));

          (async () => {
            const client = new Client({
              host: env.DB_HOST || 'localhost',
              port: Number(env.DB_PORT || 5432),
              database: env.DB_NAME || 'irexpro_dev',
              user: env.DB_USER || 'irexpro',
              password: env.DB_PASSWORD,
              ssl: env.DB_SSL === 'true' ? { rejectUnauthorized: false } : false,
            });
            await client.connect();
            const q = await client.query([
              "SELECT u.id AS user_id, u.email, u.session_version, c.id AS connection_id",
              "FROM trading.trading_sessions ts",
              "JOIN broker.broker_connections c ON c.id = ts.broker_connection_id",
              "JOIN identity.users u ON u.id = c.user_id",
              "WHERE ts.status = 'ACTIVE'",
              "ORDER BY ts.started_at DESC LIMIT 1"
            ].join("\n"));
            await client.end();
            if (!q.rows[0]) throw new Error('no active session user found');

            const row = q.rows[0];
            const token = jwt.sign(
              {
                sub: row.user_id,
                email: row.email || null,
                roles: [],
                tokenType: 'access',
                sessionVersion: Number(row.session_version || 0),
              },
              env.JWT_SECRET,
              { algorithm: 'HS256', expiresIn: '2m', jwtid: 'staging-allocation-diagnostic' },
            );

            const url =
              'http://127.0.0.1:3010/api/v1/execution/capital-allocation?brokerConnectionId=' +
              encodeURIComponent(row.connection_id);
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
            });
            const body = await response.text();
            const safe = body
              .replace(/[0-9a-f]{8}-[0-9a-f-]{27,}/gi, '[uuid]')
              .replace(/[A-Za-z0-9_-]{40,}/g, '[redacted]');
            console.log('=== ACTIVE SESSION ALLOCATION ENDPOINT ===');
            console.log('status=' + response.status);
            console.log('body=' + safe.slice(0, 1200));
          })().catch(err => {
            console.error(
              'endpoint_diagnostic_error=' +
              (err?.message || String(err)).replace(/[A-Za-z0-9]{20,}/g,'[redacted]')
            );
            process.exit(1);
          });
          NODE

          cd ../..
          echo '=== RECENT ALLOCATION/RECONCILIATION ERRORS ==='
          pm2 logs "$api_id" --nostream --lines 800 2>/dev/null \
            | grep -E 'ALLOCATION_|Capital allocation|PAPER_SIMULATOR_STATE_RESET|Account snapshot acceptance failed|capital-allocation' \
            | tail -n 100 \
            | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27,}/[uuid]/gi' || true
          REMOTE

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
