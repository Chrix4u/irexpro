name: First Six-Pair Research

on:
  workflow_dispatch:
    inputs:
      target_rows:
        description: 'Real M1 rows per pair'
        required: false
        default: '50000'
      max_lookback_days:
        description: 'Maximum Dukascopy lookback days'
        required: false
        default: '180'
      max_splits:
        description: 'Walk-forward fold limit'
        required: false
        default: '3'
  push:
    branches: [main]
    paths:
      - '.github/workflows/first-six-pair-research.yml'

permissions:
  contents: read

concurrency:
  group: first-six-pair-research
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  TARGET_ROWS: ${{ github.event.inputs.target_rows || '50000' }}
  MAX_LOOKBACK_DAYS: ${{ github.event.inputs.max_lookback_days || '180' }}
  MAX_SPLITS: ${{ github.event.inputs.max_splits || '3' }}

jobs:
  research:
    name: Real Dukascopy six-pair walk-forward study
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: services/ai-engine/requirements.lock

      - name: Install locked AI runtime
        working-directory: services/ai-engine
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Run real six-pair research study
        working-directory: services/ai-engine
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -Eeuo pipefail
          python -m app.domain.training.run_first_six_pair \
            --source dukascopy \
            --output-dir research/first-six-pair-run \
            --target-rows "$TARGET_ROWS" \
            --dukascopy-max-lookback-days "$MAX_LOOKBACK_DAYS" \
            --horizons 1,5,10 \
            --max-splits "$MAX_SPLITS"

      - name: Verify research outputs exist
        working-directory: services/ai-engine
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s research/first-six-pair-run/reports/six_pair_walkforward_summary.json
          find research/first-six-pair-run/raw -name '*_M1.csv' -type f | grep -q .
          find research/first-six-pair-run/corpora -name '*_MTF.csv' -type f | grep -q .

      - name: Upload corpus and walk-forward evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-six-pair-real-corpus-${{ github.run_id }}
          path: services/ai-engine/research/first-six-pair-run
          if-no-files-found: error
          retention-days: 14
