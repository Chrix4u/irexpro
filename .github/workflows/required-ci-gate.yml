name: Required CI Gate

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: required-ci-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  REQUIRED_WORKFLOW_POLL_SECONDS: '15'
  REQUIRED_WORKFLOW_TIMEOUT_SECONDS: '2400'
  REQUIRED_GATE_API_RETRY_ATTEMPTS: '5'
  REQUIRED_GATE_API_RETRY_BASE_SECONDS: '2'
  REQUIRED_GATE_API_RETRY_MAX_SECONDS: '20'

jobs:
  required-ci-gate:
    name: Required CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Test required-workflow path matrix
        run: node scripts/security/required-ci-gate.mjs --self-test

      - name: Test transient API retry classifier
        run: node scripts/security/required-ci-gate-runner.mjs --self-test

      - name: Test main ruleset policy verifier
        run: node scripts/security/verify-main-ruleset.mjs --self-test

      - name: Test workflow container digest policy
        run: node scripts/security/check-workflow-container-digests.mjs --self-test

      - name: Enforce workflow container digest policy
        run: node scripts/security/check-workflow-container-digests.mjs

      - name: Wait for applicable exact-head workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/security/required-ci-gate-runner.mjs
