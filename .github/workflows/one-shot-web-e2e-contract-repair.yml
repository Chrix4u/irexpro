name: One-shot Web E2E contract repair

on:
  push:
    branches:
      - fix/trade-read-resilience-20261005
    paths:
      - .github/workflows/one-shot-web-e2e-contract-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic E2E contract repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          trade = Path('apps/web/e2e/dynamic-trader-cockpit.spec.ts')
          text = trade.read_text()
          replacements = [
              ('  currentPrice: "1.10420000",\n  unrealisedPnl: "41.00",', '  currentPrice: "1.10420000",\n  markSource: "STREAM",\n  markObservedAt: "2026-08-31T01:00:15.000Z",\n  unrealisedPnl: "41.00",'),
              ('      page.getByRole("heading", { level: 2, name: "AI Engine Monitor" }),', '      page.getByRole("heading", { level: 2, name: "Live Market Intelligence" }),'),
              ('    await expect(\n      page.getByText("54.00% / 60.00% required", { exact: true }),\n    ).toBeVisible();', '    await expect(page.getByText("54.00%", { exact: true })).toBeVisible();\n    await expect(page.getByText("60.00% gate", { exact: true })).toBeVisible();'),
              ('    await expect(page.getByText("UNAVAILABLE", { exact: true })).toBeVisible();', '    await expect(\n      page\n        .getByLabel("Trading snapshot")\n        .getByText("UNAVAILABLE", { exact: true }),\n    ).toBeVisible();'),
              ('    await page.getByRole("button", { name: "Start AI Trading" }).click();\n\n    const dialog = page.getByRole("alertdialog", { name: "Start AI Trading?" });', '    await expect(\n      page.getByLabel("AI capital pool breakdown").getByText("2,250.00 USD", { exact: true }),\n    ).toBeVisible();\n    await page.getByRole("button", { name: "Start AI Trading" }).click();\n\n    const dialog = page.getByRole("alertdialog", { name: "Start AI Trading?" });'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'dynamic-trader replacement expected 1 match, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)
          trade.write_text(text)

          fixtures = Path('apps/web/e2e/fixtures.ts')
          text = fixtures.read_text()
          marker = '    // ── Subscriptions / payments (defensive — not exercised by target pages) ──\n'
          insert = '''    // ── Performance fees / payments ─────────────────────────────────────\n    // The responsive Fees & Payments workspace consumes these read-only\n    // contracts on initial load. Keep the fixtures structurally truthful so\n    // the page exercises its normal empty state rather than the catch-all {}.\n    if (apiPath === "performance-fees/me/summary") {\n      return route.fulfill(\n        jsonFulfill(200, { performance: null, assessments: [] }),\n      );\n    }\n    if (apiPath === "performance-fees/invoices") {\n      return route.fulfill(jsonFulfill(200, []));\n    }\n    if (apiPath === "performance-fees/me/simulation") {\n      return route.fulfill(\n        jsonFulfill(200, { mode: "TEST_ONLY", paymentEnabled: false, accounts: [] }),\n      );\n    }\n\n    // ── Subscriptions / payments ─────────────────────────────────────────\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'fixtures marker expected 1 match, got {text.count(marker)}')
          fixtures.write_text(text.replace(marker, insert, 1))
          PY
          git diff --check

      - name: Commit repaired fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "irexpro-ci-repair"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/e2e/dynamic-trader-cockpit.spec.ts apps/web/e2e/fixtures.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(web): align E2E fixtures with current contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
