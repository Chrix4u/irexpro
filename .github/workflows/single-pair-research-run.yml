name: Single Pair Research Run

on:
  workflow_run:
    workflows: ['Staging Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
  STAGING_SSH_HOST: vps.lightworldtech.com
  STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
  STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
  SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

jobs:
  research:
    name: USDJPY v4 fresh-data qualification and future holdout
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: irexpro-single-pair-research
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: staging

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify candidate and research relevance
        id: relevance
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --quiet --no-tags origin main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$(git rev-parse origin/main)" != "$CANDIDATE_SHA" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "SINGLE_PAIR_RESEARCH_SKIPPED reason=candidate_superseded"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parent_sha="$(git rev-parse "$CANDIDATE_SHA^1" 2>/dev/null || true)"
          if [[ ! "$parent_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "SINGLE_PAIR_RESEARCH_REQUIRED reason=parent_unavailable_fail_safe"
            exit 0
          fi
          changed="$(git diff --name-only "$parent_sha" "$CANDIDATE_SHA")"
          if grep -Eq '^(\.github/workflows/single-pair-research-run\.yml|services/ai-engine/app/domain/(training|models)/|services/ai-engine/(pyproject\.toml|requirements\.lock)$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "SINGLE_PAIR_RESEARCH_REQUIRED reason=model_or_research_input_change"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "SINGLE_PAIR_RESEARCH_SKIPPED reason=no_model_or_research_input_change"
          fi

      - name: Configure pinned SSH identity
        if: steps.relevance.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Run fresh USDJPY v4 study
        if: steps.relevance.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- $CANDIDATE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          candidate_sha="$1"
          staging='/home/lightworld/webapps/irexpro-staging'
          research_root='/home/lightworld/research/irexpro-usdjpy-v4'
          output="$research_root/$candidate_sha"
          raw="$output/raw/USDJPY_M1.csv"
          corpus="$output/corpora/USDJPY_MTF.csv"
          qualification="$output/qualification.json"
          future_report="$output/future-holdout.json"
          cache='/home/lightworld/research/dukascopy-raw-cache'
          effective_before_file="$output/effective-before.txt"
          readonly pair='USDJPY'
          readonly horizon='1'
          readonly fresh_holdout_start='2026-09-22T18:00:00Z'

          cd "$staging"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test -z "$(git status --porcelain)"

          cd "$staging/services/ai-engine"
          python_bin='.venv/bin/python'
          test -x "$python_bin"
          export PYTHONPATH="$PWD"
          export IREXPRO_XGB_N_JOBS=4

          runtime_profile="$("$python_bin" - <<'PY'
          from app.domain.models.multitimeframe_features import MULTITIMEFRAME_RUNTIME_PROFILE
          print(MULTITIMEFRAME_RUNTIME_PROFILE)
          PY
          )"
          if [[ "$runtime_profile" != 'multitimeframe_v4' ]]; then
            echo "SINGLE_PAIR_RESEARCH_HOLD reason=unexpected_runtime_profile profile=$runtime_profile"
            exit 0
          fi

          install -d -m 700 "$output/raw" "$output/corpora" "$cache"
          if [[ ! -s "$effective_before_file" ]]; then
            date -u '+%Y-%m-%dT%H:00:00Z' > "$effective_before_file.tmp"
            chmod 600 "$effective_before_file.tmp"
            mv -f "$effective_before_file.tmp" "$effective_before_file"
          fi
          effective_before="$(tr -d '[:space:]' < "$effective_before_file")"
          echo "FRESH_DATA_EFFECTIVE_BEFORE $effective_before"

          if [[ ! -s "$raw" ]]; then
            "$python_bin" -m app.domain.training.collect_dukascopy \
              --instrument "$pair" \
              --target-rows 100000 \
              --output "$raw" \
              --max-lookback-days 180 \
              --parallelism 4 \
              --cache-dir "$cache" \
              --effective-before "$effective_before"
          fi

          if [[ ! -s "$corpus" ]]; then
            "$python_bin" -m app.domain.training.multitimeframe_corpus \
              --m1-dataset "$raw" \
              --instrument "$pair" \
              --output "$corpus" \
              --source dukascopy_frozen_current
          fi

          set +e
          "$python_bin" - "$corpus" "$fresh_holdout_start" <<'PY'
          import sys
          import pandas as pd
          path, boundary = sys.argv[1], pd.Timestamp(sys.argv[2])
          frame = pd.read_csv(path, usecols=['decision_time'])
          times = pd.to_datetime(frame['decision_time'], utc=True, errors='raise')
          fresh = times[times >= boundary]
          print('FRESH_CORPUS_ROWS', len(frame))
          print('FRESH_HOLDOUT_RAW_ROWS', len(fresh))
          print('FRESH_CORPUS_START', times.min().isoformat())
          print('FRESH_CORPUS_END', times.max().isoformat())
          if len(fresh) < 2500:
              raise SystemExit(42)
          PY
          status="$?"
          set -e
          if [[ "$status" == '42' ]]; then
            echo "SINGLE_PAIR_RESEARCH_HOLD reason=insufficient_genuinely_future_rows minimum=2500"
            exit 0
          fi
          if [[ "$status" != '0' ]]; then
            exit "$status"
          fi

          if [[ ! -s "$qualification" ]]; then
            "$python_bin" -m app.domain.training.single_pair_qualification \
              --dataset "$pair=$corpus" \
              --horizon-bars "$horizon" \
              --decision-time-before "$fresh_holdout_start" \
              --report "$qualification" \
              --max-splits 3 \
              --confidence-floor 0.60 \
              | tee "$output/qualification-summary.json"
          fi

          qualification_pass="$("$python_bin" - "$qualification" <<'PY'
          import json, sys
          e=json.load(open(sys.argv[1]))['experiments']['event_barrier_pair_experts']
          g=e['research_gate']
          print('true' if g['research_gate_passed'] else 'false')
          PY
          )"
          "$python_bin" - "$qualification" <<'PY'
          import json, sys
          e=json.load(open(sys.argv[1]))['experiments']['event_barrier_pair_experts']
          g=e['research_gate']
          status='PASS' if g['research_gate_passed'] else 'HOLD'
          print(f'USDJPY_V4_QUALIFICATION_{status}')
          print('OBSERVED', json.dumps(g['observed'], sort_keys=True))
          print('CHECKS', json.dumps(g['checks'], sort_keys=True))
          print('ACTIVE_TRADES', e['overall']['active_trades'])
          print('WARNINGS', json.dumps(e['overall'].get('evidence_sufficiency_warnings', [])))
          PY

          if [[ "$qualification_pass" != 'true' ]]; then
            echo "USDJPY_V4_STOP reason=pre_holdout_qualification_failed"
            exit 0
          fi

          if [[ ! -s "$future_report" ]]; then
            "$python_bin" -m app.domain.training.single_pair_final_test \
              --dataset "$pair=$corpus" \
              --horizon-bars "$horizon" \
              --qualification-report "$qualification" \
              --report "$future_report" \
              --confidence-threshold 0.60 \
              --future-holdout-start "$fresh_holdout_start" \
              --min-future-holdout-rows 2500 \
              | tee "$output/future-holdout-summary.json"
          fi

          "$python_bin" - "$future_report" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))
          g=r['final_test_gate']
          status='PASS' if g['passed'] else 'HOLD'
          print(f'USDJPY_V4_FUTURE_HOLDOUT_{status}')
          print('OBSERVED', json.dumps(g['observed'], sort_keys=True))
          print('CHECKS', json.dumps(g['checks'], sort_keys=True))
          print('HOLDOUT_ROWS', r['split']['holdout_rows'])
          print('HOLDOUT_START', r['split']['holdout_start'])
          print('HOLDOUT_END', r['split']['holdout_end'])
          print('APPROVED_FOR_PAPER', r['approved_for_paper'])
          print('APPROVED_FOR_LIVE', r['approved_for_live'])
          PY
          REMOTE

      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
