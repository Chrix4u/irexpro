name: Database Migration Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/database/migrations/**'
      - 'apps/api/scripts/validate-uuid-bridge.ts'
      - 'apps/api/scripts/validate-migration-scenario-d.ts'
      - 'apps/api/scripts/validate-migration-scenario-e.ts'
      - 'apps/api/scripts/validate-migration-scenario-f.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/db-migration-compat.yml'

permissions:
  contents: read

concurrency:
  group: db-migration-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  real-postgres-uuid-ossp:
    name: Real PostgreSQL 16 + uuid-ossp (Scenario D)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PG_HOST: localhost
      PG_PORT: '5432'
      PG_USER: postgres
      PG_PASSWORD: ci_disposable_password
      PG_DB: irexpro_migration_test

    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55 # Docker Official Image
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: irexpro_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irexpro_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Scenario D validation (real PG + uuid-ossp)
        working-directory: apps/api
        run: pnpm exec ts-node scripts/validate-migration-scenario-d.ts
        env:
          DB_HOST: ${{ env.PG_HOST }}
          DB_PORT: ${{ env.PG_PORT }}
          DB_USER: ${{ env.PG_USER }}
          DB_PASSWORD: ${{ env.PG_PASSWORD }}
          DB_NAME: ${{ env.PG_DB }}

      - name: Upload validation log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: db-migration-scenario-d-log
          path: apps/api/scenario-d-output.log
          if-no-files-found: ignore
          retention-days: 7

  existing-db-upgrade:
    name: Existing PostgreSQL 16 Upgrade (Scenario E)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PG_HOST: localhost
      PG_PORT: '5432'
