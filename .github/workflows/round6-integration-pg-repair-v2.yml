name: Round 6 Integration PG Repair V2

on:
  push:
    branches:
      - ci/github-round6-verification

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: irexpro_risk_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irexpro_risk_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ci/github-round6-verification
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact candidate dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic fixture repair
        run: python3 .github/scripts/round6-pg-repair.py

      - name: Format repaired files
        working-directory: apps/api
        run: >-
          pnpm exec prettier --write
          src/database/migrations/1754400000000-AddTradeAuthorityLinkage.ts
          src/database/migrations/1754400000000-TradeIntentRound6LiveCompletion.ts
          src/database/migrations/1754500000000-PortfolioAllocationRound6LiveCompletion.ts
          src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts
          src/modules/execution/execution.pg-integration.spec.ts
          src/modules/execution/execution-session.pg-integration.spec.ts

      - name: Create isolated migration database
        env:
          PGPASSWORD: ci_disposable_password
        run: createdb -h localhost -U postgres irexpro_migration_repair

      - name: Validate fresh migration chain
        working-directory: apps/api
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: ci_disposable_password
          PG_DB: irexpro_migration_repair
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_disposable_password
          DB_NAME: irexpro_migration_repair
        run: pnpm exec ts-node scripts/validate-migration-scenario-d.ts

      - name: Validate affected real PostgreSQL suites
        working-directory: apps/api
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_disposable_password
          DB_NAME: irexpro_risk_concurrency
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          COOKIE_SECRET: test_cookie_secret_min_16
        run: >-
          pnpm exec jest --config ./test/jest-pg.json --runInBand
          src/modules/execution/execution.pg-integration.spec.ts
          src/modules/execution/execution-session.pg-integration.spec.ts
          src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts

      - name: Validate API lint and build
        run: |
          pnpm --filter @irexpro/api lint
          pnpm --filter @irexpro/api build
          git diff --check

      - name: Commit verified repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/round6-integration-pg-repair.yml
          git rm .github/workflows/round6-integration-pg-repair-v2.yml
          git rm .github/scripts/round6-pg-repair.py
          git add apps/api/src/database/migrations/1754400000000-AddTradeAuthorityLinkage.ts \
                  apps/api/src/database/migrations/1754400000000-TradeIntentRound6LiveCompletion.ts \
                  apps/api/src/database/migrations/1754500000000-PortfolioAllocationRound6LiveCompletion.ts \
                  apps/api/src/modules/broker/authorization/broker-authorization.pg-integration.spec.ts \
                  apps/api/src/modules/execution/execution.pg-integration.spec.ts \
                  apps/api/src/modules/execution/execution-session.pg-integration.spec.ts
          git diff --cached --check
          git commit -m 'test: reconcile Round 6 PostgreSQL fixtures after integration'
          git push origin HEAD:ci/github-round6-verification
