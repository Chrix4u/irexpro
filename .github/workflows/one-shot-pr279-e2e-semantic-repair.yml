name: One-shot PR279 E2E semantic repair

on:
  push:
    branches:
      - fix/trade-read-resilience-20261005
    paths:
      - .github/workflows/one-shot-pr279-e2e-semantic-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-read-resilience-20261005
          fetch-depth: 0
      - name: Repair stale Playwright assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/e2e/dynamic-trader-cockpit.spec.ts')
          text = path.read_text()

          old_universe = '    await expect(page.getByText(/EURUSD.*GBPUSD.*USDJPY/i)).toBeVisible();'
          new_universe = '''    await expect(\n      page\n        .locator(".ai-control-card__label")\n        .filter({ hasText: /EURUSD.*GBPUSD.*USDJPY/i })\n        .first(),\n    ).toBeVisible();'''
          if old_universe not in text:
              raise SystemExit('instrument-universe assertion not found')
          text = text.replace(old_universe, new_universe, 1)

          old_metrics = '''    const rows = metrics.locator(":scope > div");\n    await expect(rows).toHaveCount(6);\n\n    const boxes = await Promise.all(\n      Array.from({ length: 6 }, (_, index) => rows.nth(index).boundingBox()),\n    );'''
          new_metrics = '''    const rows = metrics.locator(":scope > div");\n    const metricLabels = [\n      "Entry",\n      "Current",\n      "Peak P&L",\n      "Profit give-back",\n      "Worst excursion",\n      "Stop loss",\n      "Take profit",\n      "Commission",\n      "Swap",\n    ];\n    for (const label of metricLabels) {\n      await expect(metrics.getByText(label, { exact: true })).toBeVisible();\n    }\n\n    const rowCount = await rows.count();\n    expect(rowCount).toBe(metricLabels.length);\n    const boxes = await Promise.all(\n      Array.from({ length: rowCount }, (_, index) => rows.nth(index).boundingBox()),\n    );'''
          if old_metrics not in text:
              raise SystemExit('metric-row assertion not found')
          text = text.replace(old_metrics, new_metrics, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/one-shot-pr279-e2e-semantic-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/dynamic-trader-cockpit.spec.ts .github/workflows/one-shot-pr279-e2e-semantic-repair.yml
          git diff --cached --check
          git commit -m "test(web): make trader cockpit E2E assertions semantic"
          git push origin HEAD:fix/trade-read-resilience-20261005
