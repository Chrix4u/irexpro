name: Disconnect Authority Reason One-Shot

on:
  push:
    branches: [fix/disconnect-authority-reason]
    paths:
      - '.github/workflows/disconnect-authority-reason-one-shot.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/disconnect-authority-reason
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply narrow disconnect reason correction
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('apps/api/src/modules/broker/broker.service.ts')
          service = service_path.read_text()
          old = """    try {\n      await this.tradingAuthorityService.bumpGeneration(userId, 'BROKER_AUTHORIZATION_REVOKED');\n      await this.grantInvalidation.invalidateUserNewExposureAuthority(\n        userId,\n        'BROKER_AUTHORIZATION_REVOKED',\n      );\n    } catch (err) {\n      this.logger.error(\n        `Authority invalidation after disconnect failed for user ${userId} ` +\n"""
          new = """    try {\n      await this.tradingAuthorityService.bumpGeneration(userId, 'BROKER_CONNECTION_DISCONNECTED');\n      await this.grantInvalidation.invalidateUserNewExposureAuthority(\n        userId,\n        'BROKER_CONNECTION_DISCONNECTED',\n      );\n    } catch (err) {\n      this.logger.error(\n        `Authority invalidation after disconnect failed for user ${userId} ` +\n"""
          if service.count(old) != 1:
              raise SystemExit(f'expected exactly one disconnect invalidation block, found {service.count(old)}')
          service_path.write_text(service.replace(old, new, 1))

          spec_path = Path('apps/api/src/modules/broker/authorization/broker-authorization-lifecycle.spec.ts')
          spec = spec_path.read_text()
          anchor = """    it('disconnectBroker guards the write on the loaded authorization state', async () => {\n      connectionRepo.findOne.mockResolvedValue(\n        baseConnection({\n          status: BrokerConnectionStatus.CONNECTED,\n          authorizationStatus: BrokerAuthorizationStatus.ACTIVE,\n        }),\n      );\n      connectionRepo.update.mockResolvedValue({ affected: 0 }); // concurrent writer won\n\n      await expect(service.disconnectBroker('conn-1', 'user-1')).rejects.toThrow(ConflictException);\n      expect(connectionRepo.update).toHaveBeenCalledTimes(1);\n    });\n"""
          replacement = """    it('disconnectBroker invalidates NEW-exposure authority with the explicit disconnect reason', async () => {\n      connectionRepo.findOne.mockResolvedValue(\n        baseConnection({\n          status: BrokerConnectionStatus.CONNECTED,\n          authorizationStatus: BrokerAuthorizationStatus.ACTIVE,\n        }),\n      );\n\n      await service.disconnectBroker('conn-1', 'user-1');\n\n      expect(authorityBump).toHaveBeenCalledWith('user-1', 'BROKER_CONNECTION_DISCONNECTED');\n      expect(authorityInvalidate).toHaveBeenCalledWith(\n        'user-1',\n        'BROKER_CONNECTION_DISCONNECTED',\n      );\n    });\n\n    it('disconnectBroker guards the write on the loaded authorization state', async () => {\n      connectionRepo.findOne.mockResolvedValue(\n        baseConnection({\n          status: BrokerConnectionStatus.CONNECTED,\n          authorizationStatus: BrokerAuthorizationStatus.ACTIVE,\n        }),\n      );\n      connectionRepo.update.mockResolvedValue({ affected: 0 }); // concurrent writer won\n\n      await expect(service.disconnectBroker('conn-1', 'user-1')).rejects.toThrow(ConflictException);\n      expect(connectionRepo.update).toHaveBeenCalledTimes(1);\n      expect(authorityBump).not.toHaveBeenCalled();\n      expect(authorityInvalidate).not.toHaveBeenCalled();\n    });\n"""
          if spec.count(anchor) != 1:
              raise SystemExit(f'expected one disconnect guard test anchor, found {spec.count(anchor)}')
          spec_path.write_text(spec.replace(anchor, replacement, 1))

      - name: Format changed files
        run: pnpm --filter @irexpro/api exec prettier --write apps/api/src/modules/broker/broker.service.ts apps/api/src/modules/broker/authorization/broker-authorization-lifecycle.spec.ts

      - name: Run focused lifecycle suite
        run: pnpm --filter @irexpro/api exec jest src/modules/broker/authorization/broker-authorization-lifecycle.spec.ts --runInBand --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          COOKIE_SECRET: test_cookie_secret_min_16

      - name: Strict API lint
        run: pnpm api:lint

      - name: API build
        run: pnpm api:build

      - name: Verify diff
        run: git diff --check

      - name: Commit verified correction and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/disconnect-authority-reason-one-shot.yml
          git add apps/api/src/modules/broker/broker.service.ts \
                  apps/api/src/modules/broker/authorization/broker-authorization-lifecycle.spec.ts \
                  .github/workflows/disconnect-authority-reason-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: distinguish broker disconnect authority invalidation'
          git push origin HEAD:fix/disconnect-authority-reason
