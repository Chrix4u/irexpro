name: Research - Pepperstone DEMO Strategy Evidence

on:
  push:
    branches:
      - fix/planb-clock-neutral-telemetry-20261111
    paths:
      - apps/api/scripts/research-owner-demo-post-stop-direction.cjs
      - apps/api/scripts/research-owner-demo-post-stop-direction.test.cjs
      - apps/api/scripts/run-owner-demo-post-stop-direction.cjs
      - apps/api/scripts/research-owner-demo-strategy-scorecard.cjs
      - apps/api/scripts/research-owner-demo-strategy-scorecard.test.cjs
      - apps/api/scripts/research-owner-demo-direction-horizons.cjs
      - apps/api/scripts/research-owner-demo-direction-horizons.test.cjs
      - apps/api/scripts/research-owner-demo-lot-ladder.cjs
      - apps/api/scripts/research-owner-demo-lot-ladder.test.cjs
      - apps/api/scripts/run-owner-demo-lot-ladder.cjs
      - apps/api/scripts/research-owner-demo-profit-lock-hold-validation.cjs
      - apps/api/scripts/research-owner-demo-profit-lock-hold-validation.test.cjs
      - apps/api/scripts/run-owner-demo-profit-lock-hold-validation.cjs
      - .github/workflows/research-post-stop-direction-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-research-classifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out research branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
      - name: Check syntax of research modules
        run: |
          node --check apps/api/scripts/research-owner-demo-post-stop-direction.cjs
          node --check apps/api/scripts/research-owner-demo-post-stop-direction.test.cjs
          node --check apps/api/scripts/run-owner-demo-post-stop-direction.cjs
          node --check apps/api/scripts/research-owner-demo-strategy-scorecard.cjs
          node --check apps/api/scripts/research-owner-demo-strategy-scorecard.test.cjs
          node --check apps/api/scripts/research-owner-demo-direction-horizons.cjs
          node --check apps/api/scripts/research-owner-demo-direction-horizons.test.cjs
          node --check apps/api/scripts/research-owner-demo-lot-ladder.cjs
          node --check apps/api/scripts/research-owner-demo-lot-ladder.test.cjs
          node --check apps/api/scripts/run-owner-demo-lot-ladder.cjs
          node --check apps/api/scripts/research-owner-demo-profit-lock-hold-validation.cjs
          node --check apps/api/scripts/research-owner-demo-profit-lock-hold-validation.test.cjs
          node --check apps/api/scripts/run-owner-demo-profit-lock-hold-validation.cjs
      - name: Validate broker price and three-strategy research summaries
        run: |
          node --test apps/api/scripts/research-owner-demo-post-stop-direction.test.cjs
          node --test apps/api/scripts/research-owner-demo-strategy-scorecard.test.cjs
          node --test apps/api/scripts/research-owner-demo-direction-horizons.test.cjs
          node --test apps/api/scripts/research-owner-demo-lot-ladder.test.cjs
          node --test apps/api/scripts/research-owner-demo-profit-lock-hold-validation.test.cjs
