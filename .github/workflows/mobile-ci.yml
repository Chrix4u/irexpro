name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - 'packages/types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/mobile-ci.yml'

  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - 'packages/types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_OFFLINE: '1'
  EXPO_PUBLIC_API_BASE_URL: 'http://127.0.0.1:3010/api/v1'

jobs:
  validate:
    name: Mobile Typecheck & Bundle Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Test shared API client contracts
        run: pnpm --filter @irexpro/api-client test

      - name: Verify configured Expo assets exist
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const config = require('./apps/mobile/app.json').expo;
          const assets = [
            ['icon', config.icon],
            ['splash.image', config.splash?.image],
            ['android.adaptiveIcon.foregroundImage', config.android?.adaptiveIcon?.foregroundImage],
          ];
          for (const [label, relative] of assets) {
            if (!relative || typeof relative !== 'string') {
              throw new Error(`Missing Expo asset configuration: ${label}`);
            }
            const resolved = path.resolve('apps/mobile', relative);
            if (!fs.existsSync(resolved) || !fs.statSync(resolved).isFile()) {
              throw new Error(`Configured Expo asset does not exist: ${label} -> ${relative}`);
            }
          }
          console.log(`Verified ${assets.length} configured Expo assets.`);
          NODE

      - name: Validate EAS release configuration
        run: pnpm --filter @irexpro/mobile validate:release-config

      - name: Validate Expo SDK dependency alignment
        run: pnpm --filter @irexpro/mobile exec expo install --check

      - name: Typecheck mobile app against shared workspace contracts
        run: pnpm --filter @irexpro/mobile typecheck

      - name: Export Android bundle with Metro
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform android
          --output-dir .ci-export-android
          --clear

      - name: Export iOS bundle with Metro
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform ios
          --output-dir .ci-export-ios
          --clear

      - name: Remove disposable Metro export directories
        if: always()
        run: rm -rf apps/mobile/.ci-export-android apps/mobile/.ci-export-ios
