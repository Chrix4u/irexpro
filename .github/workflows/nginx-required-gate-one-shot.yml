name: Nginx Required Gate One-Shot

on:
  push:
    branches: [fix/required-gate-nginx-policy]
    paths:
      - '.github/workflows/nginx-required-gate-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/required-gate-nginx-policy
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Patch Required CI nginx coverage
        shell: python
        run: |
          from pathlib import Path

          gate_path = Path('scripts/security/required-ci-gate.mjs')
          gate = gate_path.read_text()
          deployment_rule = """  {
    name: 'Deployment Script Safety',
    patterns: [
      'scripts/deployment/**',
      'docs/operations/staging-deployment.md',
      '.github/workflows/deployment-script-safety.yml',
    ],
  },
"""
          nginx_rule = deployment_rule + """  {
    name: 'Nginx Security Policy',
    patterns: [
      'infrastructure/nginx/**',
      'scripts/security/check-nginx-security-headers.mjs',
      'docs/runbooks/realtime-ingress-security.md',
      'docs/runbooks/reverse-proxy-client-ip-trust.md',
      'docs/runbooks/production-deployment-vps-webuzo.md',
      '.github/workflows/nginx-security-policy.yml',
    ],
  },
"""
          if gate.count(deployment_rule) != 1:
              raise SystemExit(f'expected one deployment gate rule, found {gate.count(deployment_rule)}')
          gate = gate.replace(deployment_rule, nginx_rule, 1)

          deployment_test = """  assertEqual(
    requiredWorkflowNames(['scripts/deployment/deploy-staging.sh']),
    ['Release Security', 'Deployment Script Safety'],
    'deployment change',
  );
"""
          nginx_test = deployment_test + """  assertEqual(
    requiredWorkflowNames(['infrastructure/nginx/irexpro.conf']),
    ['Release Security', 'Nginx Security Policy'],
    'nginx security change',
  );
"""
          if gate.count(deployment_test) != 1:
              raise SystemExit(f'expected one deployment self-test, found {gate.count(deployment_test)}')
          gate = gate.replace(deployment_test, nginx_test, 1)
          gate_path.write_text(gate)

          drift_path = Path('scripts/security/check-required-ci-trigger-drift.mjs')
          drift = drift_path.read_text()
          deployment_mapping = """  [
    'Deployment Script Safety',
    '.github/workflows/deployment-script-safety.yml',
  ],
"""
          nginx_mapping = deployment_mapping + """  ['Nginx Security Policy', '.github/workflows/nginx-security-policy.yml'],
"""
          if drift.count(deployment_mapping) != 1:
              raise SystemExit(f'expected one deployment workflow mapping, found {drift.count(deployment_mapping)}')
          drift = drift.replace(deployment_mapping, nginx_mapping, 1)

          mobile_assertions = """  assert(WORKFLOW_FILES.has('Mobile CI'), 'required workflow registry must include Mobile CI');
  assert(
    WORKFLOW_FILES.get('Mobile CI') === '.github/workflows/mobile-ci.yml',
    'Mobile CI workflow mapping must remain canonical',
  );
"""
          expanded_assertions = mobile_assertions + """  assert(
    WORKFLOW_FILES.has('Nginx Security Policy'),
    'required workflow registry must include Nginx Security Policy',
  );
  assert(
    WORKFLOW_FILES.get('Nginx Security Policy') === '.github/workflows/nginx-security-policy.yml',
    'Nginx Security Policy workflow mapping must remain canonical',
  );
"""
          if drift.count(mobile_assertions) != 1:
              raise SystemExit(f'expected one workflow registry assertion block, found {drift.count(mobile_assertions)}')
          drift = drift.replace(mobile_assertions, expanded_assertions, 1)
          drift_path.write_text(drift)

      - name: Required CI gate self-tests
        run: node scripts/security/required-ci-gate.mjs --self-test

      - name: Trigger drift self-tests
        run: node scripts/security/check-required-ci-trigger-drift.mjs --self-test

      - name: Enforce path-contract drift check
        run: node scripts/security/check-required-ci-trigger-drift.mjs

      - name: Verify diff
        run: git diff --check

      - name: Commit verified correction and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/nginx-required-gate-one-shot.yml
          git add scripts/security/required-ci-gate.mjs \
                  scripts/security/check-required-ci-trigger-drift.mjs \
                  .github/workflows/nginx-required-gate-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: require nginx security policy in aggregate gate'
          git push origin HEAD:fix/required-gate-nginx-policy
