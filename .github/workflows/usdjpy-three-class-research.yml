name: USDJPY Three-Class Research

on:
  workflow_run:
    workflows: ['Staging Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
  STAGING_SSH_HOST: vps.lightworldtech.com
  STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
  STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
  SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

jobs:
  research:
    name: USDJPY SHORT-NO_TRADE-LONG bounded study
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: irexpro-usdjpy-three-class
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: staging

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify three-class relevance
        id: relevance
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --quiet --no-tags origin main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$(git rev-parse origin/main)" != "$CANDIDATE_SHA" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "THREE_CLASS_RESEARCH_SKIPPED reason=candidate_superseded"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parent_sha="$(git rev-parse "$CANDIDATE_SHA^1" 2>/dev/null || true)"
          changed="$(git diff --name-only "$parent_sha" "$CANDIDATE_SHA" || true)"
          if grep -Eq '^(\.github/workflows/usdjpy-three-class-research\.yml|services/ai-engine/app/domain/training/single_pair_three_class\.py|services/ai-engine/tests/test_single_pair_three_class\.py)$' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "THREE_CLASS_RESEARCH_REQUIRED"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "THREE_CLASS_RESEARCH_SKIPPED reason=no_three_class_change"
          fi

      - name: Configure pinned SSH identity
        if: steps.relevance.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Run bounded three-class study
        if: steps.relevance.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- $CANDIDATE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          candidate_sha="$1"
          staging='/home/lightworld/webapps/irexpro-staging'
          source_root='/home/lightworld/research/irexpro-usdjpy-v4/e346d27274b298d43a464a53c1473144f57c1f3f'
          corpus="$source_root/corpora/USDJPY_MTF.csv"
          output="/home/lightworld/research/irexpro-usdjpy-three-class/$candidate_sha"
          report="$output/report.json"

          cd "$staging"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test -z "$(git status --porcelain)"
          test -s "$corpus"

          cd "$staging/services/ai-engine"
          python_bin='.venv/bin/python'
          test -x "$python_bin"
          export PYTHONPATH="$PWD"
          export IREXPRO_XGB_N_JOBS=4
          install -d -m 700 "$output"

          "$python_bin" -m app.domain.training.single_pair_three_class \
            --dataset "$corpus" \
            --instrument USDJPY \
            --horizon-bars 1 \
            --holdout-start '2026-09-22T18:00:00Z' \
            --confidence-floor 0.60 \
            --report "$report" \
            | tee "$output/summary.json"

          "$python_bin" - "$report" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))
          q=r['qualification']
          print('USDJPY_THREE_CLASS_QUALIFICATION_' + ('PASS' if q['passed'] else 'HOLD'))
          print('QUALIFICATION_OBSERVED', json.dumps(q['observed'], sort_keys=True))
          print('QUALIFICATION_CHECKS', json.dumps(q['checks'], sort_keys=True))
          print('QUALIFICATION_ACTIVE_TRADES', q['active_trades'])
          print('QUALIFICATION_WARNINGS', json.dumps(q.get('warnings', [])))
          future=r.get('future_holdout')
          if future is None:
              print('USDJPY_THREE_CLASS_STOP reason=qualification_failed')
          else:
              g=future['gate']
              print('USDJPY_THREE_CLASS_FUTURE_HOLDOUT_' + ('PASS' if g['passed'] else 'HOLD'))
              print('FUTURE_OBSERVED', json.dumps(g['observed'], sort_keys=True))
              print('FUTURE_CHECKS', json.dumps(g['checks'], sort_keys=True))
              print('FUTURE_ROWS', future['rows'])
              print('FUTURE_START', future['start'])
              print('FUTURE_END', future['end'])
          print('APPROVED_FOR_PAPER', r['approved_for_paper'])
          print('APPROVED_FOR_LIVE', r['approved_for_live'])
          PY
          REMOTE

      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
