name: VPS Runbook Exact SHA One-Shot

on:
  push:
    branches: [docs/vps-exact-sha-release-baseline]
    paths:
      - '.github/workflows/vps-runbook-exact-sha-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: docs/vps-exact-sha-release-baseline
          fetch-depth: 0

      - name: Patch current release baseline and exact-SHA guidance
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('docs/runbooks/production-deployment-vps-webuzo.md')
          text = path.read_text()

          replacements = {
              '| Node.js | 20.x LTS (≥ 20.0.0) | NestJS API runtime |':
                  '| Node.js | 22.x LTS (verified CI/release baseline; app engines allow ≥ 20) | NestJS API runtime |',
              '| pnpm | 9.x (≥ 9.0.0) | Package manager (workspace) |':
                  '| pnpm | 10.34.5 (repository-pinned; app engines allow ≥ 9) | Package manager (workspace) |',
              '- [ ] Node.js 20.x LTS installed (`node -v`)':
                  '- [ ] Node.js 22.x LTS installed for release parity (`node -v`; package engines remain compatible with Node ≥ 20)',
              '- [ ] pnpm 9.x installed (`pnpm -v`)':
                  '- [ ] repository-pinned pnpm 10.34.5 available via Corepack (`corepack pnpm@10.34.5 --version`)',
              '- [ ] Node.js 20.x LTS + pnpm 9.x installed (`node -v`, `pnpm -v`)':
                  '- [ ] Node.js 22.x LTS + repository-pinned pnpm 10.34.5 verified (`node -v`, `corepack pnpm@10.34.5 --version`)',
              '- [ ] `git clone` from `main` works (`git checkout main && git pull --ff-only origin main`)':
                  '- [ ] the approved full candidate SHA is present in `origin/main` and is checked out detached exactly',
              '- [ ] Confirmed `git branch --show-current` reports `main`, not a sprint or feature branch.':
                  '- [ ] Confirmed `git rev-parse HEAD` equals the recorded approved candidate SHA and that SHA is contained in `origin/main`.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          source_pattern = re.compile(
              r"```bash\ncd /opt/irexpro\ngit checkout main\ngit pull --ff-only origin main\n"
              r"git rev-parse HEAD    # record this commit for rollback\n"
              r"git branch --show-current\n```\n\n"
              r"`git branch --show-current` must print `main`\. If it prints anything else, stop\n"
              r"and re-run the checkout step before proceeding\."
          )
          source_replacement = """```bash
          cd /opt/irexpro
          git fetch --quiet origin main
          CANDIDATE_SHA='<approved-40-character-lowercase-sha>'
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid candidate SHA' >&2; exit 1; }
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          git switch --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          ```

          A detached checkout is intentional for a production release. Record the exact
          candidate SHA before any build or runtime mutation; do not deploy a moving branch
          name or an unverified tag.
          """
          text, source_count = source_pattern.subn(source_replacement, text, count=1)
          if source_count != 1:
              raise SystemExit(f'expected one branch-based source checkout block, found {source_count}')

          rollback_pattern = re.compile(
              r"### 11\.1 Application rollback \(code revert\)\n\n```bash\ncd /opt/irexpro\n"
              r"git fetch --tags\n# Find the last known-good tag\ngit tag -l 'sprint-\*-complete'\n\n"
              r"# Checkout the previous stable tag \(e\.g\., sprint-18-complete\)\n"
              r"git checkout sprint-18-complete\npnpm install --frozen-lockfile\n"
              r"pnpm --filter @irexpro/api build\npm2 restart irexpro-api     # or: sudo systemctl restart irexpro-api\n```"
          )
          rollback_replacement = """### 11.1 Application rollback (exact verified SHA)

          Roll back only to a previously verified full commit SHA. The rollback target must
          be an ancestor of the failed release and must still be contained in `origin/main`.
          Do not discover rollback targets by sprint tag at incident time.

          ```bash
          cd /opt/irexpro
          FAILED_SHA="$(git rev-parse HEAD)"
          ROLLBACK_SHA='<previously-verified-40-character-lowercase-sha>'
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid rollback SHA' >&2; exit 1; }
          test "$FAILED_SHA" != "$ROLLBACK_SHA"
          git fetch --quiet origin main
          git cat-file -e "${ROLLBACK_SHA}^{commit}"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$FAILED_SHA"
          git merge-base --is-ancestor "$ROLLBACK_SHA" origin/main
          git switch --detach "$ROLLBACK_SHA"
          test "$(git rev-parse HEAD)" = "$ROLLBACK_SHA"
          corepack pnpm@10.34.5 install --frozen-lockfile
          corepack pnpm@10.34.5 --filter @irexpro/api build
          pm2 restart irexpro-api     # or: sudo systemctl restart irexpro-api
          test "$(git rev-parse HEAD)" = "$ROLLBACK_SHA"
          ```"""
          text, rollback_count = rollback_pattern.subn(rollback_replacement, text, count=1)
          if rollback_count != 1:
              raise SystemExit(f'expected one tag-based rollback block, found {rollback_count}')

          anchor = '| Certbot | latest | Let\'s Encrypt TLS certificates |\n'
          note = (
              anchor +
              '\n> **Verified release-toolchain note:** `package.json` keeps broad compatibility '
              'engines (`node >=20`, `pnpm >=9`), but repository CI and deterministic deployment '
              'procedures currently standardize releases on **Node.js 22.x** and the exact '
              '`packageManager` value **pnpm 10.34.5**. Production builds should match that '
              'verified baseline unless a separate candidate explicitly re-verifies another toolchain.\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one software table anchor, found {text.count(anchor)}')
          text = text.replace(anchor, note, 1)

          path.write_text(text)

      - name: Verify stale release instructions are removed
        shell: bash
        run: |
          set -Eeuo pipefail
          file='docs/runbooks/production-deployment-vps-webuzo.md'
          ! grep -Fq 'Node.js 20.x LTS + pnpm 9.x' "$file"
          ! grep -Fq 'git checkout sprint-18-complete' "$file"
          ! grep -Fq 'git branch --show-current` must print `main`' "$file"
          grep -Fq 'pnpm 10.34.5' "$file"
          grep -Fq "CANDIDATE_SHA='<approved-40-character-lowercase-sha>'" "$file"
          grep -Fq "ROLLBACK_SHA='<previously-verified-40-character-lowercase-sha>'" "$file"

      - name: Verify diff
        run: git diff --check

      - name: Commit verified runbook correction and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/vps-runbook-exact-sha-one-shot.yml
          git add docs/runbooks/production-deployment-vps-webuzo.md \
                  .github/workflows/vps-runbook-exact-sha-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: align VPS releases to verified exact-SHA baseline'
          git push origin HEAD:docs/vps-exact-sha-release-baseline
