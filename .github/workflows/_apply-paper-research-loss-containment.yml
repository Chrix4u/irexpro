name: One-shot PAPER research containment patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/paper-research-loss-containment-20261015'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paper-research-loss-containment-20261015
          fetch-depth: 0
      - name: Apply exact incident containment changes
        shell: python
        run: |
          from pathlib import Path
          import re

          throughput = Path('apps/api/src/modules/ai/paper-research-throughput.ts')
          text = throughput.read_text()
          old = """const ALLOWED_RESEARCH_EXPLORATION_BLOCKERS = new Set([\n  ...ALLOWED_RESEARCH_BLOCKERS,\n  'DRIFT_STRESSED',\n  'DRIFT_OUT_OF_DISTRIBUTION',\n]);"""
          new = """const ALLOWED_RESEARCH_EXPLORATION_BLOCKERS = ALLOWED_RESEARCH_BLOCKERS;"""
          assert old in text, 'throughput blocker allowlist shape changed'
          text = text.replace(old, new, 1)
          old_reason = """  } else if (input.netExpectedR < PAPER_RESEARCH_THROUGHPUT_MIN_NET_EXPECTED_R) {\n    reason = 'NET_EXPECTED_R_TOO_LOW';\n  } else if (\n"""
          new_reason = """  } else if (input.netExpectedR < PAPER_RESEARCH_THROUGHPUT_MIN_NET_EXPECTED_R) {\n    reason = 'NET_EXPECTED_R_TOO_LOW';\n  } else if (input.driftState !== 'NORMAL') {\n    reason = 'UNSAFE_BLOCKER';\n  } else if (\n"""
          assert old_reason in text, 'throughput reason chain shape changed'
          text = text.replace(old_reason, new_reason, 1)
          throughput.write_text(text)

          canary = Path('apps/api/src/modules/ai/rejected-edge-paper-canary.ts')
          text = canary.read_text()
          old = """const ALLOWED_RESEARCH_BLOCKERS = new Set([\n  'ENSEMBLE_NOT_PAPER_ADMITTED',\n  'ENSEMBLE_NOT_PROMOTABLE_ADMISSION',\n  'DRIFT_OUT_OF_DISTRIBUTION',\n  'DRIFT_STRESSED',\n]);"""
          new = """const ALLOWED_RESEARCH_BLOCKERS = new Set([\n  'ENSEMBLE_NOT_PAPER_ADMITTED',\n  'ENSEMBLE_NOT_PROMOTABLE_ADMISSION',\n]);"""
          assert old in text, 'canary blocker allowlist shape changed'
          canary.write_text(text.replace(old, new, 1))

          canary_spec = Path('apps/api/src/modules/ai/rejected-edge-paper-canary.spec.ts')
          text = canary_spec.read_text()
          old = """    paperExecutionBlockers: [\n      'ENSEMBLE_NOT_PAPER_ADMITTED',\n      'ENSEMBLE_NOT_PROMOTABLE_ADMISSION',\n      'DRIFT_OUT_OF_DISTRIBUTION',\n    ],"""
          new = """    paperExecutionBlockers: [\n      'ENSEMBLE_NOT_PAPER_ADMITTED',\n      'ENSEMBLE_NOT_PROMOTABLE_ADMISSION',\n    ],"""
          assert old in text, 'canary spec base candidate shape changed'
          canary_spec.write_text(text.replace(old, new, 1))

          throughput_spec = Path('apps/api/src/modules/ai/paper-research-throughput.spec.ts')
          text = throughput_spec.read_text()

          replacements = {
            'admits a controlled PAPER exploration sample when strict confidence is missed but economics and quality remain usable': """  it('keeps an out-of-distribution exploration sample shadow-only even when economics and quality remain usable', () => {
    expect(
      evaluatePaperResearchThroughput({
        ...base,
        confidence: 0.6,
        driftState: 'OUT_OF_DISTRIBUTION',
        directionQuality: 0.18,
        tradeQuality: 0.44,
        exitQuality: 0.43,
        paperExecutionBlockers: [...base.paperExecutionBlockers, 'DRIFT_OUT_OF_DISTRIBUTION'],
      }),
    ).toMatchObject({ eligible: false, reason: 'UNSAFE_BLOCKER' });
  });""",
            'admits a stronger positive-edge PAPER exploration sample at the bounded strong-edge structural floors': """  it('does not let strong modeled edge override out-of-distribution drift', () => {
    expect(
      evaluatePaperResearchThroughput({
        ...base,
        confidence: 0.6352,
        netExpectedR: 0.1699,
        driftState: 'OUT_OF_DISTRIBUTION',
        directionQuality: 0.1238,
        tradeQuality: 0.3342,
        exitQuality: 0.3223,
        paperExecutionBlockers: [...base.paperExecutionBlockers, 'DRIFT_OUT_OF_DISTRIBUTION'],
      }),
    ).toMatchObject({ eligible: false, reason: 'UNSAFE_BLOCKER' });
  });""",
            'accepts direction-confirmed PAPER exploration when fast aligned momentum covers a blind legacy direction score': """  it('does not let fast aligned momentum override out-of-distribution drift', () => {
    const liveDirectionConfirmedCandidate = {
      ...base,
      confidence: 0.6,
      netExpectedR: 0.0993,
      driftState: 'OUT_OF_DISTRIBUTION',
      directionQuality: 0,
      tradeQuality: 0.4059,
      exitQuality: 0.4018,
      alignedMomentumAtr: 1.0247,
      paperExecutionBlockers: [...base.paperExecutionBlockers, 'DRIFT_OUT_OF_DISTRIBUTION'],
    };
    expect(evaluatePaperResearchThroughput(liveDirectionConfirmedCandidate)).toMatchObject({
      eligible: false,
      reason: 'UNSAFE_BLOCKER',
    });
  });""",
            'allows stressed or out-of-distribution drift only through non-promotable exploration': """  it('keeps stressed and out-of-distribution drift shadow-only', () => {
    expect(
      evaluatePaperResearchThroughput({
        ...base,
        driftState: 'STRESSED',
        paperExecutionBlockers: [...base.paperExecutionBlockers, 'DRIFT_STRESSED'],
      }),
    ).toMatchObject({ eligible: false, reason: 'UNSAFE_BLOCKER' });
    expect(
      evaluatePaperResearchThroughput({
        ...base,
        driftState: 'OUT_OF_DISTRIBUTION',
        paperExecutionBlockers: [...base.paperExecutionBlockers, 'DRIFT_OUT_OF_DISTRIBUTION'],
      }),
    ).toMatchObject({ eligible: false, reason: 'UNSAFE_BLOCKER' });
  });""",
          }
          for title, body in replacements.items():
              pattern = re.compile(r"  it\('" + re.escape(title) + r"'.*?\n  \}\);", re.S)
              text, count = pattern.subn(body.rstrip(), text, count=1)
              assert count == 1, f'test block not found: {title}'
          throughput_spec.write_text(text)
      - name: Commit patched source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_apply-paper-research-loss-containment.yml
          git add apps/api/src/modules/ai/paper-research-throughput.ts \
                  apps/api/src/modules/ai/rejected-edge-paper-canary.ts \
                  apps/api/src/modules/ai/paper-research-throughput.spec.ts \
                  apps/api/src/modules/ai/rejected-edge-paper-canary.spec.ts
          git config user.name 'irexpro-incident-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Contain OOD PAPER research execution losses'
          git push origin HEAD:fix/paper-research-loss-containment-20261015
