name: iRexPro DEMO verified profit stop runner policy
on:
  push:
    branches: ['feat/demo-verified-positive-stop-runner-20261123']
  pull_request:
    paths:
      - 'apps/api/src/modules/execution/reconciliation/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-profit-stop-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: pnpm
      - name: Install scoped API dependencies
        run: pnpm install --frozen-lockfile --filter '@irexpro/api...'
      - name: Full API TypeScript check
        run: pnpm --filter @irexpro/api exec tsc --noEmit --incremental false -p tsconfig.build.json
      - name: Broker-verified protected runner and existing exit regressions
        run: pnpm --filter @irexpro/api exec jest src/modules/broker/broker-demo-profit-stop-gateway.spec.ts src/modules/execution/reconciliation/verified-profit-stop-runner-policy.spec.ts src/modules/execution/reconciliation/demo-profit-stop-amendment-state.spec.ts src/modules/execution/reconciliation/demo-profit-stop-authority-sync.service.spec.ts src/modules/execution/reconciliation/candle-aware-profit-patience-shadow.spec.ts src/modules/execution/reconciliation/live-demo-profit-protection.service.spec.ts --runInBand --silent --no-coverage
