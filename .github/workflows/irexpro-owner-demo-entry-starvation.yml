name: iRexPro owner DEMO entry blockage diagnostics

on:
  push:
    branches:
      - diagnostics/owner-demo-entry-blockers-20261119
      - fix/planb-clock-neutral-telemetry-20261111
  pull_request:
    paths:
      - apps/api/scripts/audit-owner-demo-entry-starvation.cjs
      - apps/api/scripts/audit-owner-demo-entry-starvation.test.cjs
      - .github/workflows/irexpro-owner-demo-entry-starvation.yml

permissions:
  contents: read

jobs:
  verify-read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner-only forensic code
        run: node --check apps/api/scripts/audit-owner-demo-entry-starvation.cjs
      - name: Verify layered blockers, pause state and time-window accuracy
        run: node --test apps/api/scripts/audit-owner-demo-entry-starvation.test.cjs
