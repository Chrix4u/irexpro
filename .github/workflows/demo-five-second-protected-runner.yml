name: iRexPro DEMO five-second protected runner
on:
  push:
    branches: ['feat/demo-five-second-protected-runner-20261123']
  pull_request:
    paths:
      - 'apps/api/src/modules/execution/reconciliation/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-second-protected-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install API dependency graph
        run: pnpm install --frozen-lockfile --filter '@irexpro/api...'
      - name: Type-check full API
        run: pnpm --filter @irexpro/api exec tsc --noEmit --incremental false -p tsconfig.build.json
      - name: Five-second owner-DEMO execution regressions
        run: pnpm --filter @irexpro/api exec jest src/modules/execution/reconciliation/demo-five-second-protected-runner.integration.spec.ts src/modules/execution/reconciliation/live-demo-profit-protection.service.spec.ts src/modules/execution/reconciliation/demo-protected-profit-runner-orchestrator.service.spec.ts src/modules/execution/reconciliation/verified-profit-stop-runner-policy.spec.ts src/modules/execution/reconciliation/demo-profit-stop-authority-sync.service.spec.ts src/modules/execution/reconciliation/candle-aware-profit-patience-shadow.spec.ts src/modules/broker/broker-demo-profit-stop-gateway.spec.ts --runInBand --silent --no-coverage
      - name: Build exact source API dist
        run: pnpm --filter @irexpro/api build
      - name: Package immutable disabled-by-default release
        run: |
          mkdir -p release-outputs
          test -s apps/api/dist/main.js
          test -s apps/api/dist/modules/execution/reconciliation/live-demo-profit-protection.service.js
          tar -C apps/api -czf release-outputs/irexpro-api-five-second-protected-runner.tar.gz dist
          sha256sum release-outputs/irexpro-api-five-second-protected-runner.tar.gz > release-outputs/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > release-outputs/SOURCE_SHA
      - name: Retain exact SHA artifact for guarded VPS rollout
        uses: actions/upload-artifact@v4
        with:
          name: irexpro-api-five-second-protected-runner-${{ github.sha }}
          path: release-outputs/
          retention-days: 3
          if-no-files-found: error
