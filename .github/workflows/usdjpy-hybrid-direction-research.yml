name: USDJPY Hybrid Payoff Research

on:
  workflow_run:
    workflows: ['Staging Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
  STAGING_SSH_HOST: vps.lightworldtech.com
  STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
  STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
  SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

jobs:
  qualify:
    name: Qualify USDJPY hybrid payoff candidate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: irexpro-usdjpy-hybrid-payoff
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: staging

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify research relevance
        id: relevance
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --quiet --no-tags origin main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

          if [[ "$(git rev-parse origin/main)" != "$CANDIDATE_SHA" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "USDJPY_HYBRID_PAYOFF_SKIPPED reason=candidate_superseded"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parent_sha="$(git rev-parse "$CANDIDATE_SHA^1" 2>/dev/null || true)"
          changed="$(git diff --name-only "$parent_sha" "$CANDIDATE_SHA" || true)"
          research_pattern='^(\.github/workflows/usdjpy-hybrid-direction-research\.yml|services/ai-engine/app/domain/training/(single_pair_qualification|single_pair_final_test|model_qualification|train_final_event_pair_bundle)\.py|services/ai-engine/tests/test_(single_pair_qualification|single_pair_final_test|final_event_pair_bundle)\.py)$'

          if grep -Eq "$research_pattern" <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "USDJPY_HYBRID_PAYOFF_REQUIRED reason=hybrid_research_change"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "USDJPY_HYBRID_PAYOFF_SKIPPED reason=no_hybrid_research_change"
          fi

      - name: Configure pinned SSH identity
        if: steps.relevance.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Run frozen-boundary payoff qualification
        if: steps.relevance.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- $CANDIDATE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          candidate_sha="$1"
          staging='/home/lightworld/webapps/irexpro-staging'
          research_root='/home/lightworld/research/irexpro-usdjpy-hybrid-direction'
          reference_sha='8b79b373c7800998465879eef2fa03409fe49e44'
          reference="$research_root/$reference_sha"
          output="$research_root/$candidate_sha"
          boundary_file="$reference/frozen-boundary.txt"
          corpus="$reference/corpora/USDJPY_MTF.csv"
          qualification="$output/qualification.json"
          readonly pair='USDJPY'
          readonly horizon='1'

          cd "$staging"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test -z "$(git status --porcelain)"

          cd "$staging/services/ai-engine"
          python_bin='.venv/bin/python'
          test -x "$python_bin"
          export PYTHONPATH="$PWD"
          export IREXPRO_XGB_N_JOBS=4

          install -d -m 700 "$output"
          test -s "$boundary_file"
          test -s "$corpus"
          boundary="$(tr -d '[:space:]' < "$boundary_file")"
          test "$boundary" = '2026-09-27T05:00:00Z'

          echo "USDJPY_HYBRID_PAYOFF_FROZEN_BOUNDARY $boundary"
          echo "USDJPY_HYBRID_PAYOFF_REFERENCE_SHA $reference_sha"

          "$python_bin" -m app.domain.training.single_pair_qualification \
            --dataset "$pair=$corpus" \
            --horizon-bars "$horizon" \
            --decision-time-before "$boundary" \
            --report "$qualification" \
            --max-splits 3 \
            --confidence-floor 0.60 \
            | tee "$output/qualification-summary.json"

          "$python_bin" - "$qualification" <<'PY'
          import json
          import sys

          from app.domain.training.model_qualification import (
              EVENT_HYBRID_PAYOFF_EXPERIMENT_NAME,
          )

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          experiment = report["experiments"][EVENT_HYBRID_PAYOFF_EXPERIMENT_NAME]
          gate = experiment["research_gate"]
          status = "PASS" if gate["research_gate_passed"] else "HOLD"

          print(f"USDJPY_HYBRID_PAYOFF_QUALIFICATION_{status}")
          print("OBSERVED", json.dumps(gate["observed"], sort_keys=True))
          print("CHECKS", json.dumps(gate["checks"], sort_keys=True))
          print("ACTIVE_TRADES", experiment["overall"]["active_trades"])
          print(
              "WARNINGS",
              json.dumps(
                  experiment["overall"].get("evidence_sufficiency_warnings", [])
              ),
          )
          print("FROZEN_FRAME_SHA256", report["qualification_frame_sha256"])
          print("FROZEN_FRAME_ROWS", report["qualification_frame_rows"])
          if gate["research_gate_passed"]:
              print("USDJPY_HYBRID_PAYOFF_AWAIT_FUTURE_HOLDOUT")
          PY
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
