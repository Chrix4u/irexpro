name: iRexPro pre-entry winner loser research
on:
  push:
    branches:
      - fix/planb-clock-neutral-telemetry-20261111
  pull_request:
    paths:
      - apps/api/scripts/audit-owner-demo-win-loss-formation.cjs
      - apps/api/scripts/audit-owner-demo-win-loss-formation.test.cjs
      - apps/api/scripts/owner-demo-asof-candle-win-loss.cjs
      - apps/api/scripts/owner-demo-asof-candle-win-loss.test.cjs
      - apps/api/scripts/audit-owner-demo-after-1938-paper-approvals.cjs
      - apps/api/scripts/audit-owner-demo-after-1938-paper-approvals.test.cjs
      - .github/workflows/irexpro-owner-win-loss-formation.yml
permissions:
  contents: read
jobs:
  validate-frozen-entry-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate read-only entry audit
        run: node --check apps/api/scripts/audit-owner-demo-win-loss-formation.cjs
      - name: Validate causal quote candle join
        run: node --check apps/api/scripts/owner-demo-asof-candle-win-loss.cjs
      - name: Validate blocked paper-admission quote audit
        run: node --check apps/api/scripts/audit-owner-demo-after-1938-paper-approvals.cjs
      - name: Regression tests
        run: node --test apps/api/scripts/audit-owner-demo-win-loss-formation.test.cjs apps/api/scripts/owner-demo-asof-candle-win-loss.test.cjs apps/api/scripts/audit-owner-demo-after-1938-paper-approvals.test.cjs
