name: Exit Quality History Link Helper

on:
  push:
    branches:
      - feat/profit-protection-exit-quality-report-20261031
    paths:
      - '.github/workflows/exit-quality-history-link-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Add report link to closed trade history
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/app/trade/history/page.tsx')
          s = p.read_text()
          old = '''                    <Link className="button button--ghost" href="/ai/trading">
                      Back to AI Trading
                    </Link>'''
          new = '''                    <Link className="button button--secondary" href="/trade/history/profit-protection">
                      Profit Protection Exit Quality
                    </Link>
                    <Link className="button button--ghost" href="/ai/trading">
                      Back to AI Trading
                    </Link>'''
          if old not in s:
              raise SystemExit('expected history action link block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- apps/web/src/app/trade/history/page.tsx
      - name: Persist isolated history link patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'iRexPro Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web/src/app/trade/history/page.tsx
          git commit -m 'feat(web): link exit quality from trade history'
          git push origin HEAD:feat/profit-protection-exit-quality-report-20261031
