name: Trade Pipeline Diagnostic VPS

on:
  push:
    branches:
      - ops/trade-pipeline-diagnostic-20261012

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Grid-test extension specialist thresholds
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          pm2 jlist > /tmp/irex-pm2.json
          api_id=$(node -e "const x=require('/tmp/irex-pm2.json');const p=x.find(v=>v.name==='irexpro-api-staging');if(!p)process.exit(2);process.stdout.write(String(p.pm_id));")
          pm2 env "$api_id" > /tmp/irex-api-env
          getv(){ sed -n "s/^$1: //p" /tmp/irex-api-env | head -1; }
          export PGHOST="$(getv DB_HOST)" PGPORT="$(getv DB_PORT)" PGUSER="$(getv DB_USER)" PGPASSWORD="$(getv DB_PASSWORD)" PGDATABASE="$(getv DB_NAME)"
          dbssl="$(getv DB_SSL)"; if printf '%s' "$dbssl" | grep -Eqi '^(1|true|require)$'; then export PGSSLMODE=require; else export PGSSLMODE=prefer; fi
          policy='planb-v4-bi2-et2-nm2-hp3-dmw2-ts1-trr1-psrr1'

          echo '=== recent extension blocker reasons 120m ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            SELECT COALESCE(components->'extensionExhaustionShadow'->>'reason','MISSING'),count(*)
            FROM trading.ensemble_shadow_decisions
            WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
              AND evaluated_at>=now()-interval '120 minutes'
            GROUP BY 1 ORDER BY 2 DESC;"

          echo '=== extension threshold grid: resolved independent episodes + recent candidates ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH thresholds AS (
              SELECT c,d,n FROM
                unnest(ARRAY[0.60,0.62,0.64]::double precision[]) c,
                unnest(ARRAY[0.20,0.25,0.30,0.35]::double precision[]) d,
                unnest(ARRAY[0.08,0.12,0.16]::double precision[]) n
            ), all_rows AS (
              SELECT instrument,direction,evaluated_at,
                (components->'outcome'->>'resolvedAt')::timestamptz resolved_at,
                CASE WHEN components ? 'outcome' AND components->'outcome'->>'status'<>'AMBIGUOUS' AND components->'outcome'->>'netR' IS NOT NULL
                     THEN (components->'outcome'->>'netR')::double precision END realized_r,
                confidence::double precision confidence,
                (components->'governance'->>'netExpectedR')::double precision net_r,
                (components->>'directionQuality')::double precision direction_q,
                components->'governance'->>'driftState' drift,
                COALESCE((components->'governance'->>'executionSpreadEvidenceValid')::boolean,false) spread_ok,
                components->'governance'->>'eventRisk' event_risk,
                regime
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
            ), eligible AS (
              SELECT t.c,t.d,t.n,r.*
              FROM thresholds t JOIN all_rows r ON true
              WHERE r.regime='TREND_EXTENDED' AND r.drift='NORMAL' AND r.spread_ok AND r.event_risk='CLEAR'
                AND r.confidence>=t.c AND r.direction_q>=t.d AND r.net_r>=t.n
            ), resolved AS (
              SELECT * FROM eligible WHERE realized_r IS NOT NULL
            ), marked AS (
              SELECT *,max(resolved_at) OVER (PARTITION BY c,d,n,instrument,direction ORDER BY evaluated_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) prev_end
              FROM resolved
            ), episodes AS (
              SELECT * FROM marked WHERE prev_end IS NULL OR evaluated_at>prev_end
            ), perf AS (
              SELECT c,d,n,count(*) episodes,
                count(*) FILTER (WHERE realized_r>0) wins,
                count(*) FILTER (WHERE realized_r<0) losses,
                sum(realized_r) total_r,
                avg(realized_r) avg_r,
                (sum(realized_r) FILTER (WHERE realized_r>0))/NULLIF(abs(sum(realized_r) FILTER (WHERE realized_r<0)),0) pf
              FROM episodes GROUP BY c,d,n
            ), recent AS (
              SELECT c,d,n,count(*) recent_candidates
              FROM eligible WHERE evaluated_at>=now()-interval '120 minutes'
              GROUP BY c,d,n
            )
            SELECT p.c,p.d,p.n,p.episodes,p.wins,p.losses,round(p.total_r::numeric,4),round(p.avg_r::numeric,4),round(p.pf::numeric,4),COALESCE(r.recent_candidates,0)
            FROM perf p LEFT JOIN recent r USING(c,d,n)
            WHERE p.episodes>=4 AND p.total_r>0
            ORDER BY COALESCE(r.recent_candidates,0) DESC,p.pf DESC,p.episodes DESC,p.c DESC,p.d DESC,p.n DESC;"

          echo '=== recent extension-eligible rows at broad safe grid c=.60 d=.20 n=.08 (pair/side only) ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            SELECT instrument,direction,count(*),round(avg((components->'governance'->>'netExpectedR')::numeric),4),round(avg(confidence::numeric),4),round(avg((components->>'directionQuality')::numeric),4)
            FROM trading.ensemble_shadow_decisions
            WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
              AND evaluated_at>=now()-interval '120 minutes'
              AND regime='TREND_EXTENDED'
              AND components->'governance'->>'driftState'='NORMAL'
              AND COALESCE((components->'governance'->>'executionSpreadEvidenceValid')::boolean,false)
              AND components->'governance'->>'eventRisk'='CLEAR'
              AND confidence::double precision>=0.60
              AND (components->>'directionQuality')::double precision>=0.20
              AND (components->'governance'->>'netExpectedR')::double precision>=0.08
            GROUP BY instrument,direction ORDER BY instrument,direction;"

          unset PGPASSWORD
          rm -f /tmp/irex-pm2.json /tmp/irex-api-env
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
