name: Trade Pipeline Diagnostic VPS

on:
  push:
    branches:
      - ops/trade-pipeline-diagnostic-20261012

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Evaluate rejected positive-edge OOD outcomes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          pm2 jlist > /tmp/irex-pm2.json
          api_id=$(node -e "const x=require('/tmp/irex-pm2.json');const p=x.find(v=>v.name==='irexpro-api-staging');if(!p)process.exit(2);process.stdout.write(String(p.pm_id));")
          pm2 env "$api_id" > /tmp/irex-api-env
          getv(){ sed -n "s/^$1: //p" /tmp/irex-api-env | head -1; }
          export PGHOST="$(getv DB_HOST)" PGPORT="$(getv DB_PORT)" PGUSER="$(getv DB_USER)" PGPASSWORD="$(getv DB_PASSWORD)" PGDATABASE="$(getv DB_NAME)"
          dbssl="$(getv DB_SSL)"; if printf '%s' "$dbssl" | grep -Eqi '^(1|true|require)$'; then export PGSSLMODE=require; else export PGSSLMODE=prefer; fi

          policy='planb-v4-bi2-et2-nm2-hp3-dmw2-ts1-trr1-psrr1'
          echo '=== current policy cohort counts ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            SELECT count(*), min(evaluated_at), max(evaluated_at), count(*) FILTER (WHERE components ? 'outcome')
            FROM trading.ensemble_shadow_decisions
            WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}';"

          echo '=== independent resolved positive-edge OOD trend episodes ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH base AS (
              SELECT instrument,direction,evaluated_at,
                (components->'outcome'->>'resolvedAt')::timestamptz resolved_at,
                components->'outcome'->>'status' status,
                (components->'outcome'->>'netR')::double precision net_r,
                (components->'governance'->>'netExpectedR')::double precision predicted_net_r,
                (components->>'mtfStrength')::double precision mtf,
                (components->>'emaSeparation')::double precision ema,
                confidence::double precision confidence
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1'
                AND model_version='${policy}'
                AND components ? 'outcome'
                AND components->>'strategyRoute'='TREND_CONTINUATION'
                AND components->'governance'->>'driftState'='OUT_OF_DISTRIBUTION'
                AND (components->'governance'->>'netExpectedR')::double precision >= 0.08
                AND components->'outcome'->>'status' <> 'AMBIGUOUS'
                AND components->'outcome'->>'netR' IS NOT NULL
            ), marked AS (
              SELECT *,
                max(resolved_at) OVER (PARTITION BY instrument,direction ORDER BY evaluated_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) prev_episode_end
              FROM base
            ), episodes AS (
              SELECT * FROM marked WHERE prev_episode_end IS NULL OR evaluated_at > prev_episode_end
            )
            SELECT instrument,direction,count(*) episodes,
              count(*) FILTER (WHERE net_r>0) wins,
              count(*) FILTER (WHERE net_r<0) losses,
              round(sum(net_r)::numeric,4) total_net_r,
              round(avg(net_r)::numeric,4) avg_net_r,
              round((sum(net_r) FILTER (WHERE net_r>0) / NULLIF(abs(sum(net_r) FILTER (WHERE net_r<0)),0))::numeric,4) profit_factor,
              round(avg(predicted_net_r)::numeric,4) avg_predicted_net_r,
              round(avg(mtf)::numeric,4) avg_mtf,
              round(avg(ema)::numeric,4) avg_ema,
              round(avg(confidence)::numeric,4) avg_confidence
            FROM episodes GROUP BY instrument,direction ORDER BY instrument,direction;"

          echo '=== all independent positive-edge OOD trend episodes ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH base AS (
              SELECT instrument,direction,evaluated_at,
                (components->'outcome'->>'resolvedAt')::timestamptz resolved_at,
                components->'outcome'->>'status' status,
                (components->'outcome'->>'netR')::double precision net_r,
                (components->'governance'->>'netExpectedR')::double precision predicted_net_r
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1'
                AND model_version='${policy}'
                AND components ? 'outcome'
                AND components->>'strategyRoute'='TREND_CONTINUATION'
                AND components->'governance'->>'driftState'='OUT_OF_DISTRIBUTION'
                AND (components->'governance'->>'netExpectedR')::double precision >= 0.08
                AND components->'outcome'->>'status' <> 'AMBIGUOUS'
                AND components->'outcome'->>'netR' IS NOT NULL
            ), marked AS (
              SELECT *,max(resolved_at) OVER (PARTITION BY instrument,direction ORDER BY evaluated_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) prev_episode_end FROM base
            ), episodes AS (SELECT * FROM marked WHERE prev_episode_end IS NULL OR evaluated_at > prev_episode_end)
            SELECT count(*),count(*) FILTER (WHERE net_r>0),count(*) FILTER (WHERE net_r<0),
              round(sum(net_r)::numeric,4),round(avg(net_r)::numeric,4),
              round((sum(net_r) FILTER (WHERE net_r>0) / NULLIF(abs(sum(net_r) FILTER (WHERE net_r<0)),0))::numeric,4),
              round(avg(predicted_net_r)::numeric,4)
            FROM episodes;"

          echo '=== resolved normal-drift positive-edge comparison episodes ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH base AS (
              SELECT instrument,direction,evaluated_at,
                (components->'outcome'->>'resolvedAt')::timestamptz resolved_at,
                (components->'outcome'->>'netR')::double precision net_r
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1'
                AND model_version='${policy}'
                AND components ? 'outcome'
                AND components->'governance'->>'driftState'='NORMAL'
                AND (components->'governance'->>'netExpectedR')::double precision >= 0.08
                AND components->'outcome'->>'status' <> 'AMBIGUOUS'
                AND components->'outcome'->>'netR' IS NOT NULL
            ), marked AS (
              SELECT *,max(resolved_at) OVER (PARTITION BY instrument,direction ORDER BY evaluated_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) prev_episode_end FROM base
            ), episodes AS (SELECT * FROM marked WHERE prev_episode_end IS NULL OR evaluated_at > prev_episode_end)
            SELECT count(*),count(*) FILTER (WHERE net_r>0),count(*) FILTER (WHERE net_r<0),round(sum(net_r)::numeric,4),round(avg(net_r)::numeric,4)
            FROM episodes;"
          unset PGPASSWORD
          rm -f /tmp/irex-pm2.json /tmp/irex-api-env
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
