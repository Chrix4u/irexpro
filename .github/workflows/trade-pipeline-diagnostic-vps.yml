name: Trade Pipeline Diagnostic VPS

on:
  push:
    branches:
      - ops/trade-pipeline-diagnostic-20261012

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Verify post-deploy PAPER decision stream
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          app='/home/lightworld/webapps/irexpro-staging'
          cd "$app"
          echo '=== runtime ==='
          echo "head=$(git rev-parse HEAD)"
          code=$(curl -sS -o /tmp/irex-live -w '%{http_code}' --max-time 5 http://127.0.0.1:3010/api/v1/health/live || true)
          echo "api_live_http=${code}"

          pm2 jlist > /tmp/irex-pm2.json
          api_id=$(node -e "const x=require('/tmp/irex-pm2.json');const p=x.find(v=>v.name==='irexpro-api-staging');if(!p)process.exit(2);process.stdout.write(String(p.pm_id));")
          pm2 env "$api_id" > /tmp/irex-api-env
          getv(){ sed -n "s/^$1: //p" /tmp/irex-api-env | head -1; }
          export PGHOST="$(getv DB_HOST)" PGPORT="$(getv DB_PORT)" PGUSER="$(getv DB_USER)" PGPASSWORD="$(getv DB_PASSWORD)" PGDATABASE="$(getv DB_NAME)"
          dbssl="$(getv DB_SSL)"; if printf '%s' "$dbssl" | grep -Eqi '^(1|true|require)$'; then export PGSSLMODE=require; else export PGSSLMODE=prefer; fi

          echo '=== ensemble decisions since deploy ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            SELECT count(*) decisions,
              max(evaluated_at) latest_evaluated_at,
              count(*) FILTER (WHERE COALESCE(NULLIF(components->>'paperAdmitted','')::boolean,false)) paper_admitted,
              count(*) FILTER (WHERE COALESCE(NULLIF(components->'governance'->>'paperExecutionEligible','')::boolean,false)) governance_eligible,
              count(*) FILTER (WHERE (components->'governance'->>'netExpectedR')::double precision>=0.08) net_pass,
              count(*) FILTER (WHERE components->'governance'->>'driftState'='NORMAL') drift_normal,
              count(*) FILTER (WHERE COALESCE(NULLIF(components->'governance'->>'executionSpreadEvidenceValid','')::boolean,false)) spread_valid
            FROM trading.ensemble_shadow_decisions
            WHERE engine_code='irexpro-multimodel-ensemble-v1'
              AND evaluated_at >= '2026-10-12T13:28:43Z'::timestamptz;"

          echo '=== recent route/regime since deploy ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            SELECT components->>'strategyRoute',regime,count(*),
              round(max((components->'governance'->>'netExpectedR')::numeric),4),
              count(*) FILTER (WHERE components->'governance'->>'driftState'='NORMAL')
            FROM trading.ensemble_shadow_decisions
            WHERE engine_code='irexpro-multimodel-ensemble-v1'
              AND evaluated_at >= '2026-10-12T13:28:43Z'::timestamptz
            GROUP BY 1,2 ORDER BY 3 DESC;"

          unset PGPASSWORD
          rm -f /tmp/irex-live /tmp/irex-pm2.json /tmp/irex-api-env
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
