name: Trade Pipeline Diagnostic VPS

on:
  push:
    branches:
      - ops/trade-pipeline-diagnostic-20261012

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Evaluate low-positive-edge specialist bands
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          pm2 jlist > /tmp/irex-pm2.json
          api_id=$(node -e "const x=require('/tmp/irex-pm2.json');const p=x.find(v=>v.name==='irexpro-api-staging');if(!p)process.exit(2);process.stdout.write(String(p.pm_id));")
          pm2 env "$api_id" > /tmp/irex-api-env
          getv(){ sed -n "s/^$1: //p" /tmp/irex-api-env | head -1; }
          export PGHOST="$(getv DB_HOST)" PGPORT="$(getv DB_PORT)" PGUSER="$(getv DB_USER)" PGPASSWORD="$(getv DB_PASSWORD)" PGDATABASE="$(getv DB_NAME)"
          dbssl="$(getv DB_SSL)"; if printf '%s' "$dbssl" | grep -Eqi '^(1|true|require)$'; then export PGSSLMODE=require; else export PGSSLMODE=prefer; fi
          policy='planb-v4-bi2-et2-nm2-hp3-dmw2-ts1-trr1-psrr1'

          echo '=== extension NORMAL/clean independent episodes by net floor ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH base AS (
              SELECT instrument,direction,evaluated_at,
                (components->'outcome'->>'resolvedAt')::timestamptz resolved_at,
                (components->'outcome'->>'netR')::double precision realized_r,
                (components->'governance'->>'netExpectedR')::double precision predicted_r,
                confidence::double precision confidence,
                (components->>'directionQuality')::double precision direction_q
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
                AND regime='TREND_EXTENDED'
                AND components->'governance'->>'driftState'='NORMAL'
                AND COALESCE((components->'governance'->>'executionSpreadEvidenceValid')::boolean,false)
                AND components->'governance'->>'eventRisk'='CLEAR'
                AND confidence::double precision>=0.60
                AND (components->>'directionQuality')::double precision>=0.20
                AND components ? 'outcome' AND components->'outcome'->>'status'<>'AMBIGUOUS' AND components->'outcome'->>'netR' IS NOT NULL
            ), marked AS (
              SELECT *,max(resolved_at) OVER (PARTITION BY instrument,direction ORDER BY evaluated_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) prev_end FROM base
            ), episodes AS (SELECT * FROM marked WHERE prev_end IS NULL OR evaluated_at>prev_end), floors AS (
              SELECT unnest(ARRAY[0.08,0.06,0.04,0.02,0.00,-0.02]::double precision[]) floor
            )
            SELECT floor,
              count(*) FILTER (WHERE predicted_r>=floor) episodes,
              count(*) FILTER (WHERE predicted_r>=floor AND realized_r>0) wins,
              count(*) FILTER (WHERE predicted_r>=floor AND realized_r<0) losses,
              round(sum(realized_r) FILTER (WHERE predicted_r>=floor)::numeric,4) total_r,
              round(avg(realized_r) FILTER (WHERE predicted_r>=floor)::numeric,4) avg_r,
              round((sum(realized_r) FILTER (WHERE predicted_r>=floor AND realized_r>0)/NULLIF(abs(sum(realized_r) FILTER (WHERE predicted_r>=floor AND realized_r<0)),0))::numeric,4) pf
            FROM episodes CROSS JOIN floors GROUP BY floor ORDER BY floor DESC;"

          echo '=== extension recent 120m counts by net floor ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH d AS (
              SELECT (components->'governance'->>'netExpectedR')::double precision predicted_r
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
                AND evaluated_at>=now()-interval '120 minutes'
                AND regime='TREND_EXTENDED'
                AND components->'governance'->>'driftState'='NORMAL'
                AND COALESCE((components->'governance'->>'executionSpreadEvidenceValid')::boolean,false)
                AND components->'governance'->>'eventRisk'='CLEAR'
                AND confidence::double precision>=0.60
                AND (components->>'directionQuality')::double precision>=0.20
            ), floors AS (SELECT unnest(ARRAY[0.08,0.06,0.04,0.02,0.00,-0.02]::double precision[]) floor)
            SELECT floor,count(*) FILTER (WHERE predicted_r>=floor),round(max(predicted_r)::numeric,4),round(avg(predicted_r)::numeric,4)
            FROM d CROSS JOIN floors GROUP BY floor ORDER BY floor DESC;"

          echo '=== weak-persistence NORMAL/clean independent episodes by net floor ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH base AS (
              SELECT instrument,direction,evaluated_at,
                (components->'outcome'->>'resolvedAt')::timestamptz resolved_at,
                (components->'outcome'->>'netR')::double precision realized_r,
                (components->'governance'->>'netExpectedR')::double precision predicted_r
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
                AND regime='TREND_WEAK'
                AND components->'governance'->>'driftState'='NORMAL'
                AND COALESCE((components->'governance'->>'executionSpreadEvidenceValid')::boolean,false)
                AND components->'governance'->>'eventRisk'='CLEAR'
                AND confidence::double precision>=0.60
                AND (components->>'portfolioQuality')::double precision>=0.35
                AND components ? 'outcome' AND components->'outcome'->>'status'<>'AMBIGUOUS' AND components->'outcome'->>'netR' IS NOT NULL
            ), marked AS (
              SELECT *,max(resolved_at) OVER (PARTITION BY instrument,direction ORDER BY evaluated_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) prev_end FROM base
            ), episodes AS (SELECT * FROM marked WHERE prev_end IS NULL OR evaluated_at>prev_end), floors AS (
              SELECT unnest(ARRAY[0.08,0.06,0.04,0.02,0.00,-0.02]::double precision[]) floor
            )
            SELECT floor,count(*) FILTER (WHERE predicted_r>=floor),count(*) FILTER (WHERE predicted_r>=floor AND realized_r>0),count(*) FILTER (WHERE predicted_r>=floor AND realized_r<0),round(sum(realized_r) FILTER (WHERE predicted_r>=floor)::numeric,4),round(avg(realized_r) FILTER (WHERE predicted_r>=floor)::numeric,4)
            FROM episodes CROSS JOIN floors GROUP BY floor ORDER BY floor DESC;"

          echo '=== weak-persistence recent 120m counts by net floor ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH d AS (
              SELECT (components->'governance'->>'netExpectedR')::double precision predicted_r
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
                AND evaluated_at>=now()-interval '120 minutes'
                AND regime='TREND_WEAK'
                AND components->'governance'->>'driftState'='NORMAL'
                AND COALESCE((components->'governance'->>'executionSpreadEvidenceValid')::boolean,false)
                AND components->'governance'->>'eventRisk'='CLEAR'
                AND confidence::double precision>=0.60
                AND (components->>'portfolioQuality')::double precision>=0.35
            ), floors AS (SELECT unnest(ARRAY[0.08,0.06,0.04,0.02,0.00,-0.02]::double precision[]) floor)
            SELECT floor,count(*) FILTER (WHERE predicted_r>=floor),round(max(predicted_r)::numeric,4),round(avg(predicted_r)::numeric,4)
            FROM d CROSS JOIN floors GROUP BY floor ORDER BY floor DESC;"

          unset PGPASSWORD
          rm -f /tmp/irex-pm2.json /tmp/irex-api-env
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
