name: Trade Pipeline Diagnostic VPS

on:
  push:
    branches:
      - ops/trade-pipeline-diagnostic-20261012

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Inspect async market-prime recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          app='/home/lightworld/webapps/irexpro-staging'
          cd "$app"
          echo "head=$(git rev-parse HEAD)"
          echo "api_live_http=$(curl -sS -o /tmp/irex-live -w '%{http_code}' --max-time 5 http://127.0.0.1:3010/api/v1/health/live || true)"

          echo '=== scanner/provider markers after restart ==='
          raw=$(mktemp)
          pm2 logs irexpro-api-staging --lines 1800 --nostream > "$raw" 2>&1 || true
          for pat in 'live market cache primed' 'startup.*prime|prime.*market' 'Twelve Data|TWELVE_DATA' 'broker-native|MetaApi' 'No new market|market.*unavailable|market.*stale' 'Multi-model ensemble|execution=SHADOW_ONLY|paperAdmitted='; do
            printf '%s=%s\n' "$pat" "$(grep -Eic "$pat" "$raw" || true)"
          done
          grep -Ei 'live market cache primed|startup.*prime|prime.*market|Twelve Data|TWELVE_DATA|broker-native|MetaApi|No new market|market.*unavailable|market.*stale|Multi-model ensemble|execution=SHADOW_ONLY|paperAdmitted=' "$raw" \
            | tail -n 120 \
            | sed -E \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<uuid>/g' \
              -e 's/\b[0-9]{7,}\b/<long-number>/g' \
              -e 's/(token|secret|password|authorization|api[_-]?key)[=: ]+[^ ]+/\1=<redacted>/Ig' || true
          rm -f "$raw" /tmp/irex-live
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
