name: Trade Pipeline Diagnostic VPS

on:
  push:
    branches:
      - ops/trade-pipeline-diagnostic-20261012

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Measure route coverage and outcomes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          pm2 jlist > /tmp/irex-pm2.json
          api_id=$(node -e "const x=require('/tmp/irex-pm2.json');const p=x.find(v=>v.name==='irexpro-api-staging');if(!p)process.exit(2);process.stdout.write(String(p.pm_id));")
          pm2 env "$api_id" > /tmp/irex-api-env
          getv(){ sed -n "s/^$1: //p" /tmp/irex-api-env | head -1; }
          export PGHOST="$(getv DB_HOST)" PGPORT="$(getv DB_PORT)" PGUSER="$(getv DB_USER)" PGPASSWORD="$(getv DB_PASSWORD)" PGDATABASE="$(getv DB_NAME)"
          dbssl="$(getv DB_SSL)"; if printf '%s' "$dbssl" | grep -Eqi '^(1|true|require)$'; then export PGSSLMODE=require; else export PGSSLMODE=prefer; fi
          policy='planb-v4-bi2-et2-nm2-hp3-dmw2-ts1-trr1-psrr1'

          echo '=== route distribution current policy ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            SELECT components->>'strategyRoute' route, regime, count(*) decisions,
              count(*) FILTER (WHERE COALESCE((components->>'paperAdmitted')::boolean,false)) paper_admitted,
              count(*) FILTER (WHERE COALESCE((components->'governance'->>'paperExecutionEligible')::boolean,false)) governance_eligible,
              count(*) FILTER (WHERE (components->'governance'->>'netExpectedR')::double precision >= CASE WHEN components->>'strategyRoute'='EARLY_TRANSITION' THEN 0.2 ELSE 0.08 END) net_pass,
              count(*) FILTER (WHERE components->'governance'->>'driftState'='NORMAL') drift_normal,
              count(*) FILTER (WHERE components ? 'outcome') resolved_rows
            FROM trading.ensemble_shadow_decisions
            WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
            GROUP BY route,regime ORDER BY decisions DESC;"

          echo '=== recent route distribution 120m ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            SELECT components->>'strategyRoute' route, regime, count(*) decisions,
              count(*) FILTER (WHERE COALESCE((components->>'paperAdmitted')::boolean,false)) paper_admitted,
              count(*) FILTER (WHERE COALESCE((components->'governance'->>'paperExecutionEligible')::boolean,false)) governance_eligible,
              count(*) FILTER (WHERE (components->'governance'->>'netExpectedR')::double precision >= CASE WHEN components->>'strategyRoute'='EARLY_TRANSITION' THEN 0.2 ELSE 0.08 END) net_pass,
              count(*) FILTER (WHERE components->'governance'->>'driftState'='NORMAL') drift_normal
            FROM trading.ensemble_shadow_decisions
            WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}' AND evaluated_at>=now()-interval '120 minutes'
            GROUP BY route,regime ORDER BY decisions DESC;"

          echo '=== independent resolved episodes by route ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH base AS (
              SELECT instrument,direction,components->>'strategyRoute' route,evaluated_at,
                (components->'outcome'->>'resolvedAt')::timestamptz resolved_at,
                (components->'outcome'->>'netR')::double precision net_r,
                (components->'governance'->>'netExpectedR')::double precision predicted_net_r,
                components->'governance'->>'driftState' drift
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
                AND components ? 'outcome' AND components->'outcome'->>'status'<>'AMBIGUOUS' AND components->'outcome'->>'netR' IS NOT NULL
            ), marked AS (
              SELECT *,max(resolved_at) OVER (PARTITION BY route,instrument,direction ORDER BY evaluated_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) prev_end FROM base
            ), episodes AS (SELECT * FROM marked WHERE prev_end IS NULL OR evaluated_at>prev_end)
            SELECT route,count(*) episodes,count(*) FILTER (WHERE net_r>0) wins,count(*) FILTER (WHERE net_r<0) losses,
              round(sum(net_r)::numeric,4) total_net_r,round(avg(net_r)::numeric,4) avg_net_r,
              round((sum(net_r) FILTER (WHERE net_r>0)/NULLIF(abs(sum(net_r) FILTER (WHERE net_r<0)),0))::numeric,4) profit_factor,
              count(*) FILTER (WHERE drift='NORMAL') normal_drift,
              round(avg(predicted_net_r)::numeric,4) avg_predicted_net_r
            FROM episodes GROUP BY route ORDER BY route;"

          echo '=== qualified route episodes by route (predicted net + normal drift) ==='
          psql -X -v ON_ERROR_STOP=1 -P pager=off -F '|' -Atc "
            WITH base AS (
              SELECT instrument,direction,components->>'strategyRoute' route,evaluated_at,
                (components->'outcome'->>'resolvedAt')::timestamptz resolved_at,
                (components->'outcome'->>'netR')::double precision net_r
              FROM trading.ensemble_shadow_decisions
              WHERE engine_code='irexpro-multimodel-ensemble-v1' AND model_version='${policy}'
                AND components ? 'outcome' AND components->'outcome'->>'status'<>'AMBIGUOUS' AND components->'outcome'->>'netR' IS NOT NULL
                AND components->'governance'->>'driftState'='NORMAL'
                AND (components->'governance'->>'netExpectedR')::double precision >= CASE WHEN components->>'strategyRoute'='EARLY_TRANSITION' THEN 0.2 ELSE 0.08 END
            ), marked AS (
              SELECT *,max(resolved_at) OVER (PARTITION BY route,instrument,direction ORDER BY evaluated_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) prev_end FROM base
            ), episodes AS (SELECT * FROM marked WHERE prev_end IS NULL OR evaluated_at>prev_end)
            SELECT route,count(*) episodes,count(*) FILTER (WHERE net_r>0) wins,count(*) FILTER (WHERE net_r<0) losses,round(sum(net_r)::numeric,4),round(avg(net_r)::numeric,4)
            FROM episodes GROUP BY route ORDER BY route;"
          unset PGPASSWORD
          rm -f /tmp/irex-pm2.json /tmp/irex-api-env
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
