name: Temporary Cost Reporting Formatter

on:
  push:
    branches:
      - feature/cost-aware-trade-reporting-20261103

permissions:
  contents: write

jobs:
  normalize-format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '10.34.5'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Complete cost-aware report and fallback surfaces
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected exactly one replacement target, found {count}')
              path.write_text(text.replace(old, new, 1))

          # Shared report contracts.
          types = 'packages/types/src/execution.ts'
          replace_once(
              types,
              "  grossProfit: string;\n  grossLoss: string;\n  netRealisedPnl: string;",
              "  grossProfit: string;\n  grossLoss: string;\n  /** Gross realised P&L before explicit broker costs. */\n  grossRealisedPnl: string;\n  /** Net realised P&L after commission and signed swap / financing. */\n  netRealisedPnl: string;",
          )
          replace_once(
              types,
              "  totalCommission: string;\n  totalSwap: string;\n  averageHoldMinutes: number | null;",
              "  totalCommission: string;\n  totalSwap: string;\n  /** Commission magnitude minus signed swap / financing. */\n  totalExplicitCosts: string;\n  averageHoldMinutes: number | null;",
          )
          replace_once(
              types,
              "  grossProfit: string | null;\n  grossLoss: string | null;\n  netRealisedPnl: string | null;",
              "  grossProfit: string | null;\n  grossLoss: string | null;\n  /** Gross realised P&L before explicit broker costs. */\n  grossRealisedPnl: string | null;\n  /** Net realised P&L after commission and signed swap / financing. */\n  netRealisedPnl: string | null;",
          )
          replace_once(
              types,
              "  totalCommission: string | null;\n  totalSwap: string | null;\n  averageHoldMinutes: number | null;",
              "  totalCommission: string | null;\n  totalSwap: string | null;\n  /** Commission magnitude minus signed swap / financing. */\n  totalExplicitCosts: string | null;\n  averageHoldMinutes: number | null;",
          )

          # Cost-aware fallback calculations when the authoritative report feed is degraded.
          trader = 'apps/web/src/lib/trader-execution.ts'
          replace_once(
              trader,
              "function divideDecimalString(\n",
              "function costAdjustedRealisedPnl(trade: TradeExecutionView): string | null {\n  if (trade.realisedPnl === null) return null;\n  const rawCommission = trade.commission?.trim() || '0';\n  const rawSwap = trade.swap?.trim() || '0';\n  const commissionMagnitude = rawCommission.replace(/^[+-]/, '');\n  const commissionDebit = /^0(?:\\.0+)?$/.test(commissionMagnitude)\n    ? '0'\n    : `-${commissionMagnitude}`;\n  return sumExactDecimalStrings([trade.realisedPnl, commissionDebit, rawSwap]);\n}\n\nfunction divideDecimalString(\n",
          )
          replace_once(
              trader,
              "  const pnlValues = realisedTrades.map((trade) => trade.realisedPnl!).filter(Boolean);\n  const netRealisedPnl =\n    realisedTrades.length === 0 || (accountCurrency && pnlValues.length === realisedTrades.length)\n      ? sumExactDecimalStrings(pnlValues)\n      : null;",
              "  const netPnlValues = realisedTrades.map((trade) => costAdjustedRealisedPnl(trade));\n  const netRealisedPnl =\n    realisedTrades.length === 0\n      ? '0'\n      : accountCurrency && netPnlValues.every((value) => value !== null)\n        ? sumExactDecimalStrings(netPnlValues as string[])\n        : null;",
          )
          replace_once(
              trader,
              "  const netRealisedPnl = sumExactDecimalStrings(\n    realised.map((trade) => trade.realisedPnl!).filter(Boolean),\n  );",
              "  const netPnlValues = realised.map((trade) => costAdjustedRealisedPnl(trade));\n  const netRealisedPnl = netPnlValues.every((value) => value !== null)\n    ? sumExactDecimalStrings(netPnlValues as string[])\n    : null;",
          )

          # Regression: provider commission sign must not change the economic cost.
          spec = 'apps/web/src/lib/trader-execution.spec.ts'
          replace_once(
              spec,
              "  it('uses close time for trailing 24-hour realised P&L even when the trade opened earlier', () => {",
              "  it('reports fallback net P&L after commission magnitude and signed financing costs', () => {\n    const referenceTime = new Date('2026-10-15T15:16:00.000Z');\n    const trades = [\n      {\n        ...CLOSED_TRADE,\n        id: 'ctrader-costs',\n        realisedPnl: '10.00',\n        commission: '1.00',\n        swap: '-0.50',\n        openedAt: '2026-10-15T13:00:00.000Z',\n        closedAt: '2026-10-15T14:00:00.000Z',\n        createdAt: '2026-10-15T13:00:00.000Z',\n      },\n      {\n        ...CLOSED_TRADE,\n        id: 'mt5-signed-commission',\n        realisedPnl: '5.00',\n        commission: '-1.00',\n        swap: '0.25',\n        openedAt: '2026-10-15T13:30:00.000Z',\n        closedAt: '2026-10-15T14:30:00.000Z',\n        createdAt: '2026-10-15T13:30:00.000Z',\n      },\n    ];\n\n    const summary = summarizeRecentExecutionActivity(trades as any, referenceTime);\n\n    expect(summary.grossProfit).toBe('15');\n    expect(summary.netRealisedPnl).toBe('12.75');\n    expect(summary.expectancyPerTrade).toBe('6.38');\n    expect(summarizeRealisedExecutionWindow(trades as any, 20).netRealisedPnl).toBe('12.75');\n  });\n\n  it('uses close time for trailing 24-hour realised P&L even when the trade opened earlier', () => {",
          )
          replace_once(
              spec,
              "        grossProfit: null,\n        grossLoss: null,\n        netRealisedPnl: null,",
              "        grossProfit: null,\n        grossLoss: null,\n        grossRealisedPnl: null,\n        netRealisedPnl: null,",
          )
          replace_once(
              spec,
              "        totalCommission: null,\n        totalSwap: null,\n        averageHoldMinutes: null,",
              "        totalCommission: null,\n        totalSwap: null,\n        totalExplicitCosts: null,\n        averageHoldMinutes: null,",
          )

          # User-facing report cards: distinguish gross result from broker costs and spread impact.
          history = 'apps/web/src/app/trade/history/page.tsx'
          replace_once(
              history,
              "                detail={hasMixedCurrencies ? 'See currency breakdown below' : 'Profit minus realized losses'}",
              "                detail={hasMixedCurrencies ? 'See currency breakdown below' : 'After commission and swap / financing'}",
          )
          replace_once(
              history,
              "              <SummaryCard\n                label=\"Closed trades\"",
              "              <SummaryCard\n                label=\"Commission paid\"\n                value={money(summary?.totalCommission, currency)}\n                detail={hasMixedCurrencies ? 'See currency breakdown below' : 'Accumulated broker commission'}\n                tone=\"negative\"\n              />\n              <SummaryCard\n                label=\"Explicit broker costs\"\n                value={signedMoney(summary?.totalExplicitCosts, currency)}\n                detail={hasMixedCurrencies ? 'See currency breakdown below' : 'Commission minus signed financing credits'}\n                tone={pnlTone(summary?.totalExplicitCosts) === 'negative' ? 'positive' : 'negative'}\n              />\n              <SummaryCard\n                label=\"Spread impact\"\n                value=\"Included in P&L\"\n                detail=\"Bid/ask spread is already embedded in executed trading P&L; separate cash attribution requires quote-at-fill capture\"\n              />\n              <SummaryCard\n                label=\"Closed trades\"",
          )
          replace_once(
              history,
              "                      <span>Net {signedMoney(item.netRealisedPnl, item.accountCurrency)}</span>",
              "                      <span>Gross net {signedMoney(item.grossRealisedPnl, item.accountCurrency)}</span>\n                      <span>Commission {money(item.totalCommission, item.accountCurrency)}</span>\n                      <span>Net after costs {signedMoney(item.netRealisedPnl, item.accountCurrency)}</span>",
          )
          replace_once(
              history,
              "              <div><span>Commission</span><strong>{money(summary?.totalCommission, currency)}</strong></div>\n              <div><span>Swap / financing</span><strong>{signedMoney(summary?.totalSwap, currency)}</strong></div>",
              "              <div><span>Commission paid</span><strong>{money(summary?.totalCommission, currency)}</strong></div>\n              <div><span>Swap / financing</span><strong>{signedMoney(summary?.totalSwap, currency)}</strong></div>\n              <div><span>Explicit broker costs</span><strong>{signedMoney(summary?.totalExplicitCosts, currency)}</strong></div>\n              <div><span>Spread impact</span><strong>Included in executed P&amp;L</strong></div>",
          )

      - name: Format changed files
        run: |
          cd apps/api
          pnpm exec prettier --write src/modules/execution/execution-read.service.ts src/modules/execution/execution-read.trading-costs.spec.ts
          cd ../web
          pnpm exec prettier --write src/lib/trader-execution.ts src/lib/trader-execution.spec.ts src/app/trade/history/page.tsx ../../packages/types/src/execution.ts
      - name: Verify focused API cost accounting
        run: pnpm --filter @irexpro/api test -- --runInBand src/modules/execution/execution-read.trading-costs.spec.ts
      - name: Verify web fallback cost accounting
        run: pnpm --filter @irexpro/web test -- --runInBand src/lib/trader-execution.spec.ts
      - name: Verify web typecheck
        run: pnpm --filter @irexpro/web typecheck
      - name: Commit verified result
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/execution/execution-read.service.ts apps/api/src/modules/execution/execution-read.trading-costs.spec.ts apps/web/src/lib/trader-execution.ts apps/web/src/lib/trader-execution.spec.ts apps/web/src/app/trade/history/page.tsx packages/types/src/execution.ts
          git commit -m 'feat: surface net trading costs in realised reports'
          git push
