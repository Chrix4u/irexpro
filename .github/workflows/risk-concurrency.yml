name: Risk Execution Concurrency

on:
  push:
    branches:
      - sprint-32-risk-engine-production-hardening
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/risk-concurrency.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/risk-concurrency.yml'

permissions:
  contents: read

concurrency:
  group: risk-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  real-postgres-concurrency:
    name: Real PostgreSQL 16 Execution Concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55 # Docker Official Image
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: irexpro_risk_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irexpro_risk_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run real PostgreSQL concurrency suite
        working-directory: apps/api
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: ci_disposable_password
          DB_NAME: irexpro_risk_concurrency
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          COOKIE_SECRET: test_cookie_secret_min_16
        run: pnpm exec jest --config ./test/jest-pg.json --runInBand

      - name: Verify patch whitespace
        run: git diff --check origin/main...HEAD
