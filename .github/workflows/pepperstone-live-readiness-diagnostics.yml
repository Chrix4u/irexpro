name: iRexPro Pepperstone LIVE readiness diagnosis no orders
on:
  push:
    branches: ['ops/pepperstone-live-certification-readiness-20261123']
  pull_request:
    paths:
      - 'apps/api/scripts/validation/pepperstone-live-activation-readiness-ro.cjs'
      - 'apps/api/src/modules/broker/verification/pepperstone-live-activation-readiness.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-readiness-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '@irexpro/api...'
      - run: node --check apps/api/scripts/validation/pepperstone-live-activation-readiness-ro.cjs
      - run: pnpm --filter @irexpro/api exec tsc --noEmit --incremental false -p tsconfig.build.json
      - run: pnpm --filter @irexpro/api exec jest src/modules/broker/verification/pepperstone-live-activation-readiness.spec.ts --runInBand --silent --no-coverage
