name: Harden SBOM Retry Resume VPS

on:
  push:
    branches:
      - ops/harden-sbom-retry-resume-20261012

permissions:
  contents: read

concurrency:
  group: irexpro-staging-worktree
  cancel-in-progress: false

jobs:
  patch-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Patch SBOM retries without expanding target workflow expressions
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          wt='/home/lightworld/worktrees/irexpro-nonblocking-prime-20261012'
          branch='fix/nonblocking-paper-market-prime-20261012'
          expected='09601dfdde8c96c93b6fcaa9ae9ac77f8cdd152b'
          cd "$wt"
          test "$(git branch --show-current)" = "$branch"
          test "$(git rev-parse HEAD)" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/release-security.yml')
          lines=p.read_text().splitlines()
          start=lines.index('      - name: Generate repository SBOM with pinned Syft')
          upload=lines.index('      - name: Upload SBOM evidence')
          block=lines[start:upload]
          if not block or 'anchore/sbom-action@' not in '\n'.join(block):
              raise SystemExit('expected pinned SBOM action block not found')
          action_tail=block[1:]
          expr=lambda body: '$' + '{{ ' + body + ' }}'

          def action_step(name, step_id, condition=None):
              out=[f'      - name: {name}', f'        id: {step_id}']
              if condition:
                  out.append(f'        if: {expr(condition)}')
              out.append('        continue-on-error: true')
              out.extend(action_tail)
              return out

          replacement=[]
          replacement += action_step('Generate repository SBOM with pinned Syft', 'sbom_primary')
          replacement += [
              '',
              '      - name: Back off before first SBOM retry',
              '        if: ' + expr("steps.sbom_primary.outcome == 'failure'"),
              '        shell: bash',
              '        run: sleep 10',
              '',
          ]
          replacement += action_step(
              'Retry repository SBOM generation (1/2)',
              'sbom_retry_1',
              "steps.sbom_primary.outcome == 'failure'",
          )
          replacement += [
              '',
              '      - name: Back off before final SBOM retry',
              '        if: ' + expr("steps.sbom_primary.outcome == 'failure' && steps.sbom_retry_1.outcome == 'failure'"),
              '        shell: bash',
              '        run: sleep 20',
              '',
          ]
          replacement += action_step(
              'Retry repository SBOM generation (2/2)',
              'sbom_retry_2',
              "steps.sbom_primary.outcome == 'failure' && steps.sbom_retry_1.outcome == 'failure'",
          )
          replacement += [
              '',
              '      - name: Verify SBOM generation succeeded',
              '        shell: bash',
              '        run: |',
              '          set -Eeuo pipefail',
              '          test -s security-artifacts/irexpro-sbom.cdx.json',
              '',
          ]
          p.write_text('\n'.join(lines[:start] + replacement + lines[upload:]) + '\n')
          PY

          node scripts/security/check-workflow-supply-chain.mjs --self-test
          node scripts/security/check-workflow-supply-chain.mjs
          node scripts/security/check-required-ci-trigger-drift.mjs --self-test
          node scripts/security/check-required-ci-trigger-drift.mjs
          node scripts/security/check-workflow-candidate-provenance.mjs
          grep -n -A65 -B3 'Generate repository SBOM with pinned Syft' .github/workflows/release-security.yml
          git diff --check
          git add .github/workflows/release-security.yml
          git diff --cached --check
          test "$(git diff --cached --name-only)" = '.github/workflows/release-security.yml'
          git config user.name 'iRexPro Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Retry transient pinned Syft SBOM downloads'
          git push origin "HEAD:refs/heads/$branch"
          echo "SYNCED_SHA=$(git rev-parse HEAD)"
          REMOTE

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
