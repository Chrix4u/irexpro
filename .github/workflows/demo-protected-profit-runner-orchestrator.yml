name: iRexPro DEMO protected profit runner orchestration
on:
  push:
    branches: ['feat/demo-protected-runner-orchestrator-20261123']
  pull_request:
    paths:
      - 'apps/api/src/modules/execution/reconciliation/**'
      - 'apps/api/src/modules/broker/broker.service.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-runner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install API dependencies only
        run: pnpm install --frozen-lockfile --filter '@irexpro/api...'
      - name: Full API type check
        run: pnpm --filter @irexpro/api exec tsc --noEmit --incremental false -p tsconfig.build.json
      - name: DEMO broker stop, authority, hold and reconciliation regression suite
        run: pnpm --filter @irexpro/api exec jest src/modules/execution/reconciliation/demo-protected-profit-runner-orchestrator.service.spec.ts src/modules/broker/broker-demo-profit-stop-gateway.spec.ts src/modules/execution/reconciliation/demo-profit-stop-authority-sync.service.spec.ts src/modules/execution/reconciliation/verified-profit-stop-runner-policy.spec.ts src/modules/execution/reconciliation/candle-aware-profit-patience-shadow.spec.ts src/modules/execution/reconciliation/live-demo-profit-protection.service.spec.ts --runInBand --silent --no-coverage
