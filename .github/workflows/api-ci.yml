name: API CI

on:
  push:
    branches: [main, develop, feat/native-mobile-onboarding-20260930]
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/api-ci.yml'

  pull_request:
    branches: [main, develop, feat/native-mobile-onboarding-20260930]
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  lint:
    name: Lint changed API files
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed API TypeScript files
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$CANDIDATE_SHA" -- apps/api |
              grep -E '\.ts$' || true
          )
          if (( ${#files[@]} == 0 )); then
            echo "No changed API TypeScript files to lint."
            exit 0
          fi
          printf 'Linting changed API files:\n'
          printf ' - %s\n' "${files[@]}"
          rel=()
          for file in "${files[@]}"; do
            rel+=("${file#apps/api/}")
          done
          cd apps/api
          pnpm exec eslint "${rel[@]}"

  full-lint-audit:
    name: Full API lint audit
    if: github.event_name == 'push'
    continue-on-error: ${{ github.ref_name == 'feat/native-mobile-onboarding-20260930' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit full API lint baseline
        run: pnpm api:lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Keep a bounded runner timeout as a final safety net. Jest is also forced
    # to terminate after reporting the suite result because the current API
    # tests leave non-critical handles alive after all assertions complete.
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @irexpro/api exec jest --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: irexpro_test
          DB_USER: irexpro
          DB_PASSWORD: test_password
          COOKIE_SECRET: test_cookie_secret_min_16

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test]

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm api:build

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 7
