name: Exit Quality Web Integration Helper

on:
  push:
    branches:
      - feat/profit-protection-exit-quality-report-20261031
    paths:
      - '.github/workflows/exit-quality-web-integration-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Patch report auth integration and history discoverability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('apps/web/src/app/trade/history/profit-protection/page.tsx')
          s = page.read_text()
          old = "import { Alert, Button, DashboardShell, LoadingSpinner } from '@/components/ui';\n"
          new = old + "import { useAuth } from '@/context/auth-context';\n"
          if old not in s or "@/context/auth-context" in s:
              raise SystemExit('report auth import anchor missing or already patched')
          s = s.replace(old, new, 1)

          old = "export default function ProfitProtectionExitQualityPage() {\n  const [draft, setDraft] = useState<Filters>(EMPTY_FILTERS);"
          new = "export default function ProfitProtectionExitQualityPage() {\n  const { user, logout, restoring } = useAuth();\n  const [draft, setDraft] = useState<Filters>(EMPTY_FILTERS);"
          if old not in s:
              raise SystemExit('component anchor missing')
          s = s.replace(old, new, 1)

          old = "  const load = useCallback(async () => {\n    setLoading(true);"
          new = "  const load = useCallback(async () => {\n    if (!user) return;\n    setLoading(true);"
          if old not in s:
              raise SystemExit('load anchor missing')
          s = s.replace(old, new, 1)
          old = "  }, [query]);"
          new = "  }, [query, user]);"
          if old not in s:
              raise SystemExit('load dependency anchor missing')
          s = s.replace(old, new, 1)

          old = "  const summary = report?.summary;\n\n  return (\n    <DashboardShell>"
          new = """  if (restoring) {
    return <div style={{ padding: '3rem' }}><LoadingSpinner text=\"Restoring exit-quality report…\" /></div>;
  }

  if (!user) {
    return (
      <div style={{ padding: '3rem', maxWidth: 680, margin: '0 auto' }}>
        <p>Sign in to view Profit Protection exit-quality research.</p>
        <Link href=\"/login\" className=\"btn btn--primary mt-4\">Go to login</Link>
      </div>
    );
  }

  const summary = report?.summary;

  return (
    <DashboardShell user={user} onLogout={logout} activeRoute=\"/trade/history\" title=\"Reports\">"""
          if old not in s:
              raise SystemExit('dashboard shell anchor missing')
          s = s.replace(old, new, 1)
          page.write_text(s)

          spec = Path('apps/web/src/app/trade/history/profit-protection/page.spec.tsx')
          t = spec.read_text()
          anchor = "jest.mock('@/components/ui', () => ({\n"
          auth_mock = """jest.mock('@/context/auth-context', () => ({
  useAuth: () => ({ user: { id: 'user-1' }, logout: jest.fn(), restoring: false }),
}));

"""
          if anchor not in t or "jest.mock('@/context/auth-context'" in t:
              raise SystemExit('spec auth mock anchor missing or already patched')
          t = t.replace(anchor, auth_mock + anchor, 1)
          spec.write_text(t)

          history = Path('apps/web/src/app/trade/history/page.tsx')
          h = history.read_text()
          old = "            <Link href=\"/trade\" className=\"btn btn--ghost btn--sm\">Back to AI Trading</Link>"
          new = """            <Link href=\"/trade/history/profit-protection\" className=\"btn btn--secondary btn--sm\">
              Profit Protection Exit Quality
            </Link>
            <Link href=\"/trade\" className=\"btn btn--ghost btn--sm\">Back to AI Trading</Link>"""
          if old not in h:
              raise SystemExit('history discoverability anchor missing')
          h = h.replace(old, new, 1)
          history.write_text(h)
          PY
          git diff --check
          git diff -- apps/web/src/app/trade/history/profit-protection/page.tsx apps/web/src/app/trade/history/profit-protection/page.spec.tsx apps/web/src/app/trade/history/page.tsx
      - name: Persist isolated integration patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'iRexPro Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            apps/web/src/app/trade/history/profit-protection/page.tsx \
            apps/web/src/app/trade/history/profit-protection/page.spec.tsx \
            apps/web/src/app/trade/history/page.tsx
          git commit -m 'fix(web): integrate exit quality with authenticated reports'
          git push origin HEAD:feat/profit-protection-exit-quality-report-20261031
