name: PAPER Meta Calibration

on:
  push:
    branches:
      - 'ops/paper-cohort-evidence-20261009'
    paths:
      - '.github/workflows/paper-meta-calibration.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only prospective meta calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    env:
      STAGING_SSH_HOST: vps.lightworldtech.com
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/irexpro_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"

      - name: Compare predicted and realized R
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/irexpro_staging" -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          readonly API_ROOT=/home/lightworld/webapps/irexpro-staging/apps/api
          cd "$API_ROOT"
          DOTENV_CONFIG_PATH="$API_ROOT/.env" node -r dotenv/config <<'NODE'
          const { Client } = require('pg');
          const client = new Client({
            host: process.env.DB_HOST,
            port: Number(process.env.DB_PORT || 5432),
            database: process.env.DB_NAME,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            ssl: process.env.DB_SSL === 'true' ? { rejectUnauthorized: false } : false,
            connectionTimeoutMillis: 10000,
            statement_timeout: 20000,
            application_name: 'irexpro-meta-calibration-readonly',
          });

          const finite = (v) => Number.isFinite(Number(v)) ? Number(v) : null;
          const fmt = (v) => v == null || !Number.isFinite(v) ? 'NONE' : v.toFixed(4);
          const mean = (xs) => xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null;

          function collapseEpisodes(rows) {
            const bySleeve = new Map();
            for (const row of rows) {
              const key = `${row.model_version}|${row.instrument}|${row.direction}`;
              const list = bySleeve.get(key) || [];
              list.push(row);
              bySleeve.set(key, list);
            }
            const episodes = [];
            for (const list of bySleeve.values()) {
              list.sort((a,b)=>new Date(a.evaluated_at)-new Date(b.evaluated_at));
              let activeEpisodeEnd = Number.NEGATIVE_INFINITY;
              for (const row of list) {
                const outcome = row.outcome;
                if (!outcome || outcome.status === 'AMBIGUOUS') continue;
                const grossR = finite(outcome.grossR);
                const netR = finite(outcome.netR);
                const evaluatedAt = new Date(row.evaluated_at).getTime();
                const resolvedAt = new Date(outcome.resolvedAt).getTime();
                if (grossR == null || netR == null || !Number.isFinite(evaluatedAt) || !Number.isFinite(resolvedAt) || resolvedAt < evaluatedAt) continue;
                if (evaluatedAt > activeEpisodeEnd) {
                  episodes.push({...row, grossR, netR, resolvedAtMs: resolvedAt});
                  activeEpisodeEnd = resolvedAt;
                } else {
                  activeEpisodeEnd = Math.max(activeEpisodeEnd, resolvedAt);
                }
              }
            }
            return episodes;
          }

          function summarize(label, episodes) {
            const predicted = episodes.map(x=>finite(x.expected_r)).filter(x=>x!=null);
            const gross = episodes.map(x=>x.grossR);
            const net = episodes.map(x=>x.netR);
            const wins = episodes.filter(x=>x.outcome.status==='WIN').length;
            const losses = episodes.filter(x=>x.outcome.status==='LOSS').length;
            const expired = episodes.filter(x=>x.outcome.status==='EXPIRED').length;
            const predPositive = episodes.filter(x=>finite(x.expected_r) >= 0.08);
            const predNegative = episodes.filter(x=>finite(x.expected_r) < 0.08);
            console.log(`${label}|episodes=${episodes.length}|wins=${wins}|losses=${losses}|expired=${expired}|avg_predicted_gross_r=${fmt(mean(predicted))}|avg_realized_gross_r=${fmt(mean(gross))}|avg_realized_net_r=${fmt(mean(net))}|pred_ge_008=${predPositive.length}|pred_lt_008=${predNegative.length}|realized_gross_on_pred_ge_008=${fmt(mean(predPositive.map(x=>x.grossR)))}|realized_gross_on_pred_lt_008=${fmt(mean(predNegative.map(x=>x.grossR)))}`);
          }

          async function main() {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            try {
              const result = await client.query(`
                SELECT model_version, instrument, direction, evaluated_at, expected_r,
                       components->'outcome' AS outcome
                FROM trading.ensemble_shadow_decisions
                WHERE engine_code='irexpro-multimodel-ensemble-v1'
                  AND evaluated_at >= CURRENT_TIMESTAMP - INTERVAL '7 days'
                  AND components ? 'outcome'
                ORDER BY evaluated_at ASC
                LIMIT 10000
              `);
              const episodes = collapseEpisodes(result.rows);
              console.log('=== iRexPro prospective meta calibration, non-overlapping sleeve episodes ===');
              console.log(`observed_at_utc=${new Date().toISOString()}`);
              console.log(`raw_resolved_rows=${result.rows.length}|collapsed_episodes=${episodes.length}`);
              const versions = [...new Set(episodes.map(x=>x.model_version))];
              for (const version of versions) {
                summarize(`policy=${version}`, episodes.filter(x=>x.model_version===version));
              }
              summarize('all_plan_b', episodes);

              const recentBidirectional = episodes.filter(x=>String(x.model_version).includes('bidirectional-v2'));
              summarize('all_bidirectional_v2', recentBidirectional);

              const directionPass = await client.query(`
                SELECT model_version, instrument, direction, evaluated_at, expected_r,
                       components->'outcome' AS outcome
                FROM trading.ensemble_shadow_decisions
                WHERE engine_code='irexpro-multimodel-ensemble-v1'
                  AND evaluated_at >= CURRENT_TIMESTAMP - INTERVAL '7 days'
                  AND components ? 'outcome'
                  AND components ? 'directionQuality'
                  AND (components->>'directionQuality')::numeric >= 0.55
                ORDER BY evaluated_at ASC
                LIMIT 10000
              `);
              const directionEpisodes = collapseEpisodes(directionPass.rows);
              summarize('direction_quality_ge_055', directionEpisodes);
              await client.query('COMMIT');
            } catch (e) {
              await client.query('ROLLBACK').catch(()=>{});
              throw e;
            }
          }
          main().catch(e=>{console.error(`ERROR: ${e.message}`);process.exitCode=1;}).finally(()=>client.end().catch(()=>{}));
          NODE
          REMOTE

      - name: Remove SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/irexpro_staging" "$HOME/.ssh/known_hosts"
