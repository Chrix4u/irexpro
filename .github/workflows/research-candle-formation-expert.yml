name: Research - Candle Formation Expert

on:
  push:
    branches:
      - fix/planb-clock-neutral-telemetry-20261111
    paths:
      - apps/api/scripts/export-owner-demo-candle-training-corpus.cjs
      - apps/api/scripts/collect-owner-demo-forming-candle-snapshots.cjs
      - apps/api/scripts/collect-owner-demo-forming-candle-snapshots.test.cjs
      - apps/api/scripts/irexpro-forming-candle-shadow.pm2.config.cjs
      - services/ai-engine/scripts/research_candle_formation_expert.py
      - services/ai-engine/tests/test_research_candle_formation_expert.py
      - .github/workflows/research-candle-formation-expert.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-next-candle-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ai-engine/pyproject.toml
      - name: Install only research model dependencies
        run: python -m pip install "numpy>=2.1" "pandas>=2.2" "scikit-learn>=1.5" "joblib>=1.4"
      - name: Check broker data, forming-candle and PM2 syntax
        run: |
          node --check apps/api/scripts/export-owner-demo-candle-training-corpus.cjs
          node --check apps/api/scripts/collect-owner-demo-forming-candle-snapshots.cjs
          node --check apps/api/scripts/irexpro-forming-candle-shadow.pm2.config.cjs
      - name: Verify strict 15-second as-of native snapshots and no trade authority
        run: node --test apps/api/scripts/collect-owner-demo-forming-candle-snapshots.test.cjs
      - name: Verify no future-candle leakage and no broker authority
        working-directory: services/ai-engine
        run: python -m unittest discover -s tests -p test_research_candle_formation_expert.py -v
