# ============================================================
# iRexPro — Nginx staging example (AlmaLinux 9.8 / Webuzo)
# Sprint 21 → hardened Sprint 22/23 with separate admin subdomain.
#
# Verified staging topology (Sprint 23):
#   Web portal:    https://irexpro.lightworldtech.com       → 127.0.0.1:3005
#   Admin portal:  https://irexproadmin.lightworldtech.com  → 127.0.0.1:3006
#   Public API:    https://irexpro.lightworldtech.com/api/v1 → 127.0.0.1:3010
#   Realtime I/O:  https://irexpro.lightworldtech.com/socket.io/ → 127.0.0.1:3010
#   AI engine:     http://127.0.0.1:8011/api/v1              (internal ONLY — never proxied)
#
# Socket.IO note: `/realtime` is the application namespace. Engine.IO uses
# `/socket.io/` as its HTTP/WebSocket transport path unless the server is
# explicitly configured otherwise. The transport path must therefore reach
# the NestJS upstream and must not fall through to the Next.js catch-all.
#
# This file contains NO secrets. All domain names, ports, and cert paths are
# examples — replace with your real values. See
# docs/runbooks/production-deployment-vps-webuzo.md §8 for the full guide and
# docs/runbooks/realtime-ingress-security.md for the realtime ingress boundary.
#
# Install (AlmaLinux/Webuzo):
#   sudo cp infrastructure/nginx/irexpro-staging.example.conf /etc/nginx/conf.d/irexpro.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Install (Ubuntu):
#   sudo cp infrastructure/nginx/irexpro-staging.example.conf /etc/nginx/sites-available/irexpro.conf
#   sudo ln -s /etc/nginx/sites-available/irexpro.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ── Realtime single-VPS safety valves ────────────────────────────────────────
# These zones intentionally use the server name, not a caller-controlled IP
# header. The verified staging topology can sit behind Cloudflare, where
# `$remote_addr` is intentionally a Cloudflare edge until trusted real-IP
# processing is configured. A strict per-$remote_addr limiter in that state
# could group unrelated users behind one edge.
#
# These global ceilings bound how much fresh Engine.IO traffic the single Node
# process will accept. Per-client limiting belongs at a trusted edge or may be
# added to Nginx only after the real-IP boundary in
# docs/runbooks/reverse-proxy-client-ip-trust.md is verified.
limit_req_zone $server_name zone=irexpro_realtime_requests:1m rate=200r/s;
limit_conn_zone $server_name zone=irexpro_realtime_connections:1m;

# ── Upstreams ────────────────────────────────────────────────────────────────
# Match the ports in apps/api/.env (APP_PORT), apps/web/.env.local (port 3005),
# apps/admin/.env.local (port 3006), and services/ai-engine/.env (AI_ENGINE_PORT).
#
# The AI engine upstream is intentionally NOT defined here because it must NOT
# be publicly proxied. The NestJS API talks to it internally at
# http://127.0.0.1:8011. Do NOT add a public location block for the AI engine.

upstream irexpro_api {
    server 127.0.0.1:3010;     # NestJS API — APP_PORT in apps/api/.env
    keepalive 32;
}

upstream irexpro_web {
    server 127.0.0.1:3005;     # Next.js client/trader web app (apps/web)
    keepalive 16;
}

upstream irexpro_admin {
    server 127.0.0.1:3006;     # Next.js admin/back-office portal (apps/admin)
    keepalive 16;
}

# ════════════════════════════════════════════════════════════════════════════
# MAIN DOMAIN — irexpro.lightworldtech.com
# Serves the client/trader web app + public NestJS API/realtime transport.
# ════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect (main domain) ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name irexpro.lightworldtech.com;
    server_tokens off;

    # Webuzo/Certbot ACME challenge passthrough (if needed)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — main domain (web app + API + realtime) ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name irexpro.lightworldtech.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/irexpro.lightworldtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irexpro.lightworldtech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (do NOT globally hide Content-Security-Policy — the
    # frontend manages its own CSP; the API does not set one). HSTS is scoped
    # to this hostname only; do not add broader subdomain/preload policy without
    # separate operational validation of every affected hostname.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Socket.IO / Engine.IO transport — NestJS realtime gateway ────────────
    # `/realtime` is the Socket.IO namespace; `/socket.io/` is the default
    # Engine.IO transport path. Keep this explicit location before the web
    # catch-all so WebSocket handshakes and polling never route to Next.js.
    location ^~ /socket.io/ {
        # Match the application-owned Socket.IO packet ceiling and reject
        # oversized polling/handshake bodies before they reach Node.
        client_max_body_size 64k;

        # Single-VPS resource ceilings. These are intentionally server-wide,
        # not per-client, because `$remote_addr` may be a shared Cloudflare edge
        # until trusted real-IP processing is configured.
        limit_req zone=irexpro_realtime_requests burst=400 nodelay;
        limit_conn irexpro_realtime_connections 1000;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://irexpro_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # ── NestJS API (public) — ^~ takes precedence over the web catch-all ──────
    # Do NOT define a duplicate `location ^~ /` block — Nginx will reject it.
    location ^~ /api/v1/ {
        # Match the explicit Nest/Express JSON + URL-encoded parser ceiling so
        # oversized request bodies are rejected before reaching application code.
        client_max_body_size 100k;

        proxy_pass http://irexpro_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Single-hop API identity boundary: replace caller-provided forwarding
        # chains with the address Nginx actually observed. See
        # docs/runbooks/reverse-proxy-client-ip-trust.md.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # WebSocket-capable API proxy
        proxy_read_timeout 75s;

        # Payment webhooks under /api/v1/payments/webhooks/ need the full raw
        # request body for HMAC signature verification. proxy_request_buffering
        # on (the default) ensures NestJS receives the complete body before the
        # route handler runs.
        proxy_request_buffering on;
    }

    # ── Next.js web static assets (public) — immutable, cache aggressively ────
    location ^~ /_next/static/ {
        proxy_pass http://irexpro_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;

        # Nginx does not inherit server-level add_header directives when a
        # location defines its own add_header, so repeat the security contract
        # here alongside the immutable cache header.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable";
    }

    # ── Web app (public) — catch-all, proxies everything else to Next.js ──────
    location / {
        proxy_pass http://irexpro_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # Next.js HMR (dev) / WebSocket
        proxy_read_timeout 75s;
    }

    # NOTE: there is intentionally NO public location block for the AI engine
    # (port 8011). The AI engine is internal-only — the NestJS API communicates
    # with it at http://127.0.0.1:8011. Do NOT proxy /ai-engine/ or any other
    # path to the AI engine through Nginx or Cloudflare.
}

# ════════════════════════════════════════════════════════════════════════════
# ADMIN DOMAIN — irexproadmin.lightworldtech.com
# Serves the admin/back-office portal only. The admin portal calls the same
# public API (https://irexpro.lightworldtech.com/api/v1) from the browser; it
# does NOT proxy the API on this domain.
# ════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect (admin domain) ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name irexproadmin.lightworldtech.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — admin domain (admin portal only) ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name irexproadmin.lightworldtech.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/irexproadmin.lightworldtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irexproadmin.lightworldtech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is deliberately hostname-scoped. Broader subdomain/preload policy
    # requires separate operational validation of every affected hostname.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Next.js admin static assets — immutable, cache aggressively ───────────
    location ^~ /_next/static/ {
        proxy_pass http://irexpro_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;

        # Repeat inherited security headers because this location defines its
        # own Cache-Control add_header and would otherwise replace the parent set.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable";
    }

    # ── Admin portal (public) — catch-all, proxies everything else to Next.js ─
    location / {
        proxy_pass http://irexpro_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # Next.js HMR (dev) / WebSocket
        proxy_read_timeout 75s;
    }

    # NOTE: the AI engine (port 8011) is NOT proxied here either. The admin
    # portal calls the public API only; it never calls the AI engine directly.
}
