[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irexpro-mt5-connector"
version = "0.4.2"
description = "Local Windows bridge between iRexPro and a logged-in MetaTrader 5 terminal"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "keyring>=25,<26",
  "MetaTrader5>=5.0.45; platform_system == 'Windows'",
  "pystray>=0.19,<1; platform_system == 'Windows'",
  "Pillow>=10,<13; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
irexpro-mt5-connector = "irexpro_mt5_connector.main:main"
irexpro-mt5-host-worker = "irexpro_mt5_connector.host_worker:main"

[project.gui-scripts]
irexpro-mt5-desktop = "irexpro_mt5_connector.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["irexpro_mt5_connector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
